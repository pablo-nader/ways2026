  - "design.md defines 4 natural PR cut points: (1) tenancy plumbing + org tables + RLS, (2) usuarios retrofit + suspension, (3) catalogs + parametros, (4) web ABM."
  - "design.md ADR-6 and ADR-9 carry apply-time verification items (EF Core 10 keyed query filters; optional composite FK nullability). Fallbacks are defined and must be reported, not applied silently."
  - "ADR-7 overridden by user: usuario unique per tenant, mail unique global; stage 1 login is mail-based (flow B); subdomain login (flow A) deferred as designed extension point."
  - "Judgment-day INFO carried forward — Slice 2: PoliticaDeRoles.ValidarAlcanceDeTenant/ActorDeGestion have no production call site yet (by design); slice 2 endpoint wiring must consume them and must also wire ModoDeAcceso.Login before usuarios gets RLS."
  - "Judgment-day INFO carried forward — Slice 3: RlsMigrationBuilderExtensions.HabilitarRlsDeTenant interpolates the table name; add an identifier guard when it starts being called for the catalog tables."
  - "Judgment-day round 3 INFO (non-blocking): Postgres native enums get alphabetical label order (estado_tenant/estado_usuario) — never rely on ordinal comparison; extract a pure predicate for the role-bypass guard and unit-test it; WaysApiFixture doc overstates API-host coverage (no test boots the host yet); add an EntityState.Deleted tenant guard when hard deletes appear."
  - "Judgment-day verdict: Slice 1 APPROVED after 3 rounds (2026-07-31). Round 1: 2 confirmed real warnings fixed + 6 hardening + 403→404. Round 2: 1 confirmed CRITICAL (vacuous UPDATE RLS test) fixed with SQLSTATE 42501 assertions. Round 3: clean."
  - "DB CHANGE GATE #1 approved by the user 2026-07-31: (1) migration 1 (Organizacion) approved exactly as presented; (2) tenants table also gets RLS with the analogous policy (ENABLE + FORCE + USING/WITH CHECK (app_es_plataforma() OR id_tenant = app_tenant_actual())), included in migration 1; (3) seed placeholder names (\"Ways\"/\"Ways\"/\"Local 1\"/\"Local 2\") stay as-is, RolesAsignablesPor(actor, esDePlataforma) interpretation accepted as documented."
  - "Docker daemon came up mid-session (batch 3). First real run of tests/Ways.IntegrationTests: 5 failed / 2 passed. Root cause diagnosed and confirmed as a test-harness bug (WaysApiFixture.CrearContextoDeAplicacion missing InterceptorDeContextoDeTenant registration, unlike production's DependencyInjection.cs which wires it correctly via DI) — NOT a production bug. Fixed; 7/7 green, stable across two runs, 30+14 unit suites unaffected."
  - "Slice 2 batch 6: judgment-day carried-forward INFOs closed. PoliticaDeRoles.ValidarAlcanceDeTenant/ActorDeGestion now wired into ServicioDeUsuarios.BuscarAsync (defense-in-depth alongside the EF filter + RLS). ModoDeAcceso.Login now set by AuthEndpoints before usuarios gets touched, and the Usuario tenant filter has an explicit login-mode branch."
  - "Slice 2 batch 6: design gap found at apply time — the tenant-suspension check during login can't read `tenants` under ModoDeAcceso.Login (its RLS policies only ever covered `usuarios`, by design). Resolved without touching RLS: the check runs through the existing platform-mode keyed IWaysDbContext (ClavesDeContexto.Plataforma) instead of the request's login-mode context. No new anonymous-reachable read policy needed on `tenants`."
  - "Slice 2 batch 6: found and fixed a real filter bug (not a production incident, caught by new tests before merge) — Usuario's tenant query filter treated ModoDeAcceso.Ninguno (Id null, fail-closed) as matching platform accounts (IdTenant null) via null==null. Fixed by requiring Modo == Tenant explicitly on that branch. Tenant/Empresa/PuntoVenta's filters were never exposed to this since their compared column is never itself NULL."
  - "Slice 2 batch 6: EF Core 8+ PendingModelChangesWarning fires on Database.MigrateAsync() once the C# model (usuarios.id_tenant) is ahead of the migration history — expected mid-gate state. Suppressed only in WaysApiFixture's owner-migration path (test-only), confirmed safe since no existing test touches usuarios against real Postgres. Must self-resolve (no need to revert by hand) once migration 2 lands and model/snapshot agree again."
  - "DB CHANGE GATE #2 presented 2026-08-01 (see apply-progress.md batch 6 / apply result contract): additive usuarios.id_tenant + FK to tenants, ux_usuarios_usuario rebuilt as (id_tenant, usuario) NULLS NOT DISTINCT WHERE deleted_at IS NULL, new ix_usuarios_tenant index, RLS via HabilitarRlsDeTenant(\"usuarios\") plus two extra login-mode policies (usuarios_login_lectura/usuarios_login_actualiza). Awaiting user approval before migration 2 is generated."
