    notes: "Slice 1: APPROVED after judgment-day (3 rounds, 2026-07-31), merged to main as PR #2. Slice 2 (branch feat/stage1-slice2-usuarios): APPROVED after judgment-day (3 rounds, 2026-08-01), merged to main as PR #4. Slice 3 (PR 3, branch feat/stage1-slice3-catalogos, cut off up-to-date main which already includes PRs #2 and #4): CODE-COMPLETE as of batch 4 (2026-08-01), all DB gates (#3/#4/#5) approved, tasks 3.1-3.27 done. Batch 4 summary: migration 5 (Parametros) generated; 3 fiscal catalogs seeded (idempotent); full Application+API layer for the 5 tenant catalogs (ServicioDeCatalogo<T> generic + 4 thin subclasses + ServicioDeCategorias escape hatch with CTE depth/cycle validation) and the 3 fiscal catalogs (read-only); ServicioDeParametros (typed-key validation); section 3F tenant provisioning (Suplantar/ReaplicarSobreConexionAsync on ITenantActual, PlantillaDeAprovisionamiento.V1 in Domain, ServicioDeAprovisionamiento with the execution-strategy-wrapped transaction, POST /api/plataforma/tenants root-only). Two real bugs found and fixed while wiring ServicioDeCategorias against real Postgres: (1) CRITICAL — opening the raw ADO.NET connection directly for the depth/cycle CTEs bypassed EF's interceptor pipeline, so the tenant GUC never got set and RLS silently returned zero rows instead of throwing; fixed by using Database.OpenConnectionAsync()/CloseConnectionAsync() (EF-managed, invokes interceptors) instead of the raw connection's own Open/Close; (2) a batch-1 XML-doc bug in ReglaDeCategorias.ValidarProfundidad describing nivelDelPadre as an ancestor count when the actual (correct, tested) convention is the padre's 1-indexed depth — both conventions coincide only in the 'no padre' case, which is why 19 passing pure-function tests never caught it; fixed the CTE and the misleading doc comment. One honest correction on task 3.19's literal wording: fiscal-catalog writes return 404 (no route mapped, per ADR-11's own design), not 403. Full suite: 60 domain / 69 application / 39 integration, stable across 2 consecutive runs. Next: judgment-day review before opening the single PR 3 (size:exception)."
