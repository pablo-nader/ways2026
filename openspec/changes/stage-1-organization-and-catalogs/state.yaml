notes:
  - "Proposal question round resolved with the user (2026-07-31); decisions recorded in proposal.md '## Resolved product decisions' and binding for all phases."
  - "No baseline spec existed for usuarios-y-login (doc 08 predates SDD tracking): its delta spec is ADDED-only and sdd-archive must treat it as first-baseline creation, not a merge."
  - "DB Change Gate (CLAUDE.md) applies before any EF Core migration is generated during apply."
  - "Delivery decision (user, 2026-07-31): chained PRs, chain_strategy = stacked-to-main. One PR per slice (4), further split within a slice if reviewable lines exceed ~400."
  - "PR validation gate (CLAUDE.md): every PR must pass a clean judgment-day round (dual blind review, fix confirmed issues, re-judge) before merge. No human reviewer exists."
