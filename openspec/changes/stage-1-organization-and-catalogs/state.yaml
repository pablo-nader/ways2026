  - "Slice 2 batch 7: three real, previously-latent bugs found and fixed while getting Ways.IntegrationTests to actually boot the real API host (WebApplicationFactory.CreateClient()) against Postgres for the first time ever in this project (closes the 'no test boots the host yet' gap from judgment-day round 3). (1) Database.SqlQuery<T>() throws IndexOutOfRangeException inside EF Core's NavigationExpandingExpressionVisitor against this project's model — confirmed PRE-EXISTING (reproduces identically on main via a temporary git worktree), not introduced by slice 2; broke InicializadorDeBaseDeDatos.VerificarRolSinBypassAsync (ADR-5's startup role guard) the moment any test finally exercised real host startup; fixed by rewriting that method with plain ADO.NET instead of SqlQuery<T>(). (2) OnValidatePrincipal checked account validity (db.Usuarios.AnyAsync) BEFORE resolving the session's tenant/mode; once Usuario got its own tenant filter (batch 6, fails closed under ModoDeAcceso.Ninguno) this silently rejected every tenant session right after login; fixed by reordering — resolve mode/tenant from the cookie's claims first (ResolverModoDeLaSesionAsync), then check account validity. (3) WaysApiFixture's ConfigureWebHost connection-string override never reached Program.cs (minimal hosting reads builder.Configuration synchronously before WebApplicationFactory can inject it) — fixed via a process environment variable set in InitializeAsync; that then exposed a second issue (the env var is process-global and xUnit runs different test classes' fixtures in parallel by default, causing a real cross-fixture race) fixed by forcing AislamientoDeTenantTests and UsuariosYLoginTests into the same sequential xUnit collection; plus a third, smaller issue (ways_app lacked CREATE on schema public, needed for EF's always-attempted CREATE TABLE IF NOT EXISTS on __EFMigrationsHistory even when nothing is pending) fixed with a GRANT that does not weaken the RLS proof."
