db_gate: UNA-MIGRACION-APROBADA
db_gate_approval: >-
  APROBADO 2026-08-18 por el orquestador bajo mandato autonomo delegado:
  gate EJERCIDO FORMALMENTE sobre la seccion 'Modelo de datos propuesto'
  del proposal (lineas 501-741), que es EL CONTRATO — cualquier DDL de
  sdd-apply fuera de esa seccion es violacion de alcance y reabre el
  gate. ALCANCE APROBADO: UNA migracion (OrdenesDeCompraEtapa16),
  puramente ADITIVA, cero data statements, nada irreversible: UN enum
  nuevo estado_orden_compra (5 valores en orden de ciclo de vida = orden
  C#, un escritor por valor), DOS tablas nuevas — ordenes_compra (16
  columnas, PK, AK estructuralmente inviolable, 5 FKs, 2 CHECKs
  ck_..._envio_completo y ck_..._cierre, 7 indices incl. el implicito de
  la AK y el UNIQUE parcial ux_ordenes_compra_numero, RLS estandar,
  EntidadBase SI — argumentado: documento MUTABLE, al reves de los
  ledgers 14/15) e items_orden_compra (11 columnas, PK, 3 FKs, 2 CHECKs,
  4 indices incl. ux_items_orden_compra_orden, RLS estandar, EntidadBase
  SI, child-scope sin FK propia a puntos_venta — criterio verbatim de
  ItemComprobanteCompraConfiguration:12-14), UN ALTER aditivo de
  comprobantes_compra (+id_orden_compra NULL + FK compuesta MATCH SIMPLE
  + indice de soporte, metadata-only), ManejadorDeErrores MODIFICADO (2
  ramas 23505 exact-name — una es la TERCERA ocurrencia del ordering
  trap de _numero, resuelta POR ENCIMA de ClasificarUnicidad — + 4 ramas
  23514), Politicas/numeraciones/tipos_comprobante INTOCADOS. TOTAL DE
  INDICES NUEVOS = 12 (7+4+1, excluyendo los 2 PKs) con auditoria de
  cobertura FK→indice completa y cero sorpresas de la
  ForeignKeyIndexConvention esperadas.
  VERIFICACION INDEPENDIENTE DEL ORQUESTADOR previa a la aprobacion:
  (1) numeraciones_comprobante.tipo_comprobante es HasMaxLength(30) SIN
  FK a tipos_comprobante (NumeracionComprobanteConfiguration:29-30,
  54-63: solo PuntoVenta y Tenant) — la serie 'OC' cuesta cero schema y
  cero seed, la decision 4 es real; (2) el ordering trap tiene
  exactamente los 2 precedentes citados (ManejadorDeErrores.cs:128
  ux_comprobantes_venta_numero y :137 ux_comprobantes_compra_
  numero_externo, ambos exact-name antes de ClasificarUnicidad) y la
  rama de items existe (:145 ux_items_comprobante_compra_orden);
  (3) el criterio child-scope de items esta documentado verbatim
  (ItemComprobanteCompraConfiguration:13); (4) el partial unique
  precedente usa HasFilter (ComprobanteCompraConfiguration:87-89).
  NOTA ACEPTADA: ux_ordenes_compra_numero filtra SOLO numero IS NOT
  NULL, sin excluir anuladas — diferencia DELIBERADA con numero_externo:
  una serie propia jamas reusa numeros (los huecos son legitimos, el
  reuso confunde); el numero_externo es del proveedor y puede repetirse
  tras anular. CRITERIO DE VERIFY VINCULANTE: exactamente UNA migracion
  nueva llamada OrdenesDeCompraEtapa16; has-pending-model-changes limpio
  post-apply; conteo final de indices nuevos = 12 o el gate se reabre
  con enmienda; prueba de 'cero statements extra' para un confirm de
  compra SIN OC ligada (el motor intacto es la promesa central de la
  etapa); el test de concurrencia de dos enviar simultaneos en el mismo
  PV probando numeros distintos sin 409.
phases:
  explore:
    status: done
    artifact: explore.md
    depends_on: []
    notes: >-
      Greenfield real: el legacy alsina jamas tuvo OC (C3 nunca persistia,
      doc-01:203-208) — el precedente de disenio es interno. El circuito
      actual arranca en comprobantes_compra; ConfirmarAsync es el motor
      unico (una transaccion ADO, orden de locks fijo, proveedores ultimo,
      ledger de la 15 al final). La spec de reposicion-de-stock (13) dejo
      anotado "stock en transito omitido hasta que la 16 de ETA y estado"
      — la 16 es la consumidora prevista. SEIS Orchestrator Decisions al
      pie del explore.md: (1) la recepcion NO mueve stock — cada recepcion
      es un comprobante de compra ligado (la invariante del motor se
      preserva intacta); (2) 1 OC -> N comprobantes via FK
      comprobantes_compra.id_orden_compra NULL (precedente
      gastos.id_comprobante_compra); (3) desvio de precio OC vs factura
      informativo, jamas bloqueante; (4) estado_orden_compra enum nativo
      (maquina de estados de 5 valores, precedente estado_compra +
      decision 8 de la 14); (5) la formula de reposicion NO se toca —
      stock en transito queda como extension diferida con el insumo listo
      (fecha_esperada + pendientes); integracion unidireccional: pre-carga
      del borrador de OC desde la lista por proveedor; (6) anular solo
      desde borrador/enviada sin recepciones confirmadas — con recepciones
      se CIERRA, nunca se anula.
