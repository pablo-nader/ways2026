notes:
  - "Scope binding per user decisions (2026-08-02): articulos tenant-wide (NO id_empresa pattern) with disponible_para_todas flag (default true, auto-covers future empresas) + articulos_empresas junction for explicit subsets -- resolves doc 09's formerly-deferred subset-sharing limit as AVAILABILITY (visibility), not ownership. codigos_barra: N per articulo, UNIQUE (codigo, id_tenant), one barcode per articulo tenant-wide, no overrides. codigo_interno UNIQUE per tenant. precios WITH HISTORY: close-and-open on change, never overwritten, PROGRAMMABLE (future vigente_desde allowed, current-price query filters by date). listas_precio completed: modo derivada functional (resolved at read/sale time, no stored precios rows), full ABM (create/edit), General remains the only seeded default (no Empleados default -- user explicitly declined, tenants create their own). Margin-based price suggestion (costo + margen from grupo/proveedor) in the articulos ABM -- proposes, NEVER auto-applies. ABMs: dedicated field-heavy articulos screen (identification incl. barcode manager, classification, costs, availability picker, per-lista price editor with history view) + listas_precio ABM."
  - "Out of scope, explicit: ofertas (stage 4), stock/movimientos_stock (stage 5 per doc 10 sequence), legacy data migration, POS/selling flow itself."
  - "DB CHANGE GATE (CLAUDE.md) applies before any EF Core migration is generated during apply -- unconditional rule, same as stages 1-2. This stage has 4 new/changed write paths (articulos, codigos_barra, articulos_empresas, precios) -- gate summary must group them clearly."
  - "Delivery: chained PRs, stacked-to-main (session decision, per protocolo-pr-solo-dev). This is the largest catalog stage to date -- proposal explicitly flags for sdd-tasks to slice by write path (articulos -> codigos_barra -> precios -> listas ABM -> margin suggestion -> screens)."
  - "db-error-backstops compliance planned per constraint from the start (23505/23503 mappings + race tests in the same work unit as each constraint), per db-error-backstops skill and stage 1/2 precedent."
  - "Proposal question round written into proposal.md ('## Proposal question round') per sdd-propose Step 0 -- not blocking artifact creation (delegated single-shot write), but explicitly flagged for user review before spec/design lock in the resulting assumptions: (1) margin suggestion precedence grupo-vs-proveedor + base cost field, (2) multiple pending future precios rows per (articulo,lista) -- restrict to one pending at a time, (3) lista modo switch (fija<->derivada) once precios history exists -- blocked, (4) deactivating a lista referenced as id_lista_base by derived lists -- blocked, (5) codigo_interno optionality -- optional, barcode-only articulos allowed. Default assumptions stated in the proposal if no correction arrives, same pattern stage 2 used."
  - "Modified Capabilities: listas-precio-minimal gains modo=derivada resolution + full ABM (create/edit) replacing the platform-seed-only stage-2 behavior. sdd-spec may rename the capability (drop '-minimal') since the table is no longer minimal after this stage -- decided at spec time, not here."
  - "Dependencies: stage 1 & 2 (merged) -- EntidadTenant, RLS helpers, catalog machine, keyed platform context, ManejadorDeErrores contract, existing listas_precio table (modo/id_lista_base/porcentaje columns already exist unused since stage 2, no destructive schema change needed for that table). DB Change Gate approval blocking before each migration."
  - "sdd-tasks (2026-08-02): 6 chained PR slices, stacked-to-main, ~4,150-6,050 lines total, High budget risk (Slice 1 likely size:exception candidate). Slice cut deviates from design.md's prose grouping in two ways, both justified by design's own architecture decisions: (1) margin suggestion (SugeridorDePrecio) folded into Slice 2 (articulos) instead of a separate PR -- design decision 8 has it called by ServicioDeArticulos with no dependency on precios; (2) the two web screens split into independent Slices 5/6 instead of one bundled PR -- articulos screen is explicitly the heaviest to date, listas screen is light (reuses the generic catalog descriptor), no cohesion benefit from bundling. Two design open questions resolved at tasks time: (a) codigo_interno autogen format = plain numeric string, no prefix/padding, documented (not enforced) stay-under-7-digits constraint for stage 5's POS internal-vs-EAN length disambiguation; (b) derived-list depth-1 restriction = service-only this stage, consistent with every other row in design's Protection Rules table (DB-level deferred as future hardening). db-error-backstops note: ux_articulos_codigo_interno and ux_codigos_barra_codigo_tenant both contain the substring '_codigo' and would silently fall into ManejadorDeErrores's existing generic _codigo branch unless more specific checks are inserted BEFORE it (Contains-based ordering, same discipline as the existing _cuit/_numero-before-_nombre/_codigo ordering) -- flagged explicitly in tasks.md 1.10 to prevent a generic-message regression."
  - "Judgment-day verdict: Slice 1 (schema) APPROVED (2026-08-03). R1: zero behavioral findings by both judges (RLS/FKs/migration/concurrency traced and executed clean); confirmed items were documentation-only (exemption comments, FK count, doc 09/10 reconciliation with the availability model, ArticuloEmpresa manual-stamp callout) — fixed in one docs commit under the trivial-docs exemption, no re-judge round needed. Final suite: 74+142+145/145."
  - "Slice 2 MUST: stamp ArticuloEmpresa.IdTenant manually (not auto-stamped; RLS rejects 42501 if missing) and land the deferred race tests for codigo_interno_duplicado/codigo_barra_duplicado (tasks 2.8/2.9)."
  - "Slice 2 apply (2026-08-02, branch feat/stage3-slice2-articulos): both Slice 1 carried obligations closed -- ArticuloEmpresa.IdTenant IS stamped manually in ServicioDeArticulos.AgregarFilasDeSubset (the only real write path); codigo_interno_duplicado/codigo_barra_duplicado race tests landed in ArticulosEndpointsTests, exemption comments in ManejadorDeErrores rewritten to document which race is genuine (codigo_interno's autogen path is counter-serialized like clientes.numero -- the real race is the user-supplied codigo_interno, same family as ux_proveedores_cuit; codigo_barra is always genuine, no counter). INFO for Slice 3+: SugeridorDePrecio.Sugerir's descuento_proveedor parameter is a PERCENTAGE (0-100 scale, numeric(5,2), same as margen) not a raw fraction -- caught by its own unit test before the first commit (a first draft divided costoLista by (1 - descuentoProveedor) raw, producing a wildly wrong negative price for descuentoProveedor=25 meaning 'divide by -24'). availability toggle (disponible_para_todas + IdsEmpresas) rides the articulo edit (PUT) endpoint, no separate toggle route exists. ArticuloListado does not embed CodigosBarra/IdsEmpresas collections (flat shape, mirrors ClienteListado/ProveedorListado) -- availability visibility is proven via the idEmpresa list filter, not by exposing subset ids. Test-infra gotcha for future HTTP-level tests reading ArticuloListado/PrecioListado (Slice 3) or any DTO with a non-nullable enum: ReadFromJsonAsync/GetFromJsonAsync need the same OpcionesJson (JsonStringEnumConverter + PropertyNameCaseInsensitive) that CatalogosTests/OrganizacionTests already use -- the client's default JSON options don't know the server registers JsonStringEnumConverter."
  - "Judgment-day verdict: Slice 2 (articulos service/API) APPROVED (2026-08-03). R1: 2 confirmed CRITICALs, one root cause (availability rule validated transition instead of resulting state -> null NRE 500 + silent subset wipe) fixed at the domain signature level, subset exposed in read model, dedup + PK backstop. R2: both judges confirmed the fixes and one remaining gap (PK backstop race test) -> closed per their own prescription (raw-SQL fallback after honestly proving the concurrent shape structurally unreachable: the parent-row UPDATE is a de-facto mutex — beneficial discovery, documented). Orchestrator verified the test-only iteration inline; no third dual round. Final suite: 81+165+174/174."
