  - "Slice 2 apply (2026-08-02, branch feat/stage3-slice2-articulos): both Slice 1 carried obligations closed -- ArticuloEmpresa.IdTenant IS stamped manually in ServicioDeArticulos.AgregarFilasDeSubset (the only real write path); codigo_interno_duplicado/codigo_barra_duplicado race tests landed in ArticulosEndpointsTests, exemption comments in ManejadorDeErrores rewritten to document which race is genuine (codigo_interno's autogen path is counter-serialized like clientes.numero -- the real race is the user-supplied codigo_interno, same family as ux_proveedores_cuit; codigo_barra is always genuine, no counter). INFO for Slice 3+: SugeridorDePrecio.Sugerir's descuento_proveedor parameter is a PERCENTAGE (0-100 scale, numeric(5,2), same as margen) not a raw fraction -- caught by its own unit test before the first commit (a first draft divided costoLista by (1 - descuentoProveedor) raw, producing a wildly wrong negative price for descuentoProveedor=25 meaning 'divide by -24'). availability toggle (disponible_para_todas + IdsEmpresas) rides the articulo edit (PUT) endpoint, no separate toggle route exists. ArticuloListado does not embed CodigosBarra/IdsEmpresas collections (flat shape, mirrors ClienteListado/ProveedorListado) -- availability visibility is proven via the idEmpresa list filter, not by exposing subset ids. Test-infra gotcha for future HTTP-level tests reading ArticuloListado/PrecioListado (Slice 3) or any DTO with a non-nullable enum: ReadFromJsonAsync/GetFromJsonAsync need the same OpcionesJson (JsonStringEnumConverter + PropertyNameCaseInsensitive) that CatalogosTests/OrganizacionTests already use -- the client's default JSON options don't know the server registers JsonStringEnumConverter."
  - "Judgment-day verdict: Slice 2 (articulos service/API) APPROVED (2026-08-03). R1: 2 confirmed CRITICALs, one root cause (availability rule validated transition instead of resulting state -> null NRE 500 + silent subset wipe) fixed at the domain signature level, subset exposed in read model, dedup + PK backstop. R2: both judges confirmed the fixes and one remaining gap (PK backstop race test) -> closed per their own prescription (raw-SQL fallback after honestly proving the concurrent shape structurally unreachable: the parent-row UPDATE is a de-facto mutex — beneficial discovery, documented). Orchestrator verified the test-only iteration inline; no third dual round. Final suite: 81+165+174/174."
  - "Slice 3 apply (2026-08-02/03, branch feat/stage3-slice3-precios): ResolvedorDePrecios (Ways.Domain.Precios, pure), ServicioDePrecios (Ways.Application.Precios) -- AbrirNuevoPrecioAsync is the single write path (design decision 3), locks the currently-open row via raw ADO.NET SELECT...FOR UPDATE (no EF/Npgsql mapped equivalent exists), closes it, inserts the new open row, all in one transaction via CreateExecutionStrategy/BeginTransactionAsync (mirrors ServicioDeArticulos.CrearAsync). CORRECTNESS FIX found and applied before first commit: when replacing a PENDING row (confirmarReemplazo), the replaced row must close at its OWN vigente_desde (a dead, zero-width window), not at the NEW row's vigente_desde -- closing at the new row's date would leave the reemplazado price briefly visible between the two scheduled dates, contradicting 'REPLACED' in the spec scenario. Endpoints folded into ArticulosEndpoints under /api/articulos/{id}/precios (set), /precios/programados (schedule), /precios (current, all listas), /precios/{idListaPrecio} (current, one lista), /precios/{idListaPrecio}/historial. INFO for Slice 4+: derived-list depth-1 guard (orchestrator decision 2) is enforced defensively at READ time in ServicioDePrecios too (lista_base_invalida 400), not just at Slice 4's write time -- both layers protect the same invariant. task 3.13 (history immutability) is a reflection-only Application.Tests suite (Ways.Application.Tests/Precios/ServicioDePreciosSuperficieTests.cs, no DB): asserts no public method/contract exposes an existing Precio id for editing -- the DB-level exemption (no CHECK/trigger blocking a raw UPDATE) is documented, not built, per design's Testing Strategy."
  - "Slice 3 task 3.11 (db-error-backstops) honest reachability finding (SUPERSEDED by judgment-day round 1, item 2 below -- kept for the historical record of the pre-advisory-lock design): the ux_precios_vigente first-price race is genuine by construction (no row exists yet for SELECT...FOR UPDATE to lock) but is NOT reliably reproducible with a bare Task.WhenAll over 2 POSTs -- empirically confirmed (5/5 isolated single-test runs exposed the 409, but 3/3 full-class runs gave 2x201 with zero exceptions: a warm connection pool/JIT state lets the first request fully commit before the second's own SELECT...FOR UPDATE runs, so the second legitimately sees the first's committed row and does a normal close-and-open instead of colliding). Same underlying mechanism as ParametrosTests' judgment-day-round-2 finding. Resolved originally with the SAME fix as ParametrosTests: a deterministic DbCommandInterceptor rendezvous (PreciosEndpointsTests.InterceptorDeRendezVousListasPrecio, mirrors ParametrosTests.InterceptorDeRendezVous) holding the two EF-issued listas_precio SELECTs until both requests arrive, forcing genuine transaction overlap regardless of pool warmth."
  - "Slice 3 judgment-day round 1 (2026-08-03, branch feat/stage3-slice3-precios, both blind judges converged -- money-path code): item 1 CRITICAL (2 failure modes, predecessor re-close on pending replacement) -- AbrirNuevoPrecioAsync now locates the PREDECESSOR row (whose vigente_hasta == the replaced pending row's original vigente_desde) and re-closes it at the new row's effective vigente_desde inside the same transaction (ServicioDePrecios.ReabrirLimiteDelPredecesorAsync); a real bug was found and fixed WHILE testing this fix itself -- the predecessor search must EXCLUDE the just-closed pending row's own id, because a dead-window close sets vigente_hasta == vigente_desde == the search key, so the query could match the pending row itself and re-open it (caught by the PRE-EXISTING ProgramarUnSegundoPrecioPendienteSinConfirmarDevuelve409YConConfirmarReemplaza test regressing before the id exclusion was added). item 2 CONFIRMED (true serialization) -- replaced the mutable-row SELECT...FOR UPDATE with a per-pair pg_advisory_xact_lock(idTenant, hash(idArticulo,idListaPrecio)) taken FIRST in the transaction (TomarLockDelParAsync/ClaveDeLockDePar); the hash is plain integer arithmetic (idArticulo*397 ^ idListaPrecio), deliberately NOT HashCode.Combine (that incorporates a per-process random seed, so two app instances -- or the same one after a restart -- would compute different keys for the identical pair and the lock would stop serializing them against each other); a key2 collision between two DIFFERENT pairs of the same tenant is tolerable (over-serializes, never a correctness bug, because the actual row state is always read AFTER the lock, never derived from the hash). This makes the ux_precios_vigente HTTP race UNREACHABLE via the service (the waiter now sees committed state and does a legitimate close-and-open) -- the race test was adapted (renamed LaCreacionConcurrenteDeDosPrimerosPreciosSeSerializaYAmbosSuceden, asserts 2x201 instead of 1x201+1x409) and a new test covers the previously-already-protected already-priced-pair case (LaModificacionConcurrenteDeUnPrecioYaExistenteSeSerializaYAmbosSuceden), both stable across 3 isolated reruns. item 3 CONFIRMED (post-lock timestamp) -- 'ahora' is now captured once, AFTER the advisory lock (never before entering the transaction, which is what EstablecerPrecioAsync used to do by passing reloj.Ahora to AbrirNuevoPrecioAsync BEFORE BeginTransactionAsync) -- AbrirNuevoPrecioAsync's vigenteDesde parameter became nullable (null = immediate, resolved from the post-lock 'ahora'; a value = programado, honored as given). item 4 DEFENSIVE (derived resolution hardening) -- ResolvedorDePrecios.ResolverPrecioDerivado now rejects a negative computed result with ErrorDominio('precio_derivado_invalido', 422) instead of returning a silent negative price; ServicioDePrecios.ResolverPrecioAsync replaced `lista.Porcentaje!.Value` with an explicit null-coalescing throw using the SAME error code. FORWARD OBLIGATION FOR SLICE 4: ServicioDeListasPrecio MUST reject `porcentaje <= -100` at lista WRITE time so this read-time guard becomes unreachable in normal operation (it stays as defense-in-depth, same precedent as the derived-list depth-1 guard). item 5 SUGGESTIONS -- (a) added a cross-tenant HTTP test using a REAL other-tenant articulo id across all three price GET routes (ConsultarPreciosDeUnArticuloRealDeOtroTenantDevuelve404EnLasTresRutasDeGet); (b) the inactive-lista divergence between PrecioVigenteAsync (resolves any lista by explicit id, active or not) and PreciosVigentesAsync (filters Activo) was kept DELIBERATE and documented in both doc-comments, with a dedicated test proving it (UnaListaInactivaResuelvePorIdExplicitoPeroNoApareceEnElListadoDeTodas); (c) the N+1 in PreciosVigentesAsync got an INFO doc-comment flagging it for the POS catalog stage (stage 5), not refactored now. Final suite: 86/170/193 (Domain/Application/IntegrationTests), stable across 2 full IntegrationTests runs + the 4 new/adapted temporal/race tests isolated 3x."
  - "Judgment-day verdict: Slice 3 (pricing engine) APPROVED after 4 rounds (2026-08-03) — the most contested component of the project. R1: 1 CRITICAL (stale predecessor boundary -> overlap AND gap via ordinary admin sequences) + EvalPlanQual race analysis + pre-lock timestamp -> fixed with predecessor re-close, pg_advisory_xact_lock per pair, post-lock ahora. R2: new CRITICAL from the fix itself (asymmetric predecessor-boundary validation -> inverted intervals) -> symmetric validation + GATE-APPROVED ck_precios_ventana_valida (>= per user-confirmed deviation: empty windows are designed state). R3: new CRITICAL (ambiguous predecessor query could resurrect dead rows on same-date reprograms) -> dead-row exclusion + deterministic ORDER BY. R4: CLEAN x2. Final suite: 86+170+196/196."
  - "Slice 4 judgment-day round 1 (2026-08-03, branch feat/stage3-slice4-listas, both blind judges converged): item 1 CRITICAL (scope-aware es_default swap) -- ActualizarAsync now forbids changing IdEmpresa on a row that currently holds EsDefault=true (source-scope protection: same lista_default_requiere_reemplazo error as removing the flag without a same-request replacement, simpler-and-documented option per the verdict instead of building full source-scope reassignment) and the swap trigger widened to `datos.EsDefault && (!actual.EsDefault || datos.IdEmpresa != actual.IdEmpresa)` so a scope move that legitimately becomes possible (only reachable today when actual.EsDefault was false) still desmarca the DESTINATION scope, never the source. item 2 REAL (upper porcentaje bound) -- added [Theory] cases 1000/1500 asserting porcentaje_invalido (the existing ExigirPorcentajeValido already enforced the >=1000 bound; only the test coverage was missing). item 3 SUGGESTION (empresa-scope default race) -- mirrored the shared-scope race test against ux_listas_precio_default_empresa (two candidatas of the SAME id_empresa PUT EsDefault:true concurrently -> exactly one 200 + one 409 default_duplicado). item 4 RESOLVED spec drift -- specs/listas-precio-minimal/spec.md's 'Blocked Mode Switch Once History Exists' requirement dropped the never-designed/never-implemented derivada read-resolution clause (design.md's Protection Rules table and tasks 4.1 only ever scoped the guard to precios history, which a derivada lista never accumulates by design) with a superseded-note recorded in the spec itself. INFO for future slices: (a) inactive-base references are allowed for NEW derivadas today (ValidarModoAsync's listaBase lookup does not filter Activo) -- this is consistent with how the resolver already reads/writes an inactive base's price, so it was left as-is; an explicit product decision is still pending if this ever matters in practice. (b) fk_listas_precio_lista_base remains a simple (non-composite) self-FK -- the service-level depth-1 + same-tenant pre-check (ValidarModoAsync, tenant-scoped via the EF global filter) is the real protection; composite hardening (mirroring ak_listas_precio_id_lista_precio_id_tenant's pattern) would need a DB CHANGE GATE-approved migration and is left as a future option, not required by any current test gap. Full suite: 86/190/213 (Domain/Application/IntegrationTests, +0/+2/+4 over the pre-round baseline), stable across 2 full runs + 3 isolated reruns of the new/changed es_default tests."
  - "Slice 4 judgment-day round 2 correction (2026-08-03) on round 1's item 1 note above: the round-1 trigger wording `datos.EsDefault && (!actual.EsDefault || datos.IdEmpresa != actual.IdEmpresa)` oversold the `|| datos.IdEmpresa != actual.IdEmpresa` disjunct as doing real work -- it is provably dead by the time execution reaches that line: when actual.EsDefault is false, `!actual.EsDefault` alone is already true and short-circuits the OR; when actual.EsDefault is true, the source-scope guard immediately above already threw for any IdEmpresa change, so that branch of the OR can never be reached with actual.EsDefault true. Simplified in round 2 to `!actual.EsDefault && datos.EsDefault` (still `DesmarcarDefaultActualAsync(datos.IdEmpresa, ...)` targeting the DESTINATION scope -- unchanged behavior, dead condition removed) and the doc-comment rewritten to describe reality: the source guard blocks scope moves of current defaults, the swap handles promotions including promote-while-moving, always desmarcando the destination. No behavioral change -- readability/dead-code finding only. R2 also gave the source-scope guard its own Spanish message instead of reusing the drop-default message, and added a promote+move happy-path integration test."
  - "Judgment-day verdict: Slice 4 (listas de precio) APPROVED (2026-08-03). R1: 1 CRITICAL confirmed by both judges (es_default swap bypassed by scope move -> source scope orphaned with zero defaults) fixed via forbid-and-document + three-direction tests + empresa-scope race + spec mode-switch prose aligned to binding design (orchestrator decision: read-resolution tracking waived). R2: B CLEAN, A flagged dead disjunct + missing promote-and-move happy-path test -> simplified, narrative corrected, test added; orchestrator verified inline. Final suite: 86+190+214/214."
