    notes: "Slice 1 (schema/domain foundation) COMPLETE, judgment-day round 1 clean, merged to main via PR #16. Slice 2 (articulos + codigos_barra + articulos_empresas + margin suggestion) COMPLETE, judgment-day rounds 1+2 clean, merged to main via PR #18. Slice 3 (precios — history engine) COMPLETE, judgment-day rounds 1-4, merged to main via PR #20. Slice 4 (listas de precio ABM) COMPLETE and runtime-verified on branch feat/stage3-slice4-listas (off main, no push/PR yet): NO database changes (listas_precio's modo/id_lista_base/porcentaje columns already existed unused since stage 2, confirmed before starting; `dotnet ef migrations has-pending-model-changes` clean). ServicioDeListasPrecio extends ServicioDeCatalogo<ListaPrecio,ListaPrecioListado,ListaPrecioAlta> (design decision 2's 'on top' wording, same escape-hatch shape as ServicioDeCategorias) — overrides CrearAsync/ActualizarAsync/EliminarAsync for: derivada base/porcentaje requirement + depth-1 guard + porcentaje>-100 (closes the Slice-3-forward obligation, ResolvedorDePrecios.ResolverPrecioDerivado's read-time guard is now unreachable in normal operation, kept as defense in depth); mode-switch blocked with precios history; deactivation/soft-delete blocked while referenced as an active derivada's base; es_default SWAP semantics (assigning true atomically unsets the prior default in the same IdEmpresa scope via two sequential SaveChangesAsync inside one transaction, old row first) with a protected-default-row guard (edit-away/deactivate/delete all blocked without a same-request replacement) since the spec is silent on protecting the default row but stage 2's unmodified 'One Default List Per Tenant' requirement would otherwise break — decided to protect ANY EsDefault=true row generically (not hardcoded to General), mirroring ReglaDeClientes.ValidarNoConsumidorFinal's shape applied to a predicate. Routes reuse the existing generic MapearCatalogo<T,TListado,TAlta,TServicio> helper at /api/catalogos/listas-precio (no dedicated endpoints file, same precedent as categorias) — the stage 2 GET /api/listas-precio read-only selector stays untouched, no collision. Added protected Reloj property to ServicioDeCatalogo<T,TListado,TAlta> (mirrors the existing Db property) so a subclass can stamp UpdatedAt on a row outside the standard Instanciar/AplicarPropios flow without CS9107. DEVIATION from tasks.md 4.1/4.2 (documented in code, Contratos.cs doc-comment): a single ListaPrecioAlta contract is reused for create+edit (ADR-11 convention) instead of the originally-named split AltaListaPrecio/EdicionListaPrecio, because the generic ServicioDeCatalogo base binds one TAlta type to both CrearAsync/ActualizarAsync and splitting would have abandoned the generic-reuse design decision 2 explicitly asked for. db-error-backstops: ux_listas_precio_default_compartido/empresa's race-test exemption (recorded since stage 2, 'no client write path yet') closes here — ServicioDeListasPrecio.DesmarcarDefaultActualAsync is the real write path; the genuine race (two DIFFERENT listas in the same scope both PUT EsDefault:true concurrently) needs NO extra locking (unlike ServicioDePrecios' pg_advisory_xact_lock) — the shared 'unset old default' row naturally serializes the two writers via Postgres's ordinary row lock, the second writer resumes seeing the first's committed win and its own SaveChangesAsync collides with the unique partial index for a genuine 23505 -> 409 default_duplicado (ManejadorDeErrores comment updated). Full suite: 86/86 Domain (+0), 188/188 Application (+18), 209/209 IntegrationTests (+13), stable across 2 full runs + 3 isolated reruns of the es_default race test. Ready for judgment-day review before PR. Slices 5-6 remain not_started."
