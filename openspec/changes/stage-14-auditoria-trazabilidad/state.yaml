db_gate: UNA-MIGRACION-APROBADA
db_gate_amendment_1: >-
  ENMIENDA 1 APROBADA 2026-08-16 (orquestador, mandato autonomo delegado,
  patron de las 3 enmiendas del gate de la etapa 12): la migracion
  AuditoriaEtapa14 lleva DOS indices de soporte de FK adicionales a los 3
  del contrato — ix_auditoria_id_actor (id_actor) e ix_auditoria_punto_venta
  (id_punto_venta, id_tenant) — generados por la ForeignKeyIndexConvention
  de EF Core, no suprimible en model-time (RemoveIndex sincronico post
  HasForeignKey no persiste: el batch de convenciones lo re-agrega,
  verificado empiricamente por el apply). Fundamento de la aprobacion:
  (1) el ix_auditoria_actor del contrato lidera por id_tenant, asi que NO
  cubre fk_auditoria_actor por prefijo — el indice de soporte es el
  comportamiento estandar; (2) es el patron que TODA FK del schema ya
  tiene (ix_movimientos_stock_empleado et al.) y ningun gate previo conto
  esos indices por separado; (3) cero semantica nueva — ni tabla, ni
  columna, ni constraint: solo soporte mecanico de FK con naming doc-10
  snake_case explicito. El resto de la migracion verificado verbatim
  contra proposal SA por el apply. Total final: 5 indices (3 del contrato
  + 2 de soporte de FK).
db_gate_approval: >-
  APROBADO 2026-08-16 por el orquestador bajo mandato autonomo delegado:
  gate EJERCIDO FORMALMENTE sobre la seccion 'Modelo de datos propuesto'
  del proposal (lineas 453-611), que es EL CONTRATO — cualquier DDL de
  sdd-apply fuera de esa seccion es violacion de alcance y reabre el gate.
  ALCANCE APROBADO: UNA migracion (AuditoriaEtapa14), UNA tabla nueva
  `auditoria` (10 columnas, pk_auditoria bigint GENERATED BY DEFAULT AS
  IDENTITY, 3 FKs, 2 CHECKs de no-vacio, 3 indices, RLS estandar
  HabilitarRlsDeTenant sin desvio), CERO ALTER sobre tablas/enums/tipos
  existentes, CERO data statements. VERIFICACION INDEPENDIENTE DEL
  ORQUESTADOR previa a la aprobacion: (1) la FK compuesta
  fk_auditoria_punto_venta (id_punto_venta, id_tenant) NO esconde un ALTER
  — la AK ak_puntos_venta_id_punto_venta_id_tenant existe desde la
  migracion 20260801011312_Organizacion (verificado contra el schema
  real); MATCH SIMPLE hace que la fila con PV NULL no chequee la
  constraint, y la integridad de tenant queda en fk_auditoria_tenant —
  correcto por semantica de PG. (2) Scoping doc-09: operativa con
  id_punto_venta nullable, desviacion JUSTIFICADA (eventos tenant-wide:
  precio/usuario) y no asumida; id_tenant es el del SUJETO auditado, no el
  del actor. (3) Sin EntidadBase — precedente movimientos_stock. (4)
  creado_el SIN DEFAULT now(): IRelojDelSistema unica fuente de tiempo
  (un default rompe RelojFijo en silencio). (5) accion text + CHECK con
  catalogo en aplicacion — ALTER TYPE ADD VALUE es irreversible (probado
  en la 12), decision correcta. (6) db-error-backstops RESUELTO: ningun
  23505 nuevo (sin unique — dos hechos identicos son historia legitima);
  los 3 FK cubiertos por el mapeo generico fk_*/23503 → referencia_invalida
  existente (ManejadorDeErrores.cs:224) con exencion documentada
  (id_actor server-derived + usuarios soft-delete) y test de SQLSTATE
  igual exigido; ManejadorDeErrores NO se toca. NO-DECISIONES RATIFICADAS:
  sin unique, sin particion/retencion (3 tripwires medibles registrados),
  sin GIN sobre jsonb, sin indice sobre accion, sin inmutabilidad a nivel
  DB (REVOKE seria teatro con el carryover de ways_owner superusuario —
  residuo honesto registrado), sin id_actor en precios (la tabla externa
  ES la decision 1). Criterio de verify vinculante: exactamente UNA
  migracion nueva nombrada AuditoriaEtapa14; has-pending-model-changes
  limpio post-apply; VentasCheckoutTests con su constante 16 byte-identica
  (el checkout NO se toca — decision 4, por alcance).
phases:
  explore:
    status: done
    artifact: explore.md
    depends_on: []
    notes: >-
      Hallazgo central: los tres ledgers inmutables existentes
      (movimientos_stock, movimientos_cuenta_corriente, precios con
      historia) ya son auditoría parcial — el gap real está CONCENTRADO en
      precios (cero actor) y cambios de rol (cero actor, cero valor
      anterior), más el caso borde de anulación de comprobante 100%
      servicio sin CC (sin rastro de quién). IContextoDeUsuario disponible
      en los seis servicios candidatos: el gap nunca es "no tengo el
      usuario", es "no lo persisto". Tensión del checkout resuelta por
      precedente: INSERT crudo vía ExecuteNonQueryAsync sin RETURNING es
      invisible al guard de 16 queries (doc-comment de
      InsertarMovimientoStockAsync). Recomendación: tabla única
      `auditoria` (accion/entidad/id_entidad + jsonb valor_anterior/nuevo)
      escrita en la MISMA transacción. 7 preguntas listadas para el
      proposal (retención, primera pasada, autorización de lectura,
      naming JSON snake_case vs PascalCase heredado, etc.).
  propose:
    status: done
    artifact: proposal.md
    depends_on: [explore]
    notes: >-
      8 decisiones autónomas con opciones, tradeoffs y costo de revertir.
      (1) Tabla única `auditoria`, id_tenant NOT NULL del SUJETO auditado (no
      del actor) + id_punto_venta NULL para eventos tenant-wide — una tabla,
      no dos. (2) Payload acotado y documentado por acción, nunca dump de
      fila: el argumento decisivo es de seguridad (un dump de `usuarios`
      metería hash_password en una tabla append-only legible por Admin);
      regla de subconjunto de claves valor_anterior ⊆ valor_nuevo, testeable.
      (3) SIN retención ni partición, con 3 tripwires medibles y el costo de
      diferir explicitado (PG no convierte una tabla poblada a particionada
      in place). (4) MISMA transacción, fail-closed: la operación que no se
      puede auditar no ocurre; el checkout NO se toca por ALCANCE (emitir no
      es operación sensible; el doc nombra anulaciones) — corrección factual
      al explore: el interceptor solo cuenta ReaderExecuting*, así que
      ExecuteScalarAsync TAMBIÉN es invisible al guard. (5) Primera pasada =
      12 acciones en 6 servicios (las 5 del doc + ciclo de vida de usuarios);
      transferencia EXCLUIDA por razón estructural (origen y destino no
      entran en un solo id_punto_venta). (6) Policy nueva LecturaDeAuditoria,
      Admin-only, sin apilar (precedente LecturaDeRentabilidad): un
      Supervisor no lee el log que registra Supervisores. (7) jsonb con
      claves snake_case vía JsonSerializerOptions propio del writer (NO
      global); `detalle text` de reliquidación NO se migra. (8) `accion` es
      text + CHECK no-vacío con catálogo en la aplicación, NO enum nativo —
      ALTER TYPE ADD VALUE es irreversible (probado en la 12) y el catálogo
      crece con cada etapa futura.
      Veredicto de gate propuesto: UNA migración (`AuditoriaEtapa14`), UNA
      tabla nueva, cero ALTER sobre tablas/enums existentes, cero backfill.
      db-error-backstops resuelto: ningún 23505 nuevo (sin unique index);
      los 3 FK quedan cubiertos por el mapeo genérico fk_*/23503 →
      referencia_invalida ya existente (ManejadorDeErrores.cs:224), con
      exención documentada (id_actor siempre server-derived, usuarios es
      soft-delete). Modelo desafiado contra el explore: PK bigint GENERATED
      BY DEFAULT (no ALWAYS, convención del repo), creado_el SIN DEFAULT
      now() (IRelojDelSistema es la única fuente de tiempo), valor_nuevo NOT
      NULL, 3 índices justificados y GIN/accion/partición como no-decisiones.
      Contrato de capabilities: 1 nueva (`auditoria-de-operaciones`, dueña
      del catálogo de acciones y de toda la cobertura) + 3 deltas (`precios`,
      `comprobantes-venta`, `comprobantes-compra`); explícitamente NO se
      tocan stock, conteo-de-inventario, lotes-y-vencimientos,
      reliquidacion-a-precio-del-dia, usuarios-*, exportacion-de-reportes.
      Plan tentativo: 7 slices stacked-to-main, ~2.350 líneas, riesgo de
      presupuesto Medium, sin size:exception previsto (split 1a/1b
      pre-autorizado para la slice de la migración).
  spec:
    status: done
    artifact: specs/
    depends_on: [propose]
    notes: >-
      1 capability nueva (`auditoria-de-operaciones`, spec completa, 7
      requirements): fila append-only con id_tenant del sujeto auditado (no
      del actor) + RLS estandar sobre la conexion ways_app (bloqueo
      cross-tenant, INSERT con id_tenant ajeno rechazado 42501); escritura
      misma-transaccion fail-closed con dos escenarios discriminantes
      (precio.cambio vs venta.anulacion) mas el escenario del guard de 16
      queries del checkout INTACTO como criterio observable; catalogo de 12
      acciones/6 servicios con "una operacion, una fila" (incluye el
      close/reopen de precio como una sola fila), stock.transferencia
      excluido por razon estructural, conteo sin diferencia sin fila de
      auditoria; contrato de payload acotado por accion con la regla
      valor_anterior ⊆ valor_nuevo y denylist explicito de hash_password;
      consulta GET /api/auditoria filtrable/paginada bajo LecturaDeAuditoria
      (Admin 200 cross-PV, Supervisor 403, Vendedor 403, filas PV NULL bajo
      "todos"); export sibling verbatim sobre el contrato de la etapa 11
      (refusal at cap, paridad de figuras, 403 heredado por co-locacion).
      3 deltas ADDED (no MODIFIED, siguiendo la clasificacion explicita del
      proposal): `precios` (cambio de precio atribuible, fail-closed sobre
      el mismo AbrirNuevoPrecioAsync), `comprobantes-venta` (anulacion
      atribuible con el escenario flagship 100%-servicio-sin-CC),
      `comprobantes-compra` (anulacion atribuible en la misma transaccion
      que los contramovimientos). Decision de redaccion: el caso
      100%-servicio-sin-CC aparece dos veces con enfoques distintos —
      cobertura/fila (auditoria-de-operaciones) vs comportamiento propio de
      anulacion (comprobantes-venta) — no es duplicacion, son dos
      requirements distintos. No se tocaron specs de stock,
      conteo-de-inventario, lotes-y-vencimientos,
      reliquidacion-a-precio-del-dia, usuarios-*, exportacion-de-reportes
      (consumida verbatim, no modificada), segun el contrato de
      capabilities del proposal.
  design:
    status: done
    artifact: design.md
    depends_on: [propose]
    notes: >-
      17 decisiones numeradas, cero DDL nuevo (la seccion del gate es
      contrato intocable). (1) DOS MODOS, UN CONTRATO: Registrar(...)
      sincronico encola la entidad en el MISMO SaveChangesAsync del llamador
      EF; RegistrarAsync(conexion, transaccion, ...) hace UN INSERT sin
      RETURNING sobre la conexion Y transaccion del llamador ADO
      (convencion EscriturasDeCuentaCorriente/InsertarMovimientoStockAsync).
      El writer JAMAS abre transaccion, ni SaveChanges, ni Commit. Razon
      decisiva: 4 de los 5 caminos de ServicioDeUsuarios NO tienen
      transaccion explicita (solo SaveChangesAsync), asi que un INSERT crudo
      ahi autocommitearia y romperia fail-closed en las dos direcciones.
      (2) id_actor y creado_el NO son parametros: los estampa el writer
      desde contexto/reloj — 11 call sites no pueden equivocarlos y la
      exencion del gate §B (id_actor server-derived) queda estructural.
      (3) Invariantes (subset, denylist, snake_case) en el CONSTRUCTOR de
      RegistroDeAuditoria (Domain puro): un registro ilegal no es
      construible. (4) AccionAuditada = sealed record (Accion, Entidad) con
      12 constantes + Todas: el catalogo fija el PAR, no el verbo.
      (5) Payload = diccionario construido por 12 fabricas puras; NINGUNA
      acepta una entidad ⇒ un dump de fila es irrepresentable (la defensa de
      hash_password es de tipos, la denylist es backstop). (6) UN
      JsonSerializerOptions compartido por los dos modos con
      DictionaryKeyPolicy (NO PropertyNamingPolicy, que sobre un diccionario
      es un no-op que parece decision) + JsonStringEnumConverter snake_case
      ⇒ los enums serializan con su etiqueta de base ("emitido"/"activo").
      (7) Auditoria NO hereda EntidadTenant (arrastraria EntidadBase, que el
      gate prohibe): filtro propio clonado de MovimientoStock y id_tenant
      escrito EXPLICITO — EstamparTenant() lo pisaria con el tenant de la
      SESION, convirtiendo en silencio la decision 1 del proposal ("tenant
      del sujeto") en su contraria. (8) MarcarAnuladoAsync de ventas pasa a
      RETURNING id_punto_venta / int? (precedente exacto:
      ServicioDeTurnos.MarcarCerradoAsync): el mismo UPDATE sigue siendo la
      unica autoridad race-safe y ahora tambien da el PV, cero round trips;
      compras YA lo devolvia. (9) Las before-images salen del RETURNING
      autoritativo (cantidad_anterior = nueva - delta) o del lock ya tomado
      (saldo del FOR UPDATE), NUNCA de un SELECT extra que otra transaccion
      podria responder distinto. (10) Fail-closed se prueba POR DATO
      (contexto.UsuarioId inexistente ⇒ 23503 de fk_auditoria_actor dentro
      de la transaccion de negocio), sin interfaz IEscritorDeAuditoria ni
      seam de test — y el mismo test cubre el mapeo 23503 → 400
      referencia_invalida que exige el gate §B. (11) usuario.alta es el
      unico call site que cambia la estructura del llamador: transaccion
      explicita con dos SaveChangesAsync (el id no existe antes del primer
      flush). (12) Paginacion OFFSET (PaginaDe<T>, 7 precedentes en el repo,
      cero de keyset; el pager web muestra "pagina N de M" y necesita el
      COUNT) con desempate OBLIGATORIO id_auditoria DESC: creado_el sale de
      un unico reloj.Ahora por operacion, asi que los empates son por
      construccion y bajo RelojFijo empata el fixture entero. (13) Un solo
      ConstruirQuery para JSON y export; export con forma LISTADO
      (count-first + tope + segundo Exigir anti-carrera) y mapeado desde el
      MISMO FilaDeAuditoria ⇒ la paridad es estructural. (14) LEFT JOIN a
      usuarios con IgnoreQueryFilters(["BajaLogica"]): un inner join BORRA
      del log las filas de un actor root (invisible a la sesion de tenant) y
      de un usuario dado de baja. (15) accion/entidad NO se validan contra
      el catalogo en lectura (una accion retirada tiene que seguir siendo
      consultable). (16) idEntidad exige entidad ⇒ 400 (id polimorfico).
      (17) Auditoria.tsx = HistoricoDeCajas.tsx (filtros + pager) +
      BotonDeDescarga de Vencimientos.tsx, con el panel de detalle como
      componente aislado y por lo tanto limpiamente droppable.
      11 call sites ubicados con archivo:linea, payload y "lo que NO cambia"
      (orden de locks, decide-then-commit, UPDATE...RETURNING como
      autoridad). Ondulacion registrada: ServicioDeStock.
      InsertarMovimientoStockAsync pasa a devolver el id (RETURNING) para
      alimentar los payloads; TransferirAsync lo ignora y sigue sin escribir
      auditoria. 28 mutation targets nombrados (fail-closed en EF y en ADO,
      denylist, subset, RLS sobre ways_app, desempate de paginacion, LEFT
      JOIN, IgnoreQueryFilters, cada filtro, RequireAuthorization,
      encabezados del XLSX por la regla 8, reloj fijo, guard de 16
      byte-identico como no-regresion). Testing: mediodia UTC + RelojFijo
      (creado_el sin DEFAULT), seeds asimetricos, aserciones celda por celda
      con encabezados. Plan de 7 slices RATIFICADO (~2.360 lineas, riesgo
      Medium, sin size:exception) con 4 puntos de corte pre-autorizados
      (1a/1b, 5a/5b, panel de detalle de la 7; cobertura y fail-closed nunca
      se degradan). 6 open questions, DOS de ellas exigen reconciliar con el
      spec que corrio en paralelo: usuario.baja no puede llevar
      estado:"eliminado" (EstadoUsuario es Activo|Inactivo|Bloqueado y
      EliminarAsync escribe deleted_at) y stock.conteo escribe una fila por
      movimiento de ledger (el conteo POR LOTE escribe N), con id_lote en el
      payload.
  tasks:
    status: done
    artifact: tasks.md
    depends_on: [spec, design]
    notes: >-
      7 slices stacked-to-main, ~2 360 lineas, 28 mutation targets de
      design.md colocados exactamente una vez (1:8, 2:4, 3:3, 4:3, 5:6,
      6:3, 7:1), los 12 call sites/acciones ubicados con file:ancla del
      design. Merge order: 1 bloquea todo -> {2,3,4} paralelos (servicios
      disjuntos) -> 5 -> 6 -> 7. Gate guard en cada slice
      (has-pending-model-changes limpio; slice 1 exactamente UNA migracion
      nueva AuditoriaEtapa14, slices 2-7 cero migraciones adicionales).
      DOS conflictos spec/design (corridas en paralelo) resueltos por el
      orquestador y registrados como Orchestrator Decisions 5 y 6 al tope
      de tasks.md: (1) stock.conteo escribe UNA fila por OPERACION de
      conteo, no por movimiento de ledger -- la letra del spec
      (spec.md:97-98, "exactly one row") es autoritativa sobre el texto
      per-lote de design.md, que queda flageado como stale; el payload
      agrega movimientos_generados/lotes_afectados/delta_total y la fila
      se escribe UNA vez despues del loop (slice 4, tarea 4.4, evidencia en
      4.11); el conteo sin diferencia sigue sin escribir nada. (2)
      usuario.baja payload = {deleted_at, estado} (EstadoUsuario no tiene
      "eliminado"; EliminarAsync escribe deleted_at) -- la tabla de
      payloads del proposal queda como texto stale en ese punto, el call
      site de design.md (ya correcto) es autoritativo (slice 2, tarea 2.5).
      Criterio binding: VentasCheckoutTests.cs ausente del diff completo de
      la etapa (tarea 3.12), no solo su constante 16 sin editar. Skills
      aplicadas: mutation-proof-tests (28 targets, regla 8 en slice 6),
      dto-contract-honesty (slices 1/5/7), db-error-backstops (slice 1,
      SQLSTATE 23503 de fk_auditoria_actor), react-async-state +
      web-descriptor-tests (slice 7, unica slice web de esta etapa),
      work-unit-commits (todas). Judgment-day + branch/PR/merge numerados
      por slice. Sin size:exception previsto; cortes pre-autorizados 1a/1b,
      5a/5b y el PanelDeCambio droppable de la 7 (cobertura de las 12
      acciones y fail-closed NUNCA se degradan). Review Workload Forecast:
      ~2 360 lineas, riesgo Medium (slices 1 y 5 mas cerca del cap),
      auto-chain/stacked-to-main ya resuelto, decision needed before apply:
      No.
  apply:
    status: done
    artifact: tasks.md + PRs
    depends_on: [tasks]
  verify:
    status: done
    artifact: verify-report.md
    depends_on: [apply]
    note: >-
      PASS WITH WARNINGS (2026-08-17, HEAD 8c262ba): 0 CRITICAL. 10 requirements
      / 31 escenarios trazados a tests que pasan. Gate verificado: UNA migracion
      AuditoriaEtapa14 con 5 indices (3 del contrato + 2 de soporte de FK de la
      enmienda 1); has-pending-model-changes limpio. Proteccion del checkout
      PASS: VentasCheckoutTests.cs ausente del diff de TODA la etapa y tambien
      de los 3 PRs de chips posteriores, constante 16 intacta. Fail-closed
      probado POR DATOS (23503 real sobre fk_auditoria_actor + rollback + mapeo
      a 400 por el ManejadorDeErrores real), sin seam de test. W1: drift de la
      anotacion de doc-10 congelada en el slice 1 — REMEDIADO pre-archive. W2
      informativo: el fix de offsets del PR #129 cerro retroactivamente un
      defecto latente en los caminos ADO de esta etapa que su propia estrategia
      de tests (RelojFijo siempre en Z) no podia ver.
  archive:
    status: pending
    artifact: archive-report.md
    depends_on: [verify]
