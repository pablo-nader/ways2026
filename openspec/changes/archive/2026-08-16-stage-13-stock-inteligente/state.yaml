    por ServicioDeCompras."
  - "LO QUE GOBIERNA LA ETAPA NO ES EL UMBRAL, ES LA HONESTIDAD ARITMETICA. Toda la etapa es
    superficie de lectura mas una escritura chica de Admin; nada crea una fuente de verdad nueva y
    nada puede corromper una. El unico lugar donde hace falta cuidado real es cuales movimientos
    cuentan como consumo, que significa una sugerencia cuando faltan sus insumos, y que hace un
    reporte con las filas que no puede clasificar. La temporada de judgment-day de la etapa 12
    probo que los bugs caros de una superficie de solo lectura son los de una cifra PLAUSIBLE Y
    EQUIVOCADA, no los de una cifra ausente."
  - "CONTRATO DE CAPABILITIES para sdd-spec — NUEVA (1): 'reposicion-de-stock' (semantica de
    minimo/reposicion con NULL = no gestionado y el borde <=, el camino de escritura Admin-only y
    su regla de no-movimiento, la definicion de rotacion con su filtro de motivos y su ventana con
    zona, la formula de sugerencia y sus NULLs honestos, el reporte de reposicion con su hermano
    /export y su tile de Tablero). MODIFICADAS (3): 'stock' (UN requirement ADDED: la fila de stock
    carga parametros de reposicion que NO son un hecho del ledger, asi que escribirlos crea la fila
    cuando falta y NO debe insertar movimientos_stock — es una afirmacion sobre el invariante propio
    de stock, por eso vive ahi y no en la capability nueva), 'reportes-de-gestion' (el requirement
    de existencias se reenuncia incluyendo minimo/reposicion/estado en la respuesta y su export),
    'parametros-operativos' (2 claves nuevas, sin migracion). NO MODIFICADAS:
    'exportacion-de-reportes' (esta etapa es consumidora del contrato, no enmendante), 'articulos'
    (solo lee id_proveedor_habitual), 'conteo-de-inventario' (su exclusion SIGUE VIGENTE, decision
    5), 'lotes-y-vencimientos' y toda spec de camino de escritura (comprobantes-venta,
    comprobantes-compra, transferencias-de-stock)."
  - "RIESGO NUMERO UNO, Y ES DE PRODUCTO, NO TECNICO: que nadie configure ningun minimo y la etapa
    entregue una pantalla vacia. Mitigacion en tres puntos: NULL = no gestionado hace que el dia uno
    sea silencioso en vez de ruidoso; el editor se entrega en el SLICE 3, no al final; y
    minimoSugerido elimina el problema de la hoja en blanco. Riesgo dos: una cifra plausible y
    equivocada — cada regla aritmetica es un escenario de spec nombrado (exclusion de la anulacion
    de compra, borde exacto en cantidad == minimo, sugerido NULL en vez de 0, 'Sin proveedor' nunca
    descartado). Riesgo tres: fatiga de alertas por stock legalmente negativo (paridad legacy) —
    acotado porque solo aparecen los articulos con minimo configurado, o sea que el operador opta
    articulo por articulo."
  - "OUT OF SCOPE EXPLICITO: cualquier infraestructura de push (decision 2, con tripwires
    nombrados); generacion de orden o de borrador de compra (decision 3, etapa 16); 'stock en
    transito' como campo (decision 4); el workflow completo de conteo snapshot/freeze/varianza
    (decision 5, separado y RE-REGISTRADO en doc 11, no dropeado en silencio); aviso sincronico de
    bajo minimo en el POS (decision 8); reposicion consolidada multi-punto-de-venta; operaciones
    masivas sobre minimos (copiar de otro PV, import masivo, recalculo por porcentaje); persistir
    automaticamente el minimo calculado; punto de pedido por lote (un lote es identidad de
    vencimiento, no unidad de reposicion); costo o precio estimado en la lista de reposicion;
    actualizacion masiva de costos (doc-11:378 la menciona como posible mejora DENTRO de esta
    etapa — NO SE TOMA: es un camino de escritura de compras con semantica de precios, ajeno a la
    reposicion, y violaria la restriccion de caminos de escritura de la etapa; queda registrada
    para que no se pierda). Y los pendientes reservados del dueño: formula de comisiones, margen
    para Supervisor, modelo de lectura de OperacionDePos, cierre de caja por rol, branding de
    exports — intactos."
  - "ENTREGA: 7 SLICES TENTATIVOS, STACKED-TO-MAIN, judgment-day por slice segun
    protocolo-pr-solo-dev. Orden: 1 minimos-api, 2 existencias-minimos, 3 web-minimos, 4
