db_gate: SIN-CAMBIOS-DE-SCHEMA-RATIFICADO
db_gate_approval: >-
  RATIFICADO 2026-08-14 por el orquestador bajo mandato autonomo delegado: veredicto
  'sin cambios de schema' EJERCIDO FORMALMENTE — se verifico la seccion 'Modelo de datos
  propuesto' del proposal (A: columnas existentes activadas en su lugar, sin migrar;
  B: dos claves de ParametroConocido patron sin-migracion probado en etapas 10/12;
  C: no-decisiones deliberadas coherentes con precedentes aprobados) y el fundamento
  contra el codigo real citado abajo. Alcance congelado: cualquier DDL de sdd-apply
  ABRE el gate; criterio de verify vinculante el has-pending-model-changes limpio.
  Declaracion original del proposal: NO CORRESPONDE GATE DE MIGRACION — la etapa no crea, altera ni elimina NINGUN objeto de
  esquema. Veredicto declarado 2026-08-14 bajo mandato autonomo delegado, mismo patron que las
  etapas 10 y 11 (cero migracion). FUNDAMENTO VERIFICADO CONTRA EL CODIGO REAL: stock.minimo y
  stock.reposicion YA EXISTEN desde la migracion 20260804143427_VentasStockYCuentaCorrienteEtapa5
  con la forma exacta que la etapa necesita — numeric(12,3) nullable sobre una fila con
  PRIMARY KEY (id_articulo, id_punto_venta), o sea POR ARTICULO Y POR PUNTO DE VENTA
  (StockConfiguration.cs:35-36, Stock.cs:24-32, doc-10:508-513); nadie las escribe ni las lee
  hoy (explore.md seccion 1). La agrupacion por proveedor usa articulos.id_proveedor_habitual,
  FK existente y circuito completo desde la etapa 3. La rotacion es lectura pura sobre
  movimientos_stock. Scoping doc-09: stock es OPERATIVA (id_tenant + id_punto_venta), asi que
  los parametros de reposicion quedan aislados por el filtro de tenant hand-rolled existente
  mas RLS, sin abrir ninguna pregunta de scoping nueva. UNICO artefacto declarado: DOS claves
  de ParametroConocido (dias_rotacion int default 30; dias_cobertura_objetivo int default 7)
  SIN migracion y SIN data statement, patron identico a zona_horaria/comision_porcentaje
  (etapa 10) y lotes_habilitado/dias_alerta_vencimiento (etapa 12). NO-DECISIONES DELIBERADAS
  Y RELEVANTES AL GATE, registradas en la seccion C del 'Modelo de datos propuesto': (a) NO se
  agrega CHECK (minimo >= 0) ni CHECK (reposicion >= minimo) — se validan en la capa de
  aplicacion (400 minimo_negativo, 400 reposicion_menor_que_minimo), siguiendo el precedente
  de la ausencia DELIBERADA de CHECK en stock_lotes.cantidad aprobada en el gate de la etapa 12
  y del micro-gate del CHECK de importe que sigue abierto desde la etapa 8; agregar un CHECK
  convertiria una etapa de cero migracion en una etapa de migracion por una validacion que el
  servicio hace igual; (b) NO se agrega indice — la query de alerta filtra id_punto_venta y
  evalua minimo IS NOT NULL AND cantidad <= minimo sobre un conjunto ya acotado por el catalogo
  (la misma cota que ObtenerExistenciasAsync escanea sin paginar hoy, cubierta por
  ix_stock_punto_venta); un indice parcial sobre minimo IS NOT NULL queda registrado como la
  primera migracion obvia SI un catalogo real vuelve medible el scan; (c) stock NO cambia de
  forma ni de PK. ALCANCE CONGELADO: cualquier DDL que escriba sdd-apply es violacion de
  alcance y ABRE el gate por primera vez. Criterio de verify vinculante:
  'dotnet ef migrations has-pending-model-changes' limpio y CERO archivos de migracion nuevos.
db_gate_scope: >-
  ZERO SCHEMA CHANGE. No table, no column, no index, no constraint, no enum value, no view, no
  trigger, no function, no data statement, no migration file. stock: NONE (dos columnas
  nullable existentes ganan lector y escritor). movimientos_stock: NONE (solo lectura, para la
  rotacion). articulos/proveedores: NONE (id_proveedor_habitual leida via FK existente).
  parametros: NONE (2 entradas de registro, ninguna fila requerida). La seccion 'Modelo de
  datos propuesto' de proposal.md es el contrato: es autosuficiente y su contenido es la
  declaracion de que no hay nada que aprobar.
