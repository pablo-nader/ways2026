decisiones_tomadas:
  - "1 — EL MINIMO ES UN VALOR FIJO QUE FIJA EL DUEÑO, CON LA SUGERENCIA POR ROTACION VISIBLE
    AL LADO; NUNCA UN UMBRAL CALCULADO. Se RECHAZA el umbral calculado: se mueve solo todos los
    dias, un articulo alerta hoy y no manana sin causa visible para el usuario, no queda valor
    almacenado que auditar, un articulo nuevo sin historia no tiene umbral y uno estacional lo
    ve colapsar fuera de temporada. TRES REGLAS QUE LO VUELVEN HONESTO: (a) minimo IS NULL
    significa NO GESTIONADO y nunca alerta — es lo que hace que el dia uno sea silencioso en
    vez de catastrofico (un default 0 habria hecho alertar cada articulo sin stock desde el
    deploy); (b) el borde es cantidad <= minimo, NO < — un punto de pedido es el nivel al que
    se pide, alcanzarlo ES la senal, y ademas vuelve util minimo = 0 ('avisame cuando llegue a
    cero') en vez de inutil ('avisame recien cuando ya este negativo'); enunciado explicito
    porque la temporada de judgment-day de la etapa 12 probo que los bordes implicitos se
    implementan de tres formas distintas (su decision 13); (c) reposicion es el NIVEL OBJETIVO,
    no un segundo umbral: minimo dice CUANDO, reposicion dice HASTA CUANTO. minimoSugerido =
    consumo diario x dias_cobertura_objetivo, SE MUESTRA y NUNCA se persiste sin accion
    explicita del Admin. Reversible: cambiar a umbral calculado despues es una comparacion en
    una query, y la columna sobrevive como override por fila; el camino inverso exigiria
    inventar la historia que nunca se guardo."
  - "2 — LAS ALERTAS SIGUEN SIENDO PULL. EL SEGUNDO CASO DE USO NO CAMBIA EL ARGUMENTO, FORTALECE
    LA SUPERFICIE. La etapa 12 (su decision 10) difirio push 'con un segundo caso de uso real en
    la mano': ese caso ya esta (vencimientos + bajo stock) y esta proposal lo resuelve. COSTO
    REAL DE PUSH, PRECIADO: dependencia de transporte con configuracion y secretos por tenant,
    scheduler o job runner (nada en src corre fuera de un request), modelo de estado de entrega,
    reintentos y bounces, preferencias de suscripcion y baja por usuario, regla de deduplicacion
    para que el mismo articulo no alerte todas las mananas para siempre, y revision de seguridad
    de correo saliente en un sistema multi-tenant. Es una etapa, no un slice, y se decidiria a
    ciegas: hay UN operador y cero evidencia de que la mirada diaria al Tablero este fallando.
    Lo que SI cambian dos consumidores: el Tablero deja de ser una curiosidad de la etapa 12 con
    un tile y pasa a ser LA BANDEJA DE ALERTAS — dos tiles, una mirada, ambos con reporte y
    export. TRIPWIRES NOMBRADOS QUE REABREN LA DECISION: (1) una persona que deba reaccionar y
    no abra el back office a diario; (2) cualquier etapa que necesite scheduler/job runner POR
    SUS PROPIAS RAZONES (candidatas realistas: etapa 16 por el ciclo de vida de OC, etapa 14 por
    retencion de auditoria) — ahi el costo marginal de push colapsa; (3) un incidente registrado
    de 'nos enteramos tarde'. Reversible: los reportes de esta etapa SON el payload de cualquier
    push futuro; no hay que deshacer nada para agregarlo."
  - "3 — LA SUGERENCIA DE COMPRA ES UN LISTADO ACCIONABLE AGRUPADO POR PROVEEDOR; NO GENERA
    ORDEN NI BORRADOR. La etapa 16 posee las ordenes de compra (doc-11:232, backlog linea 369) y
    no existe entidad de OC. Se RECHAZA sembrar un comprobante_compra en borrador (que si es
    tecnicamente posible desde la etapa 8): la etapa 13 pasaria a poseer un camino de escritura
    de ServicioDeCompras contra su propia restriccion dura, necesitaria un costo unitario por
    linea que esta etapa no tiene por que decidir, una cantidad equivocada se vuelve un ARTEFACTO
    REAL que alguien tiene que borrar, y la etapa 16 va a modelar el pedido en serio dejando dos
    puertas de entrada compitiendo. DOS REGLAS DE HONESTIDAD: (a) las filas cuyo articulo no
    tiene id_proveedor_habitual se agrupan bajo 'Sin proveedor' y NUNCA se omiten — una lista de
    reposicion que descarta en silencio los articulos sin proveedor miente por omision, el mismo
    criterio exacto que llevo a la etapa 12 a agregar el cuarto estado sin_fecha al reporte de
    vencimientos en vez de filtrar esas filas; (b) la cantidad sugerida es NULL cuando reposicion
    no esta seteada, JAMAS 0 — un cero en la columna 'cuanto comprar' es una respuesta fabricada
    a una pregunta que el sistema no puede responder (dto-contract-honesty). Reversible: agregar
    'generar borrador/OC desde esta lista' despues es puramente aditivo sobre un read model que
    ya calcula cantidad y agrupacion."
  - "4 — 'STOCK EN TRANSITO' SE OMITE DE LA FORMULA, NO SE HARDCODEA EN CERO. Probado en
    explore.md seccion 5: MotivoStock no tiene estado intermedio, la transferencia escribe sus
    dos filas espejadas EN UNA SOLA TRANSACCION (no hay ventana con mercaderia en camino) y la
    compra postea todos sus movimientos al Confirmar (la recepcion parcial es explicitamente
    etapa 16, doc-11:232). Un campo que siempre vale 0 es una API con forma de mentira: todo
    consumidor lo trata como significativo, el web pinta una columna de ceros, y cuando la etapa
    16 le de un calculo real el significado cambia EN SILENCIO bajo quienes ya le creian. FORMULA
    QUE SE ENVIA Y SE DOCUMENTA: sugerido = reposicion IS NULL ? null : max(0, reposicion -
    cantidad), con nota registrada en el Purpose de la capability de que '- en_transito' es el
    termino que agrega la etapa 16. EDGE CASE ADYACENTE DECIDIDO JUNTO: las compras EN BORRADOR
    NO cuentan como entrante — un borrador no es un compromiso, no tiene fecha esperada de
    arribo y puede no confirmarse nunca; contarlo SUPRIMIRIA una alerta por mercaderia que
    jamas llega, el peor modo de falla de una alerta de reposicion. Reversible: un sustraendo en
    una expresion y un campo en un DTO."
  - "5 — EL WORKFLOW COMPLETO DE CONTEO (SNAPSHOT/FREEZE/VARIANZA) SE SEPARA DE ESTA ETAPA Y SE
    RE-REGISTRA EN EL DOC 11. EXPLICITO Y POR ESCRITO, NO POR SILENCIO. Dimensionado honesto:
    necesita tabla header conteos + items_conteo con esperado/contado/diferencia, un enum nuevo
    de estado, un paso de aplicacion que escribe N movimientos inventario EN UNA TRANSACCION
    respetando el orden de lock pinneado — que desde la etapa 12 es (id_articulo, id_punto_venta,
    id_lote NULLS FIRST) y debe manejar articulos con lote efectivo POR LOTE —, un reporte de
    varianza con su export y una pantalla de conteo multi-sesion: realistamente 1200-1600 lineas
    en 4-5 slices Y UNA MIGRACION QUE REABRE EL GATE, para una etapa cuyo resto necesita CERO
    cambio de esquema. Ademas arrastra una BIFURCACION DE PRODUCTO SIN RESOLVER que esta etapa no
    tiene mandato para settlear: el sistema no deja de vender mientras alguien cuenta — la
    varianza se calcula contra el snapshot congelado (y entonces las ventas del intervalo se
    absorben en la diferencia y el conteo esta mal) o contra el stock vivo al aplicar (y entonces
    el snapshot es decorativo). SE RECHAZA absorberlo como slice final droppable: NECESITA
    MIGRACION, y una migracion dentro de un slice droppable significa abrir el gate de DB por
    algo que puede caerse — lo peor de los dos mundos. Se separa como change propio (nombre de
    trabajo stage-13b-conteo-por-planilla), secuenciado despues de esta etapa y cerca de la
    etapa 14, con la que comparte mas ADN (reconstruir la verdad de lo que paso) que con la
    reposicion. LA DECISION NO ESTA COMPLETA HASTA QUE LO ESTE EL REGISTRO: una task del slice 1
    actualiza la tabla de backlog de docs/11-programa-post-paridad.md (linea 367), misma
    disciplina con que la etapa 12 actualizo el doc 10 seccion 6 desde un slice (su task 1.17).
    La exclusion vigente en conteo-de-inventario/spec.md NO se reabre."
  - "6 — EL MINIMO SE EDITA EN LA GRILLA DE EXISTENCIAS, QUE PASA A SER LA PANTALLA DE STOCK POR
    PUNTO DE VENTA. NO EN EL EDITOR DE ARTICULO. Se RECHAZA una seccion dentro de Articulos.tsx:
    un editor tenant-wide sosteniendo el valor de UN punto de venta es exactamente el mismatch de
    scoping que la etapa 12 cerro con su decision 2, y mostrar N filas de PV dentro del formulario
    de articulo convierte el editor de catalogo en una pantalla de stock. Se RECHAZA una pantalla
    nueva de 'Minimos' por duplicada: renderizaria la misma lista, del mismo unico PV, con el
    mismo selector que Existencias.tsx. CUATRO REGLAS QUE LO VUELVEN SEGURO: (a) el reporte queda
    de solo lectura y la escritura es un endpoint aparte bajo otra politica — GET
    /api/reportes/stock/existencias sigue en LecturaDeReportes (Supervisor + Admin) y PUT
    /api/stock/minimos exige GestionDeCatalogo apilada sobre OperacionDePos, igual que /ajustes,
    /transferencias, /conteos y /decomiso: UN SUPERVISOR VE LAS COLUMNAS Y NO PUEDE EDITARLAS,
    regla testeable y no convencion de UI; (b) escribir un minimo para un articulo SIN fila de
    stock CREA la fila con cantidad = 0 y escribe CERO filas de movimientos_stock — el invariante
    cantidad = SUM(movimientos) se cumple trivialmente en 0 = 0; las dos implementaciones ingenuas
    (fallar por 'no hay fila' o fabricar un movimiento de ajuste en cero) estan mal, una
    inutilmente y la otra destructivamente (ck_movimientos_stock_cantidad_no_cero la rechazaria
    igual); ESTE es el unico requirement ADDED sobre la capability stock; (c) llegar a un articulo
    que todavia no esta en la grilla usa una fila de busqueda/alta de articulo (el patron de picker
    que ya usan POS y CompraEditor), NO un join ensanchado — el reporte conserva su significado
    exacto ('que hay stockeado aca') en vez de volverse en silencio 'todo el catalogo, casi todo
    vacio'; (d) validaciones: minimo/reposicion >= 0 (400 minimo_negativo) y reposicion nunca por
    debajo de minimo cuando ambos estan seteados (400 reposicion_menor_que_minimo) — un objetivo
    de reposicion por debajo del punto de pedido no es una configuracion, es un tipeo; ambas en la
    capa de aplicacion, NO como CHECK (ver gate). Residuo honesto registrado: N puntos de venta x
    M articulos valores a mantener a mano; la copia masiva entre PVs queda DIFERIDA a proposito
    hasta ver el volumen real. Reversible: mover el editor despues es un cambio solo-web sobre una
    API sin cambios."
  - "7 — LA ROTACION SE CALCULA EN LINQ DENTRO DE ServicioDeReportesDeStock. NI ARCHIVO NUEVO DE
    SQL CRUDO, NI EXTENSION DE LectorDeSerieTemporal. LA BIFURCACION SE DISUELVE AL MIRARLA: el
    SQL crudo de la etapa 10 fue forzado por dos necesidades concretas — un literal
    date_trunc('{granularidad}', ...) que habia que inlinear desde un switch validado, y el
    bucketing timezone($1, fecha) adentro de la query. La rotacion NO NECESITA NINGUNA DE LAS DOS:
    es una ventana unica, no una serie temporal — un WHERE sobre un rango, un GROUP BY por
    id_articulo, un SUM. Eso es LINQ plano sobre db.MovimientosStock, estructuralmente identico a
    ObtenerExistenciasAsync, y hereda los filtros globales de EF y los GUCs de RLS a nivel conexion
    sin una sola linea de manejo de conexion a mano. Asi la convencion 'un solo archivo de SQL
    crudo' de la etapa 10 se honra NO AGREGANDO UN SEGUNDO, y LectorDeSerieTemporal (cuyos dos
    cuerpos SQL son de comprobantes_venta y gastos) conserva su cohesion. TRES REGLAS
    DEFINICIONALES, CADA UNA UN BUG REAL SI QUEDA IMPLICITA: (a) QUE CUENTA COMO CONSUMO: motivo =
    venta MAS las filas motivo = anulacion con id_comprobante_compra IS NULL — no es pedanteria:
    desde la etapa 8 la anulacion de una COMPRA tambien escribe motivo = anulacion, y la spec de
    stock fija que id_comprobante_compra se puebla exactamente en las filas compra y en las
    anulacion que las revierten, asi que filtrar solo motivo IN (venta, anulacion) NETEARIA
    REVERSIONES DE COMPRA DENTRO DE LAS VENTAS; ajuste, inventario, decomiso, transferencia y
    reclasificacion NO son consumo y se excluyen; (b) la ventana se resuelve en la zona_horaria del
    punto de venta, calculada en C# desde el 'hoy' que ResolverContextoAsync ya produce (etapa 12,
    decision 15) y pasada como instantes — es la clase de bug de la slice 9 de la etapa 11 que
    necesito el commit de endurecimiento 08e7707, y queda como criterio de verify vinculante; (c)
    la rotacion es ADVISORY y nunca gatilla una alerta: una cifra equivocada confunde a un humano
    que lee una sugerencia, pero no puede disparar una alerta falsa ni suprimir una verdadera,
    porque la alerta compara cantidad contra el minimo almacenado y nada mas (decision 1) — esa
    contencion es deliberada y acota el radio de explosion de la unica aritmetica no trivial de la
    etapa. Reversible: si una superficie futura necesita rotacion EN EL TIEMPO (por semana), ahi si
    se vuelve un tercer cuerpo SQL en LectorDeSerieTemporal, con la justificacion de granularidad y
    zona que hoy no existe."
  - "8 — NO HAY AVISO SINCRONICO DE BAJO MINIMO EN EL POS. EL PRESUPUESTO DEL CHECKOUT QUEDA
    BLINDADO. Observacion tecnica honesta primero: PODRIA ser casi gratis — el INSERT ... ON
    CONFLICT DO UPDATE ... RETURNING del checkout ya devuelve la fila de stock, y agregar minimo a
    la lista del RETURNING cuesta CERO round-trips extra. O sea que este NO es un argumento de
    costo, es un argumento de producto. POR QUE NO IGUAL: (a) el aviso llegaria DESPUES de commitear
    la venta — el RETURNING ocurre dentro de la transaccion que ya vendio la mercaderia, asi que le
    dice al cajero algo sobre lo que no puede actuar en el mostrador; (b) EL CAJERO NO ES QUIEN
    REPONE: un aviso dirigido a alguien que no puede responderlo es ruido; (c) la etapa 12 ya puso
    un warning loteVencido en esa misma superficie, y un segundo aviso NO ACCIONABLE al lado de uno
    accionable ENTRENA AL OPERADOR A DESCARTAR LOS DOS — la regresion de UX mas cara y la mas
    invisible para cualquier suite; (d) cambiaria el SQL del camino de escritura mas caliente y su
    DTO de respuesta por una preocupacion de back office, gastando la credibilidad de un presupuesto
    blindado en algo que el tile del Tablero cubre dentro de la misma jornada. Criterio de exito que
    lo verifica en vez de prometerlo: el conteo de round-trips del checkout no cambia respecto de
    pre-etapa-13, por test (patron de la etapa 12). Reversible: una columna en un RETURNING y un
    campo nullable en la respuesta del checkout — registrado con precision para que un dueño futuro
    sepa que es un cambio de un slice y no una decision de arquitectura que le quedo cerrada."
