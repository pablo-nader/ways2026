    notes: "Written 2026-08-11. Key code-verified findings BINDING for apply: (1) the deploy path (WaysDbContextFactory, used by dotnet ef database update) has NO tenant interceptor, so SET LOCAL app.acceso='plataforma' MUST live inside the same Sql() block, not suppressTransaction. (2) The naive multi-tenant backfill test is a FALSE GREEN: WaysApiFixture migrates as ways_owner (testcontainer superuser, RLS never applies); the honest test runs statement-level over fixture.AppConnectionString (ways_app, NOSUPERUSER NOBYPASSRLS) asserting 0 rows without the prefix and every tenant's rows with it. (3) Query-budget guard is Assert.Equal(17, ...) at VentasCheckoutTests.cs:918 — any diff touching that line is a violation, not a test update. (4) NCX needs ZERO new code (sign lives in cantidad, cost copied unsigned). (5) Capture point is in the non-retryable half, pinned like momento — a retry cannot pick up a concurrently-moved costo_nominal. (6) Both CHECKs mapped in ClasificarCheckDeVentas by exact name (db-error-backstops; unreachable from verified write paths but an unmapped 23514 on checkout would be a 500). Open question recorded: ways_owner superuser weakens every migration-level test repo-wide."
