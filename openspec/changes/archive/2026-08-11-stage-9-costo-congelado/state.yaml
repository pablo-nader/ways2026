    status: done
    artifact: specs/comprobantes-venta/spec.md
    depends_on: [propose]
    notes: "Written 2026-08-11. Single-domain delta: MODIFIED 'Comprobante Schema At Rest' (two columns + both CHECKs as unrepresentable states) and 'Snapshot Immutability of Items' (cost joins the frozen list; NULL-cost vs zero-cost scenarios); ADDED 'Cost Snapshot Semantics, NCX Freeze, And No-Exposure' (three-state table, unsigned-per-unit, DTO byte-unchanged scenario) and 'One-Shot Backfill Marks Pre-Existing Rows As Estimated' (platform-mode SET LOCAL, multi-tenant + idempotent re-run scenarios). Scope matches the proposal's capabilities contract exactly."
  design:
