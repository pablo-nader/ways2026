notes:
  - "FIRST CHANGE OF THE POST-PARITY PROGRAM (docs/11-programa-post-paridad.md). Doc 10's stage table is closed (stages 1-8 archived); doc 11 is the new mandate document and etapa 9 is its first row. Any doc update for this change lands in doc-10 §4 (the schema note for the two columns) — doc 11 itself is only annotated when the stage closes."
  - "DB CHANGE GATE IS NOT EXERCISED BY ANY AGENT FOR THIS CHANGE. Unlike stage 8 (which ran under a one-off autonomous delegation), this change follows the project's default: the orchestrator PRESENTS the 'Modelo de datos propuesto' section to the owner and WAITS for explicit approval before sdd-apply generates the migration. sdd-tasks MUST carry a STOP task for it."
  - "DECISION 1 (WHICH COST, AND IN WHICH BASE — settled by code, not assumption): freeze articulos.costo_nominal exactly as it stands at emission: per unit, IVA-INCLUDED, numeric(14,2), no normalization. CalculadorDeCompra.cs:86-95 + doc-10:438-441 pin that costo_nominal receives the IVA-included effective cost rounded AwayFromZero; the POS only emits TX/NCX with discrimina_iva=false, so precio_unitario is the final IVA-included price. THE MARGIN IS THEREFORE margen = total - costo_unitario * cantidad, IVA-INCLUDED ON BOTH SIDES, with no conversion — this sentence is BINDING for stage 10. Purchase and sale use the same articulo.IdAlicuotaIva, so the gross margin is the net margin scaled by (1 + iva), and porcentaje_iva is already frozen on the line: stage 19 (fiscal comprobantes that discriminate IVA) can derive the net margin later WITHOUT a schema change."
  - "DECISION 2 (HOW THE BACKFILL IS MARKED): a boolean column costo_es_estimado, NOT a cut-off date. Rejected alternative and why: the cut-off is not one value (each tenant/database migrates at its own moment, a re-run shifts it, a later legacy import would create a second one), it forces every consumer forever to hardcode a magic timestamp, and it cannot represent an estimated row created after the cut-off. The boolean is one byte, self-describing, directly filterable, and it makes the FUTURE REFINEMENT CHEAP (a later change can improve exactly the rows marked estimated using items_comprobante_compra history). HONEST CAVEAT THAT MUST REACH THE SPEC: the backfill uses TODAY's cost, which under inflation is typically HIGHER than the cost at sale time, so an estimated margin is a PESSIMISTIC LOWER BOUND, not noise around the truth — stage 10 must EXCLUDE estimated lines by default with an explicit opt-in."
  - "DECISION 3 (NOTAS DE CREDITO): an NCX freezes its OWN cost at its own emission; it does NOT copy the original line. Verified: an NCX travels the same EmitirAsync path with its own lines and its own live-resolved prices; id_comprobante_asociado is optional even for an NCX and links comprobante-to-comprobante only (ReglaDeComprobantes.ValidarComprobanteAsociado) — no id_item_original exists, and the NC's articles/quantities need not match the original's, so copying is not generally computable and article-matching heuristics would guess wrong silently. BINDING INVARIANT: costo_unitario is stored UNSIGNED PER UNIT, exactly like precio_unitario; the sign lives in cantidad (CalculadorDeTotales.cs:32-42), so costo_unitario * cantidad is negative on an NCX and the margin reverses with no branch. ACCEPTED RESIDUAL: if the cost moved between the sale and the return, the reversal does not cancel the original margin to the cent — bounded by the cost delta, and preferable to a heuristic. Anulación writes no items, so a frozen cost is never rewritten; stage 10 excludes estado = anulado as it already must for revenue."
  - "DECISION 4 (NULLABILITY): costo_unitario is NULLABLE, and NULL means UNKNOWN — never 0. articulos.costo_nominal is itself nullable and much of a real catalog has no cost loaded; items_comprobante_venta.id_articulo is also nullable (free-concept lines, doc-10:339). NOT NULL would force writing 0, and 0 is a legitimately STATED cost of zero (a bonificación; stage 8 already treats costo <= 0 as its own case at CalculadorDeCompra.cs:135). Collapsing unknown into zero would hand stage 10 a confident fake 100% margin on every costless article — worse than a gap. The three-state model (real / estimated / unknown) is the product contract of this stage."
  - "DECISION 5 (NO EXPOSURE): the frozen cost never leaves the server through the sale surface. ItemEmitido/ComprobanteEmitido and every Ways.Web payload stay BYTE-UNCHANGED, and this is a VERIFY CRITERION, not an assumption. A Vendedor emitting a ticket has no business reading the purchase cost, and the emit response is the widest-reach payload in the system. Margin becomes visible in stage 10 through its own aggregated, role-gated endpoints."
  - "DECISION 6 (THE BACKFILL MUST DEFEAT RLS EXPLICITLY AND PROVE IT): every tenant table is FORCE ROW LEVEL SECURITY with USING (app_es_plataforma() OR id_tenant = app_tenant_actual()) (RlsMigrationBuilderExtensions.cs:65-77) and the app role is asserted to have no BYPASSRLS in Production (InicializadorDeBaseDeDatos.VerificarRolSinBypassAsync). A plain UPDATE inside the migration would match ZERO ROWS AND REPORT SUCCESS — the worst possible failure mode for a one-shot data fix. The backfill runs in platform mode (SET LOCAL app.acceso = 'plataforma', scoped to the migration transaction and reset), and a MULTI-TENANT integration test must prove rows of EVERY tenant were touched. Idempotent by construction (WHERE costo_unitario IS NULL), so a re-run is harmless."
  - "CAPABILITIES CONTRACT for sdd-spec — NEW: none. MODIFIED: 'comprobantes-venta' only — (a) 'Comprobante Schema At Rest' (spec:13) gains the two columns and their CHECKs; (b) 'Snapshot Immutability of Items' (spec:40) gains costo_unitario/costo_es_estimado to the frozen list and states they are never re-derived from articulos on a reprint; (c) ONE NEW REQUIREMENT pinning the three-state cost semantics (real / estimated / unknown, with 0 distinct from NULL), the IVA-included base on both sides, the unsigned-per-unit sign convention, the NCX freeze-its-own rule, and the no-exposure rule. Nothing in 'articulos', 'stock', 'operacion-de-pos' or 'comprobantes-compra' changes."
  - "GUARDED-PATH DISCIPLINE (binding for apply/verify): ServicioDeVentas is the most-tested code in the project. This stage adds ONE field to LineaDelPlan, ONE assignment in MaterializarItems and ONE property in the item construction of EjecutarTransaccionAsync — NO new query, NO new lock, NO new branch, NO new failure mode. Two proofs are required, not assumed: (1) the emission query-budget guard test still passes with the SAME constant; (2) the response DTOs are byte-unchanged (decision 5)."
  - "OUT OF SCOPE, EXPLICIT: everything from stage 10 (aggregation, dashboards, margin reports, comparisons — this stage only lands the datum, no read endpoint ships); exposing cost in any API response, ticket or POS screen (decision 5); per-article/per-proveedor cost history; weighted-average, FIFO or LIFO valuation; cost per punto de venta; reconstructing real historical costs from items_comprobante_compra (recorded as the natural future refinement of exactly the rows marked costo_es_estimado); multi-currency costs; any change to how compras writes costo_nominal, or to the sale transaction's shape, numbering, stock, cuenta corriente, anulación or authorization."
  - "DELIVERY: ONE SLICE, ONE PR. Estimated ~250-400 changed lines including tests (migration + configuration + 2 entity properties + ~5 lines in ServicioDeVentas + spec delta + doc-10 §4 note + tests) — under the 400-line review budget, no chaining expected. judgment-day before the PR per protocolo-pr-solo-dev. sdd-tasks MUST include a STOP task for the DB CHANGE GATE before the migration task, and MUST emit the exact Review Workload Forecast guard lines."
  - "RISKS carried into design: (1) THE TOP RISK IS A SILENT ZERO-ROW BACKFILL under FORCE RLS (decision 6) — it fails by succeeding; (2) an estimated cost read as real, inventing historical margin (the boolean + the pessimistic-bound wording + stage-10 default exclusion); (3) touching the most-tested path in the project (no new query/lock/branch; full stage 5-8 suite green as the slice gate); (4) cost leaking to the cashier through the emit response (decision 5 + a DTO-shape test); (5) costo_nominal = 0 confused with 'no cost' (decision 4, a scenario each way); (6) an NCX margin not cancelling the original to the cent (accepted, documented); (7) scope creep into stage 10 — 'just one aggregate' — refused by the Out of Scope list."
  - "PROPOSAL QUESTION ROUND (recorded in proposal.md for the owner's review BEFORE sdd-tasks; each was resolved with a founded recommendation, correcting any of them now is cheap, after apply it is not): (1) Is today's costo_nominal a good enough estimate for past sales given inflation? -> assumed YES AS A MARKED PESSIMISTIC BOUND; the alternative is shipping the columns with NO backfill (historical rows stay NULL = honestly unknown), a trivial change later. (2) Should the margin be computed IVA-included on both sides? -> assumed YES (it is what both stored values already are); a net-of-IVA preference changes nothing in this schema but binds stage 10's display. (3) Should an NC reverse the ORIGINAL margin exactly, or freeze its own cost? -> assumed FREEZE ITS OWN (no line-to-line link exists). (4) Should any operator see cost/margin on the sale screen? -> assumed NO; if Admin should, it is a stage-10 decision, not a schema one. (5) Is the second column (the boolean) acceptable? -> assumed YES; dropping it would force date-based inference forever. Questions 1 and 5 are the only ones that would change the migration."
  - "ARTIFACT LANGUAGE: written in English prose with Spanish domain identifiers, matching the verified convention of every archived change in openspec/ (stages 1-8) and of openspec/specs/. The launch brief asked for Spanish prose; the repo convention was checked against the archived stage-8 proposal and the existing specs and takes precedence, so downstream spec deltas merge into openspec/specs/ without a language seam. Flagged to the orchestrator for the owner to override if desired."
  - "CARRYOVER WATCH (open, unrelated to this stage, inherited from the stage-8 archive): the ServicioDeArticulos articulos_empresas replace-set concurrency gap, and the pending micro-gate for the importe CHECK."
