gate: "DB CHANGE GATE — APPROVED BY THE OWNER (2026-08-11, in-session, explicit 'ok' after the orchestrator presented the model summary: two additive columns, two CHECKs, platform-mode backfill, reversible down; model approved EXACTLY as written below — any deviation during apply reopens the gate). Original gate text follows. NOT exercised by any agent for this change. The model summary is written verbatim in proposal.md under 'Modelo de datos propuesto' and MUST be presented by the orchestrator before any migration is generated or applied. MODEL (summary): ONE table affected, items_comprobante_venta ([operativa], tenant-scoped, doc-10:337-350), TWO ADDITIVE COLUMNS — costo_unitario numeric(14,2) NULL (snapshot of articulos.costo_nominal at emission; per unit, UNSIGNED like precio_unitario, IVA-INCLUDED like both sides already are; NULL = cost unknown) and costo_es_estimado boolean NOT NULL DEFAULT false (true only on backfilled rows). TWO NEW CHECKs mirroring the stage-8 naming: ck_items_comprobante_venta_costo_no_negativo (costo_unitario IS NULL OR costo_unitario >= 0) and ck_items_comprobante_venta_estimado_con_costo (NOT costo_es_estimado OR costo_unitario IS NOT NULL). NO new table, enum, index, FK, RLS policy; NO change to any existing column/constraint/index/policy. ONE-SHOT IDEMPOTENT BACKFILL inside the same migration (UPDATE ... FROM articulos matching (id_articulo, id_tenant) WHERE i.costo_unitario IS NULL AND a.costo_nominal IS NOT NULL), which MUST run in platform mode (SET LOCAL app.acceso = 'plataforma' inside the migration transaction) because every tenant table is FORCE ROW LEVEL SECURITY with USING (app_es_plataforma() OR id_tenant = app_tenant_actual()) and the app role is asserted to have no BYPASSRLS in Production — a plain UPDATE would match ZERO rows and report success. Soft-deleted articles are deliberately included. Down drops both CHECKs and both columns; fully reversible."
phases:
  explore:
    status: skipped
    artifact: none
    notes: "No separate exploration pass. The orchestrator supplied a pre-resolved brief with code hooks and doc references; propose RE-VERIFIED every one of them against source before writing. VERIFIED DURING PROPOSE: (a) doc-11:76-96 is the etapa-9 mandate ('la unica etapa del programa cuya postergacion DESTRUYE DATOS'), doc-11:112-113 records that stage 10 depends on stage 9 for the margin dimension only. (b) ItemComprobanteVenta.cs:14-19 enumerates the frozen snapshot — descripcion, codigo_barra, id_area, precio_unitario, id_lista_precio, id_oferta, id_alicuota_iva/porcentaje_iva — and NO cost; ItemComprobanteVentaConfiguration.cs has NO CHECK constraint today (the two proposed ones are the table's first). (c) Articulo.cs:46-51 — costo_nominal is decimal? (numeric(14,2) NULL, doc-10:219), documented as 'costo real de reposicion, lo actualiza el flujo de compras'. (d) THE IVA QUESTION IS SETTLED IN CODE, NOT ASSUMED: CalculadorDeCompra.cs:86-95 computes costoEfectivo IVA-INCLUDED (Redondear(total * (1 + porcentajeIva/100) / cantidad, 2) when discriminaIva, else total/cantidad), doc-10:438-441 states it verbatim, and ComprasLifecycleTests.ConfirmarEscribeMovimientoCacheYCostoNominalJuntos asserts 121.00 for a 100.00 cost at 21%. The POS emits only TX/NCX (discrimina_iva=false, doc-10:330), so precio_unitario is the final IVA-included price — BOTH SIDES ALREADY SHARE A BASE, no normalization needed (decision 1). (e) SIGN CONVENTION VERIFIED: CalculadorDeTotales.cs:32-42 keeps precio_unitario POSITIVE and puts the sign in cantidad (descuento = descuentoUnitario * cantidad, so it too goes negative on an NCX) — costo_unitario follows the same unsigned-per-unit rule (decision 3). (f) THE NC HAS NO LINE-TO-LINE LINK: ServicioDeVentas.cs:77-82 + ReglaDeComprobantes.ValidarComprobanteAsociado link comprobante-to-comprobante, id_comprobante_asociado is OPTIONAL even for an NCX, there is no id_item_original, and an NCX re-resolves its own prices through ServicioDeOfertas — copying the original line's cost is not generally computable (decision 3). (g) ZERO-QUERY CAPTURE CONFIRMED: ServicioDeVentas.cs:96-98 already materializes articuloPorId with the full Articulo entity, so CostoNominal is in hand at MaterializarItems (:751-809) with no new round trip — the pinned query budget (design '≤ 16 round trips') is unaffected. (h) THE RLS BACKFILL TRAP: RlsMigrationBuilderExtensions.cs:65-77 applies ENABLE + FORCE ROW LEVEL SECURITY with USING/WITH CHECK (app_es_plataforma() OR id_tenant = app_tenant_actual()) to every tenant table, and InicializadorDeBaseDeDatos.VerificarRolSinBypassAsync (:134-183) THROWS in Production if the connection role has rolsuper/rolbypassrls — so a migration-time UPDATE without platform mode matches zero rows and looks successful (decision 6). Precedent for data statements inside a migration: ComprasYTransferenciasEtapa8.cs:283 and CuentaCorrienteEtapa7.cs:60. (i) items_comprobante_compra.costo_unitario is numeric(14,4) (doc-10:404) — deliberately NOT copied: the source column here is numeric(14,2), so 4 decimals would advertise precision that does not exist."
  propose:
    status: done
    artifact: proposal.md
    notes: "Written 2026-08-11. Six resolved decisions, each with a code- or doc-verified provenance, each stated as a founded recommendation (no option menus). Decision 1: freeze costo_nominal AS-IS, IVA-included, no normalization — both sides of the margin already share the base, and porcentaje_iva is already frozen on the line so a net margin is derivable later with no schema change. Decision 2: mark the backfill with costo_es_estimado, NOT with a cut-off date (a date is not a single value across tenants/re-runs/future imports, forces a magic timestamp on every consumer forever, and cannot represent an estimate created after the cut-off) — with the honest caveat that under inflation an estimated margin is a PESSIMISTIC LOWER BOUND and stage 10 must exclude estimated lines by default. Decision 3: an NCX freezes its OWN cost at its own emission (no line-to-line link exists to copy from) and costo_unitario is stored UNSIGNED per unit so costo_unitario x cantidad reverses on its own; accepted residual documented. Decision 4: NULLABLE — costo_nominal is itself nullable and id_articulo can be NULL (free-concept lines); NOT NULL would force writing 0, and 0 is a legitimately stated cost of zero, so collapsing the two would hand stage 10 a confident fake 100% margin. Decision 5: the cost NEVER leaves the server through the sale surface (ItemEmitido/ComprobanteEmitido byte-unchanged) — a Vendedor has no business reading the purchase cost; margin becomes visible in stage 10 through its own role-gated endpoints. Decision 6: the backfill runs in platform mode and MUST prove it touched rows of every tenant. Capabilities contract: 0 new, 1 modified (comprobantes-venta). A 'Proposal question round' section records 5 questions with the assumption taken for each, for the owner to correct before sdd-tasks."
