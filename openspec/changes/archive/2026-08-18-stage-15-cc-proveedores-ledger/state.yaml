db_gate: UNA-MIGRACION-APROBADA
db_gate_approval: >-
  APROBADO 2026-08-17 por el orquestador bajo mandato autonomo delegado:
  gate EJERCIDO FORMALMENTE sobre la seccion 'Modelo de datos propuesto'
  del proposal (lineas 485-746), que es EL CONTRATO — cualquier DDL de
  sdd-apply fuera de esa seccion es violacion de alcance y reabre el gate.
  ALCANCE APROBADO: UNA migracion (CuentaCorrienteDeProveedoresEtapa15),
  la PRIMERA NO-ADITIVA del programa: UN enum nuevo
  tipo_movimiento_cc_proveedor (4 valores apertura|compra|pago|ajuste,
  cada uno con escritor, orden de declaracion = orden C# via MapEnum),
  UNA tabla nueva movimientos_cuenta_corriente_proveedor (12 columnas,
  pk integer GENERATED BY DEFAULT, 6 FKs, 1 CHECK ck_..._apertura que
  ata la nulabilidad de id_punto_venta/id_empleado EXACTAMENTE al tipo
  apertura, 6 indices nombrados, RLS estandar HabilitarRlsDeTenant sin
  desvio, SIN AK — decision fundada: la AK del ledger de clientes existe
  solo para el self-FK de reliquidacion, fuera de alcance), DOS ALTER
  (proveedores + saldo numeric(14,2) NOT NULL DEFAULT 0 metadata-only;
  gastos + ak_gastos_id_gasto_id_tenant, +1 indice implicito — total 7
  indices nuevos), DOS data statements idempotentes (backfill de asiento
  de apertura con guard NOT EXISTS, precedente seeds de la 12, y UPDATE
  del cache derivado DE ESA MISMA FILA), CERO ALTER TYPE (nada
  irreversible), ManejadorDeErrores NO se toca.
  VERIFICACION INDEPENDIENTE DEL ORQUESTADOR previa a la aprobacion:
  (1) AK de proveedores (Id,IdTenant) existe — ProveedorConfiguration.cs:151;
  (2) AK de comprobantes_compra existe — ComprobanteCompraConfiguration.cs:49;
  (3) GastoConfiguration.cs NO declara HasAlternateKey — el ALTER de §D
  es real, no asumido; estructuralmente inviolable (id_gasto ya unico por
  pk_gastos) ⇒ sin familia 23505 nueva, exencion correcta por la skill;
  (4) Gasto.IdProveedor existe (int?, Gasto.cs:32) y el predicado del
  backfill calca ServicioDeSaldoDeProveedor.cs:31,40 (Confirmada +
  Categoria==Proveedor + IdProveedor==id), con deleted_at IS NULL
  explicito porque el SQL crudo no hereda el filtro BajaLogica;
  (5) el mapeo generico fk_/23503 → referencia_invalida esta en
  ManejadorDeErrores.cs:224 (Seguridad/, no Middleware/ — corregida la
  ruta del proposal §E al aprobar).
  NOTA ACEPTADA: el backfill estampa fecha con now() de PG — en contexto
  de migracion no hay IRelojDelSistema; bases frescas de test no escriben
  filas (padron vacio), asi que RelojFijo no se ve afectado. Orden interno
  de la migracion es contrato: TYPE → TABLE → FKs/indices → backfill →
  ALTER proveedores+UPDATE → RLS AL FINAL (la correccion no depende del
  carryover de ways_owner superusuario).
  CRITERIO DE VERIFY VINCULANTE: exactamente UNA migracion nueva llamada
  CuentaCorrienteDeProveedoresEtapa15; has-pending-model-changes limpio
  post-apply; prueba de FIDELIDAD del backfill contra la formula retirada
  del spec saldo-de-proveedor (mismo dataset ⇒ mismo saldo, con
  soft-deletes y gastos sin id_proveedor como casos discriminantes);
  conteo final de indices = 7 o el gate se reabre con enmienda.
phases:
  explore:
    status: done
    artifact: explore.md
    depends_on: []
    notes: >-
      Espejo de la etapa 7 en PATRON, no en paridad legacy (alsina E8 es ABM
      pelado, nunca hubo CC de proveedores). Saldo actual = derivado
      embrionario (ServicioDeSaldoDeProveedor, dos agregados EF, sin lock);
      el requirement "Saldo Is A Derived Read, Never Persisted" del spec
      saldo-de-proveedor se retira explicitamente (precedente etapa 7 con
      consumo-cuenta-corriente). Ni ConfirmarAsync ni gastos lockean
      proveedores hoy: orden total nuevo a pinnear turno -> compra header ->
      proveedor -> ledger INSERT. PRIMERA etapa NO-aditiva del programa:
      proveedores.saldo requiere backfill. Modelo tentativo:
      movimientos_cuenta_corriente_proveedor (operativa, 5 FKs / 5 indices
      de soporte ForeignKeyIndexConvention contados + AK, id_empleado
      simple no-composite por el sentinel NULL de staff de plataforma).
      Cinco Orchestrator Decisions registradas al pie del explore.md para
      formalizar en el proposal: (1) apertura por ajuste con la formula
      exacta del spec vigente, no replay sintetico; (2) el pago sigue
      siendo gastos (turno-scoped, visible al arqueo) con FK id_gasto y AK
      (Id,IdTenant) en gastos si falta; (3) reliquidacion FUERA de alcance;
      (4) retenciones/NC diferidas, tipo minimo compra|pago|ajuste;
      (5) contramovimiento en anulacion de compra EN alcance.
  propose:
    status: pending
    artifact: proposal.md
    depends_on: [explore]
  spec:
    status: done
    artifact: specs/
    depends_on: [propose]
    notes: >-
      5 archivos: cuenta-corriente-de-proveedores NUEVA (11 requirements /
      26 escenarios: apertura por backfill con fidelidad a la formula
      retirada — soft-deletes y gasto sin id_proveedor como casos
      discriminantes —, los 4 caminos de escritura, CHECK 23514 por insert
      crudo, RLS 42501, cache por construccion, estado de pago derivado
      del ledger, estado de cuenta con regla 10 de mutation-proof-tests:
      seed mediodia UTC + offset real -03:00, nunca Z; 3 carreras con el
      orden de locks pinneado); saldo-de-proveedor delta 1 MODIFIED + 2
      REMOVED (retiro explicito de "Saldo Is A Derived Read, Never
      Persisted", precedente etapa 7); gastos 1 ADDED (el pago escribe en
      el ledger); comprobantes-compra 2 ADDED (confirmar/anular escriben);
      operacion-de-pos 2 ADDED. TRES TENSIONES ARBITRADAS POR EL
      ORQUESTADOR (Orchestrator Decision 6): (T1) el /export sibling del
      estado de cuenta queda FUERA — el proposal es el contrato y lo
      excluye con racional ("cheapest first extension"); el brief del
      spec estaba desalineado, no el proposal; extension diferida
      registrada para el archive. (T2) el spec de la capability nueva
      excede el presupuesto de 650 palabras (~2000) por decision
      deliberada del proposal de NO partir la superficie en capabilities
      multiples — presupuesto leido como advisory, precedente
      size:exception de la 13. (T3) el requirement de estado de pago
      conserva su titulo original con cuerpo MODIFIED (convencion
      MODIFIED-not-RENAMED).
  design:
    status: done
    artifact: design.md
    depends_on: [propose]
    notes: >-
      16 decisiones con call sites archivo:linea, cero DDL nuevo (gate
      intocado). Nucleo: EscriturasDeCuentaCorrienteProveedor estatica
      (copia estructural de EscriturasDeCuentaCorriente) con UPDATE ...
      RETURNING crudo y ParametrosDeComando; los RETURNING autoritativos
      de compras se ENSANCHAN (+id_proveedor, total) en vez de pre-lecturas;
      pago despues del SaveChangesAsync (id_gasto es identity); apertura
      inalcanzable en 3 capas; Configuration espejo sin AK/self-FK con los
      6 indices nombrados a mano. Orden de locks verificado linea por
      linea con REFINAMIENTO aceptado: el FK check del INSERT de gastos
      toma FOR KEY SHARE sobre proveedores antes del FOR NO KEY UPDATE
      del saldo — modos no conflictivos en PG, mismo shape que el checkout
      con clientes; el invariante se enuncia "proveedores es el ultimo
      lock de fila TOMADO FOR UPDATE". 28 mutation targets colocados por
      slice + fila de no-regresion de VentasCheckoutTests. 6 slices
      ratificados ~2250 lineas.
      TENSIONES ARBITRADAS POR EL ORQUESTADOR (siguen a las OD 1-6):
      (OD7/T1) estado de pago por compra: se RECHAZAN ambas formulas — la
      del proposal (SUM importe <= 0: una compra pre-cutover sin movimiento
      propio leeria 'pagada') Y la del design (solo movimientos imputados:
      un pago parcial pre-cutover se pierde). Formula vinculante:
      pagado(X) = SUMA de gastos ligados a X (el mecanismo retirado sigue
      siendo verdad para TODO el tiempo porque el pago SIGUE siendo un
      gasto — decision 2) + SUMA(-importe) de movimientos tipo 'ajuste'
      imputados a X; los movimientos 'pago' NO se cuentan (espejan un
      gasto ya contado: double-count). Fidelidad pre-cutover preservada y
      los ajustes nuevos afectan el estado. (OD8/T2) anulacion de compra
      pre-cutover: fallback del design APROBADO — contramovimiento
      importe = -(importe del movimiento 'compra' si existe, si no
      -total de la compra); la deuda pre-cutover esta dentro del asiento
      de apertura y se revierte igual. (OD9/T3) estado de cuenta PAGINADO
      (patron etapa 14: OFFSET + desempate id_movimiento DESC, orden
      fecha DESC, id DESC del design d10); si el spec transcribio la
      forma sin paginar de la 7, tasks lo reconcilia a paginado. (T4)
      /export sibling: ya arbitrado FUERA en la fase spec (OD6); el read
      model queda export-ready sin costearlo. (T5) POST /ajustes
      top-level APROBADO (honra la decision 8 del proposal sobre el
      shape de rutas de la 7). (T6) STALE: el design leyo main PRE-merge
      del PR #133 — EscriturasDeCuentaCorriente ya usa ParametrosDeComando
      (verificado por grep post-merge); la decision 3 del design queda
      alineada sin accion.
  tasks:
    status: done
    artifact: tasks.md
    depends_on: [spec, design]
    notes: >-
      6 slices stacked-to-main (~2250 lineas), merge order 1->2->3->4->5->6:
      (1) migracion CuentaCorrienteDeProveedoresEtapa15 completa + entidad/
      Configuration + doc-10, con gate guard vinculante (exactamente UNA
      migracion, has-pending-model-changes limpio, 7 indices, fidelidad del
