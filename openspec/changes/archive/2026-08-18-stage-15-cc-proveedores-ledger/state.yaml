      slice 3 repite las carreras sobre los call sites reales. CERO
      conflictos nuevos fuera de las OD existentes.
      ENMIENDA DE SPEC POST-TASKS (orquestador, 2026-08-18, a raiz de la
      SUGGESTION del juez A en el judgment del slice 4): los dos spec
      deltas (saldo-de-proveedor MODIFIED y cuenta-corriente-de-proveedores
