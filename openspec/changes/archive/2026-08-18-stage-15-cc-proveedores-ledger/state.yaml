      ninguna de las dos formulas rechazadas los pasaba); (5) policy
      SupervisionDeCuentaDeProveedor + POST /ajustes top-level, #27;
      (6) web CuentaCorrienteDeProveedor.tsx + modal + Resumen re-apuntado,
      #28. Conflictos reconciliados con OD7 (formula, Orchestrator
      Decision 4 de tasks.md) y OD9 (paginacion, OD5 de tasks.md); OD8
