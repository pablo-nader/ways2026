TurnoListado (Contratos.cs:33-34) with NO totals; for a CLOSED turno the totals come from already-persisted arqueos_turno rows, so nothing is re-derived. (g) WEB AUTH VERIFIED FOR DECISION 8: the session is an HttpOnly cookie named ways.sesion with SameSite=Lax (Program.cs:55-60) and cliente.ts:42-44 calls same-origin /api with credentials:'include' — a plain <a href> WOULD authenticate; the reason to use fetch+blob is FAILURE HANDLING (a 403/400/401 would navigate the SPA away to a raw ProblemDetails page and never fire the alPerderLaSesion observer at cliente.ts:30-39,52-55), not auth. (h) NO STOCK LISTING EXISTS: StockEndpoints.cs:14 requires BOTH idPuntoVenta AND idArticulo, so 'stock exportable' needs a new report, not just an export — the basis of decision 10. (i) openspec/specs/ already contains reportes-de-gestion, rentabilidad-y-comisiones, tesoreria, turnos-de-caja, arqueo-de-cierre, movimientos-de-caja and estado-de-cuenta; the tesoreria spec carries a STANDING requirement 'Manual Tesorería Entries Are Out Of Scope' with scenario 'No manual tesorería endpoint exists', which this stage does NOT reopen (a read surface is not a manual entry endpoint, and the delta must say so explicitly)."
