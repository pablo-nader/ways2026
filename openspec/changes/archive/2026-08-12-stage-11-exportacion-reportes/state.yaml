notes:
  - "THIRD CHANGE OF THE POST-PARITY PROGRAM (docs/11-programa-post-paridad.md, etapa 11 = doc-11:121-140). Depends on stage-10-agregacion-dashboard (archived 2026-08-12) for the nine /api/reportes/* endpoints it exports, and on stage-6-turnos-caja for every byte of G2/G3 data. UNBLOCKS etapas 12, 13, 14 and 18, all of which depend on this stage ONLY for their printable/downloadable surface (doc-11:328-347)."
  - "THIS IS A PATTERN-SETTING STAGE, NOT A FEATURE STAGE. Its real deliverable is one decided, tested, licence-clean way to turn a report into a file, chosen ONCE (doc-11:123 'Elegir una sola vez'). The reports it ships are the proof the pattern works. Any decision that makes 'add an export' expensive to repeat has failed the stage even if it ships every listed report."
  - "BINDING INPUTS INHERITED FROM STAGE 10 (archive-report.md §8 Handoff) AND HONOURED: (a) exports CONSUME the existing /api/reportes/* aggregates rather than re-deriving them — no export re-queries, ever; (b) the LecturaDeReportes / LecturaDeRentabilidad split is PRESERVED, an xlsx of margin data being exactly as sensitive as the screen; (c) the exportable-report pattern was left as an OPEN DESIGN DECISION for this stage's proposal, and decisions 3/4/11 are its answer; (d) Ver Cajas (G2) and Caja Z (G3) were explicitly deferred here by stage 10's out-of-scope list; (e) stage-10's mandatory COVERAGE reporting on any estimated-cost figure extends to the exported file's header block — a margin figure without its coverage is a lie with a decimal point, and a file gets forwarded."
  - "AUTONOMOUS DECISION 1 (XLSX LIBRARY — ClosedXML, MIT, CONDITIONAL): EPPlus is DISQUALIFIED, not merely questioned — since v5 it ships under PolyForm Noncommercial, which forbids commercial use, and Ways is a commercial SaaS; the only permissive EPPlus is an abandoned pre-v5 branch. Raw DocumentFormat.OpenXml (MIT) rejected as the PRIMARY API because its verbosity would make 'add an export' cost pages of code, defeating the stage's identity — it stays in the graph anyway as ClosedXML's own dependency. NPOI (Apache 2.0) is the viable second fallback with worse ergonomics. BINDING CONDITION: slice 1 MUST enumerate the full transitive package graph and record each package's DECLARED licence in the PR description; any licence outside MIT / Apache-2.0 / BSD / MS-PL reopens the choice and falls back to MiniExcel (Apache 2.0), which is pre-approved. This is deliberately a VERIFIABLE STEP, not an assurance: a licence graph is exactly the kind of claim that must not be asserted from memory, and ClosedXML's transitive SixLabors font dependency is the specific thing to check."
  - "AUTONOMOUS DECISION 2 (NO CSV IN V1): XLSX carries typed numbers and dates natively and therefore has ZERO locale ambiguity; a CSV opened in an es-AR Excel has three (decimal comma vs field comma, accents without a UTF-8 BOM, dates parsed by regional setting). XLSX-only is both simpler AND more correct. Adding CSV later is one more formato enum value plus one more writer behind the same seam — no route, policy or contract change. RECORDED AS THE PRIMARY ADDITIVE PATH."
  - "AUTONOMOUS DECISION 3 (SYNCHRONOUS, BUFFERED, HARD ROW CAP THAT REFUSES): a job queue costs a table, a background service, generated-file storage, a polling endpoint and a retention policy — an entire stage of infrastructure serving zero current users at store-scale volumes, and it would FORCE the database change this stage is built to avoid. CAP: 25 000 data rows per file, counted with a COUNT(*) under the same filters BEFORE generating anything (never build a 300 MB workbook to then reject it). Over the cap -> 400 exportacion_demasiado_grande naming the ACTUAL row count and the offending range, with an actionable message. NEVER A TRUNCATED FILE: a spreadsheet someone forwards to their accountant with a silent cut is a lie with a footer, and a footnote does not survive copy-paste — this is the no-silent-caps principle applied literally. ESCAPE HATCH TO ASYNC IS EVIDENCE: the first real user who legitimately needs a range past the cap is the justification, not speculation."
  - "AUTONOMOUS DECISION 4 (ENDPOINT PATTERN — GET {ruta-del-reporte}/export?formato=xlsx, SAME MapGroup, declared immediately after its source route): REJECTED ?formato= on the source route itself — one route with two response types is an OpenAPI lie, breaks the generated client's typing, and silently redefines every existing test's contract. REJECTED a separate /api/exportaciones/* namespace — it has no structural link to its source, so parameters and policy drift BY CONSTRUCTION and every export must re-declare its gate by hand. Co-location makes BOTH inheritances structural rather than conventional. formato is REQUIRED with a single legal member (xlsx) in v1; anything else -> 400 formato_no_soportado. ACKNOWLEDGED TENSION with dto-contract-honesty (a one-value enum): accepted deliberately because the value is validated and load-bearing, it makes the URL self-describing in a support ticket, and it makes adding csv an ADDITION rather than a change of default behaviour. Content-Disposition emits both filename (ASCII) and filename* (RFC 5987 UTF-8)."
  - "AUTONOMOUS DECISION 5 (ROLE GATING — INHERITED STRUCTURALLY, WITH ONE EXPLICIT CAJA SPLIT): /rentabilidad/export and /comisiones/export stack LecturaDeRentabilidad exactly like their sources. FOR CAJA THE SPLIT IS DELIBERATE: the TURNO DETAIL / Z-REPORT sits under OperacionDePos — the same policy as GET /api/caja/turnos/{id}/resumen (CajaEndpoints.cs:10-12,64-67), which the cajero ALREADY reads on screen; refusing them a printable copy of the close they just performed would be absurd and the data is already theirs. The CROSS-TURNO HISTÓRICO (G2) and the TESORERÍA BOOK (G3) sit under LecturaDeReportes (Supervisor + Admin) because they are management views over other people's shifts and over the fondo de caja. VERIFY CRITERION: every export route ships a 403 test for the role ONE STEP BELOW its gate. THIS IS PROPOSAL QUESTION 2 for the owner."
  - "AUTONOMOUS DECISION 6 (G2/G3 SCOPE — MINIMAL NEW AGGREGATION, VERIFIED IN CODE): G3 = ZERO new aggregation (movimientos_tesoreria already stores the exact legacy Caja Z columns; one read endpoint, one screen, one export). G2 DETAIL = ZERO new derivation (ResumenDeTurno already returns everything doc-01:422-423 lists except the raw ticket and gasto line listings, both plain indexed WHERE id_turno_caja reads). G2 LISTING = the ONLY genuinely new aggregation, and it is cheap: for a CLOSED turno the totals come from the ALREADY PERSISTED arqueos_turno rows (sum importe_esperado / importe_declarado / diferencia), NEVER by re-running the live derivation N times; egresos reuse the EXISTING EgresosDeTurno definition (gastos del turno + retiros de movimientos_caja), never a second definition of the same word. OPEN TURNOS ARE EXCLUDED — it is a 'histórico de cierres' (doc-01:419) and the live turno is already on /caja, which removes the partial-totals-presented-as-a-close problem entirely."
  - "AUTONOMOUS DECISION 7 (FILE NAMING AND BRANDING — CONSERVATIVE DEFAULT, OWNER FLAG): pattern {reporte}_{alcance}_{desde}_{hasta}.xlsx, DETERMINISTIC — no timestamp, no random suffix, so two identical requests produce the same name and a re-download OVERWRITES instead of littering Descargas with (1), (2). ASCII ONLY in the file name (empresa and PV appear as ids, not names) even though filename* is emitted for correctness, because file names travel through mail, Windows shares and phones. HEADER BLOCK INSIDE THE SHEET (rows 1-4, blank row, table header at row 6): empresa, punto de venta or 'Todos', the date range, and the generation instant with its zone plus the user who generated it — A FILE OUTLIVES THE SCREEN, so it must say what it is and when it was taken. Any export carrying an estimated-cost figure repeats stage 10's COVERAGE block in that header. BRANDING BEYOND THAT (logo, colours, letterhead, per-empresa templates) IS OUT OF SCOPE AND FLAGGED FOR THE OWNER: it needs a stored asset, an upload path and an image-handling dependency — a feature with its own storage and UI, not a formatting detail. THIS IS PROPOSAL QUESTION 1 and the one genuinely product-weight call of the stage."
  - "AUTONOMOUS DECISION 8 (WEB DOWNLOADS — fetch + blob via a new api.descargar(), NOT a plain anchor): VERIFIED that a plain <a href> WOULD authenticate (HttpOnly cookie ways.sesion, SameSite=Lax, same-origin /api). AUTHENTICATION IS NOT THE PROBLEM; FAILURE IS. A 403 (a Supervisor clicking a rentabilidad export), a 400 (row cap) or a 401 (expired session) would navigate the SPA away to a raw ProblemDetails JSON page and never fire the existing alPerderLaSesion observer. api.descargar() reuses pedir's EXACT error path (ErrorApi + the 401 observer), reads the file name from Content-Disposition, and revokes its object URL. COST: the file is materialised in browser memory — bounded by decision 3's cap. BINDING UI RULE: every download button disables while in flight and surfaces ErrorApi.message in the page's existing error surface — a download that silently does nothing is this pattern's worst failure mode."
  - "AUTONOMOUS DECISION 9 (NO SERVER-SIDE PDF LIBRARY — BROWSER PRINT VIEW INSTEAD): the two 'imprimible' deliverables (estado de cuenta, detalle de caja) get a dedicated print layout and @media print CSS; the browser's own 'Guardar como PDF' covers the PDF need at ZERO dependency and ZERO licensing risk — the same shape the legacy used (ticket.php is a window.print(), doc-11:307-308). QUESTPDF EVALUATED HONESTLY: its Community licence is free only BELOW a declared annual-gross-revenue threshold, above which a paid Professional/Enterprise licence is required — adopting it now plants a REVENUE-TRIGGERED LICENSING CLIFF in the dependency graph of a commercial SaaS, for a use case that does not exist yet. Server-side PDF becomes genuinely necessary when a document must be EMAILED, ARCHIVED or LEGALLY ATTACHED: that is ETAPA 19 (comprobante fiscal con QR, where doc-11:304 ALREADY reserves the decision) and ETAPA 18 (etiquetas y carteles, with physical layout requirements). Deciding it here would decide it BLIND. ADDITIVE LATER: adding a PDF library changes no route, no policy and no data. NOTE FOR THE OWNER: this leaves etapas 18/19 owning the server-side PDF question — deliberate, since they are the ones that can see the requirement."
  - "AUTONOMOUS DECISION 10 (STOCK EXPORTABLE — MINIMAL AND LAST, DROPPABLE TO ETAPA 13): there is NO stock listing today (StockEndpoints.cs:14 requires BOTH idPuntoVenta AND idArticulo), so 'stock exportable' needs a NEW REPORT, not just an export. Ships as /api/reportes/stock/existencias (stock joined to articulos, covered by ix_stock_punto_venta) with a modest screen, as the LAST slice. If the budget tightens it drops to ETAPA 13, where a stock report belongs anyway — mínimos, punto de pedido and reposición give it the context it lacks here. RECORDED SO THAT DROPPING IT IS A DECISION, NOT AN OVERSIGHT. THIS IS PROPOSAL QUESTION 5."
  - "AUTONOMOUS DECISION 11 (ONE SEAM, ONE CONTAINMENT FOLDER): TablaExportable (neutral, typed columns: texto / entero / decimal / fecha / fechaHora) + IExportadorDeTabla in Application, one ExportadorXlsx in Infrastructure. Every report maps its EXISTING typed response record into TablaExportable — NO export re-queries the database, and no export contains a number the screen cannot show. VERIFY CRITERION: for EVERY export, an integration test asserts the exported figures EQUAL the JSON endpoint's figures for the same parameters. CONTAINMENT: the Excel library is referenced in EXACTLY ONE Infrastructure file (the same discipline stage 10 applied to recharts), with an architecture test asserting no other file references it — so swapping the library after a failed licence audit touches one file."
  - "CAPABILITIES CONTRACT for sdd-spec — NEW (2): 'exportacion-de-reportes' (the /export sibling-route convention, the formato enum, policy inheritance by co-location, the counted row cap and its refusal, file naming and the in-sheet header block, Content-Disposition encoding, the full inventory of exportable surfaces, and the BINDING INVARIANT that an export's figures equal its source endpoint's figures for the same parameters) and 'historico-de-cajas' (closed-turno listing with totals from ALREADY PERSISTED arqueos_turno rows, turno detail = existing ResumenDeTurno + the turno's ticket and gasto listings, the tesorería book, open turnos excluded, and the OperacionDePos / LecturaDeReportes split of decision 5). MODIFIED (3): 'reportes-de-gestion' (each report gains an /export sibling under its own policy; adds /stock/existencias), 'rentabilidad-y-comisiones' (margin and commission exports stack LecturaDeRentabilidad and MUST carry the coverage block in the exported header), 'tesoreria' (a read/listing surface now exists; THE MANUAL-WRITE EXCLUSION STANDS UNCHANGED and the delta must say so explicitly). NOT MODIFIED: comprobantes-venta, comprobantes-compra, estado-de-cuenta, stock, turnos-de-caja, arqueo-de-cierre, movimientos-de-caja, operacion-de-pos — this stage adds NO write path and changes NO existing requirement in them; the listing exports are owned end to end by the new exportacion-de-reportes capability rather than smeared across four existing specs."
  - "OUT OF SCOPE, EXPLICIT: any database change whatsoever (see gate); server-side PDF generation and any PDF library (decision 9); CSV as a shipped format (decision 2); branding beyond a text header block — no logo, no colours, no per-empresa template (decision 7, owner flag); asynchronous jobs, generated-file storage, scheduled or emailed reports (decision 3); ANY write path — in particular the legacy G3 'Ingresar FC' modal (manual tesorería entry), whose exclusion in the tesoreria spec is NOT reopened; OPEN TURNOS in G2 (it is a histórico de cierres); report builder, saved exports, per-user column selection, cross-empresa consolidated reporting; etiquetas y carteles (Etapa 18); auditoría export (Etapa 14); activación del recargo por medio de pago (still stage-10's decision 8, unchanged)."
  - "DELIVERY: NINE SLICES, NINE PRs, STACKED-TO-MAIN, each with its own judgment-day round per protocolo-pr-solo-dev. Slice 1 feat/stage11-slice1-exportador (~400: licence audit + package, TablaExportable/IExportadorDeTabla, ExportadorXlsx, row-cap guard, RFC 5987 Content-Disposition helper, FIRST export /reportes/ventas/resumen/export, containment + 403 + cap tests). Slice 2 feat/stage11-slice2-exports-reportes (~380: the remaining eight stage-10 exports, one mapping each). Slice 3 feat/stage11-slice3-exports-listados (~350: ventas listing, compras listing, estado de cuenta). Slice 4 feat/stage11-slice4-descarga-web (~330: api.descargar(), BotonDeDescarga, Tablero wiring, vitest). Slice 5 feat/stage11-slice5-cajas-api (~400: G2 listing + detail + both exports). Slice 6 feat/stage11-slice6-cajas-web (~380). Slice 7 feat/stage11-slice7-tesoreria (~330: G3 endpoint + export + screen). Slice 8 feat/stage11-slice8-vistas-impresion (~280). Slice 9 feat/stage11-slice9-existencias (~300, DROPPABLE TO ETAPA 13). REVIEW WORKLOAD FORECAST for sdd-tasks: total ~3150 lines, chained PRs REQUIRED, chain_strategy stacked-to-main; SLICES 1, 5 AND 6 ARE THE ONES AT REAL RISK of overflowing 400 — slice 1 splits at the seam/first-export boundary, slices 5 and 6 at the listing/detail boundary. As in every previous stage, overflow is expected to come from TEST DEPTH, not scope."
  - "RISKS carried into spec/design: (1) TOP RISK — AN EXPORT WHOSE NUMBERS DIFFER FROM THE SCREEN'S, via a second query path drifting silently: a wrong file that looks right and then gets FORWARDED is this stage's worst failure mode, strictly worse than stage 10's equivalent because the file outlives the session (mitigation: no export re-queries + an exported-equals-endpoint test per export); (2) transitive licence contamination in ClosedXML's graph (slice-1 audit recorded in the PR, MiniExcel pre-approved fallback); (3) a margin/cost workbook reaching someone who cannot see the screen (co-location + a 403 test at the role one step below each gate); (4) silent truncation (count-before-generate + hard 400, never a truncated file); (5) memory pressure from buffered workbooks (row cap); (6) G2 listing totals diverging from the turno detail (both read the SAME persisted arqueos_turno rows; the live derivation is never used for a closed turno); (7) scope creep into Etapa 18 or into a report builder (the formato enum has one member on purpose); (8) print view drifting from the screen it prints (same component data, not a second fetch); (9) web slices overflowing the 400-line budget."
  - "ARTIFACT LANGUAGE: English prose with Spanish domain identifiers, matching the verified convention of every archived change in openspec/ (stages 1-10) and of openspec/specs/, so downstream spec deltas merge into openspec/specs/ without a language seam."
  - "CARRYOVER WATCH (open, unrelated to this stage, inherited from the stage-8 archive and still open at stage 10): the ServicioDeArticulos articulos_empresas replace-set concurrency gap, and the pending micro-gate for the importe CHECK. Also still open: ways_owner is a testcontainer superuser, which weakens every migration-level test repo-wide — irrelevant to this stage (no migration). NEW OF THIS STAGE'S SHAPE: recharts containment has no CI lint rule (stage-10 WARNING-1) and this stage adds a SECOND containment boundary with the same weakness; a shared import-boundary rule is the natural future fix for both."
  - "OWNER FLAGS (need Pablo, do not block spec/design): (1) BRANDING ON GENERATED FILES — assumed a plain text header block and nothing else; logo, colours and per-empresa templates deferred. This is the one genuinely product-weight call of the stage. (2) Secondary, lower weight, recorded because they change user-visible behaviour: may a Vendedor download the Z-report of the turno they just closed (assumed YES, OperacionDePos); over-cap behaviour refuse vs truncate-with-notice (assumed REFUSE); XLSX-only with no CSV (assumed YES); and whether 'stock exportable' deserves a screen here or belongs to Etapa 13 (assumed: ship minimal and last, droppable)."
