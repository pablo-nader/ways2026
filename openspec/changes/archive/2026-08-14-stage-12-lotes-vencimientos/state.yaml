decisiones_tomadas:
  - "14 — SEMANTICA REAL DE LA CARRERA DEL GET-OR-CREATE (resuelta por el orquestador en el
    judgment-day del slice 5): el escenario del spec de comprobantes-compra prometia
    '23505 + backstop' para dos confirms concurrentes, pero empiricamente NINGUN 23505
    surge en ese camino — el ON CONFLICT ... DO UPDATE ... RETURNING apunta directo a
    ux_lotes_articulo_codigo y Postgres serializa la carrera adentro (design decision 4):
    el perdedor reusa la fila del ganador sin excepcion. El 23505 real vive en el alta
    admin (INSERT plano -> 409 lote_duplicado, cubierto en slice 3). Se enmendo el SPEC
    (requirement + escenario, con nota de auditoria); el codigo y el test empirico del
    apply quedan como estan. Mismo patron que la decision 13: la implementacion tenia
    razon, el spec exageraba el mecanismo."
  - "13 — SEMANTICA DE BORDE DEL VENCIMIENTO (resuelta por el orquestador en el judgment-day
    del slice 2): LA FECHA DE VENCIMIENTO ES INCLUSIVA — un lote con fecha_vencimiento == hoy
    NO esta vencido (clasifica por_vencer); vencido = fecha_vencimiento < hoy ESTRICTO
    (ReglaDeLotes.EstaVencido). El juez A detecto que el escenario de zona horaria del spec
    delta decia lo contrario del design; auditado, el THEN del spec ademas contradecia la
    intencion de su propio escenario (el bug de UTC naive ADELANTA el vencimiento un dia).
    Se enmendo el SPEC, no el codigo. Fundamento: semantica retail estandar (vence HOY =
    vendible HOY con urgencia por_vencer), consistencia con el rechazo de recepcion (409
    lote_vencido_en_recepcion rechaza fechas EN EL PASADO, no la de hoy), y sesgo
    conservador (no bloquear/estigmatizar mercaderia legalmente vendible). Propaga a los
    tres write sites, al reporte y al warning del POS via el unico helper ReglaDeLotes."
  - "1 — CONTROL DE LOTE POR ARTICULO, BINARIO Y OBLIGATORIO DONDE ESTA PRENDIDO:
    articulos.controla_lote boolean NOT NULL DEFAULT false, la forma exacta de EsProducto.
    Se RECHAZA el enum de tres valores (no aplica/opcional/obligatorio): 'opcional' es la
    unica opcion sin invariante honesto — una dimension que a veces se llena no es una
    dimension, es ruido que vuelve inasertable SUM(stock_lotes)=stock.cantidad. Reversible:
    apagar el boolean devuelve el articulo a comportamiento agregado al instante, la
    historia de lotes queda; ensanchar a enum despues es un backfill mecanico."
  - "2 — ACTIVACION POR EMPRESA VIA PARAMETRO, RECONCILIADA CON EL FLAG TENANT-WIDE POR AND,
    Y GRATIS: lotes_habilitado (bool, default false) como ParametroConocido nuevo (sin
    migracion, patron stage-10). CONTROL EFECTIVO = articulos.controla_lote AND
    lotes_habilitado — cierra el mismatch de scoping EN EL CAMINO DE ESCRITURA, no solo en
    la UI. Y la lectura de parametros de ServicioDeVentas se BATCHEA a una sola query (WHERE
    clave IN (...)): el hot path pasa de 2 round-trips de parametros a 1, o sea el flag del
    modulo NO SOLO ES GRATIS, SE PAGA SOLO. Delta de round-trips: modulo apagado -1; modulo
    prendido sin articulo con lote en el carrito -1 (controla_lote ya viene en el mapa de
    articulos cargado para pricing, no hay query de sondeo); modulo prendido con articulo
    con lote 0 (-1 batch, +1 lectura de saldos por lote para el plan FEFO). Residuo honesto:
    en un tenant multi-empresa con catalogo compartido el flag es VISIBLE en todas pero
    EFECTIVO solo donde el parametro esta prendido. Reversible: una fila de parametros."
  - "3 — STOCK PREEXISTENTE: LOTE 'SIN IDENTIFICAR' VIA PAR DE MOVIMIENTOS reclasificacion
    NETO CERO, NO UN BACKFILL DE MIGRACION. Trampa aritmetica resuelta: como
    stock.cantidad=SUM(movimientos), cualquier fila mueve el agregado — por eso la
    reconciliacion escribe un PAR (id_lote NULL, -X) + (id_lote L, +X) sobre el mismo
    (articulo, PV): agregado provablemente intacto, saldo del lote exacto, ledger
    append-only, auditable. Es la MISMA FORMA ESPEJADA que ya usan las transferencias,
    aplicada sobre el eje de lote en vez del eje de punto de venta. Corre sincronica y
    transaccionalmente cuando el control de lote se vuelve efectivo, es IDEMPOTENTE (residuo
    cero no escribe nada, esquivando ck_movimientos_stock_cantidad_no_cero igual que
    ContarAsync) y re-ejecutable desde un endpoint admin. Motivo propio y no 'ajuste' por el
    principio de trazabilidad que la spec de conteo-de-inventario ya fijo; el nombre
    'reclasificacion' es general A PROPOSITO: tambien cubre la correccion de un lote mal
    etiquetado (lote->lote, neto cero). Reversible: nada que deshacer, el agregado nunca se
    toco."
  - "4 — FEFO ES UN DEFAULT CALCULADO SERVER-SIDE, NUNCA UNA IMPOSICION; UN LOTE POR LINEA;
    EL MOSTRADOR NUNCA SE BLOQUEA. idLote es OPCIONAL en el request: si falta, el servidor
    elige FEFO en la fase de decision (antes de abrir la transaccion, constraint 5), asi un
    cliente que no sabe de lotes sigue transaccionando bien; si viene, se valida y SE
    HONRA — el operador tiene el paquete fisico en la mano y obligarlo a registrar otro lote
    convertiria el dato propio del sistema en mentira. ORDEN FEFO: es_sin_identificar DESC,
    fecha_vencimiento ASC, id_lote ASC — el sin-identificar va PRIMERO porque al activar ES
    el stock fisico mas viejo y dejarlo ultimo lo volveria inmortal (nunca drena, nunca
    aparece en el reporte porque no tiene fecha, envenena todo saldo para siempre). Un lote
    por linea: si el lote FEFO no cubre, la venta pasa igual (el lote puede ir negativo,
    paridad legacy) y el POS SUGIERE partir la linea. Reversible: imponer FEFO despues es
    una regla de validacion sobre datos que esta etapa ya produce."
  - "5 — LEDGER: id_lote NULLABLE ADITIVO + CACHE PARALELO stock_lotes; stock NO CAMBIA.
    Se rechaza re-clavar stock (rompe la PK de la tabla mas caliente y su invariante
    spec-asertada) y se rechaza derivar saldos del ledger en lectura (FEFO escanearia
    historia en cada checkout y desaparece la primitiva de concurrencia: no hay fila que
    lockear). stock_lotes es PK-only con el MISMO INSERT ... ON CONFLICT DO UPDATE ...
    RETURNING, o sea hereda el row-lock-as-serialization sin primitiva nueva. DOS
    INVARIANTES: (1) sin cambios, stock.cantidad = SUM(movimientos) por (articulo,PV) sobre
    OCHO motivos — los pares reclasificacion suman cero y no la perturban; (2) nuevo,
    stock_lotes.cantidad = SUM(movimientos con ese id_lote), y para un (articulo,PV) con
    lote efectivo y reconciliado, SUM sobre lotes = stock.cantidad. 'id_lote NOT NULL cuando
    el articulo controla lote' es un condicional entre tablas: NO es CHECK, es invariante de
    aplicacion con test de integracion dedicado; la alternativa de libro (columna redundante
    controla_lote en movimientos_stock + FK a clave unica (id_articulo,controla_lote) +
    CHECK) se RECHAZA para v1 por agregar una columna a la tabla mas caliente y obligar a
    los tres escritores a cargarla, y queda registrada como valvula de escape si el
    invariante se viola alguna vez en produccion. Reversible: todo aditivo y nullable."
  - "6 — ORDEN DE LOCK: UN SOLO ORDEN LEXICOGRAFICO (id_articulo, id_punto_venta, id_lote
    NULLS FIRST) CON LA FILA AGREGADA PRIMERO, IDENTICO EN LOS TRES SITIOS DE ESCRITURA.
    Concretamente: por cada (articulo, PV) en orden ascendente, primero upsert de stock,
    despues upsert de sus filas de stock_lotes en id_lote ascendente. Dos tablas, un orden,
    sin ciclo — porque el orden es propiedad de la TUPLA DE CLAVE, no de la tabla. Las
    transferencias conservan su regla (un solo orden sobre las 2N claves, nunca 'todo origen
    y despues todo destino'); la tupla solo gana un tercer componente. LA DUPLICACION NO SE
    REFACTORIZA: tres escritores, tres implementaciones de la misma regla, tres suites — es
    la posicion declarada del codigo y esta no es la etapa para unificar la logica mas
    sensible a concurrencia del sistema. Mitigacion: la regla se enuncia UNA VEZ en la spec y
    cada sitio tiene su propio test de concurrencia. Es la decision cuya MALA
    implementacion es cara (deadlock en produccion), no la reversion."
  - "7 — EN UNA TRANSFERENCIA EL LOTE VIAJA; SUFICIENCIA SE RECHAZA POR LOTE. El mismo
    id_lote se decrementa en origen y se incrementa en destino — un lote es identidad de la
    MERCADERIA, no de la UBICACION (por eso lotes no tiene id_punto_venta y el saldo vive en
    stock_lotes). Se rechaza la alternativa de mover cantidad agregada y re-bucketear en el
    sin-identificar del destino: destruiria la informacion de vencimiento en cada movimiento
    interno, o sea justo lo que la etapa existe para preservar. El endurecimiento de
    back-office se extiende al lote: se rechaza (409) si dejaria el LOTE de origen negativo
    aunque el agregado alcance. Reversible: una rama en un servicio."
  - "8 — ANULACION EXACTA POR SNAPSHOT; NCX CON LOTE EXPLICITO; id_comprobante_asociado SIGUE
    SIENDO OPCIONAL. items_comprobante_venta.id_lote es campo de SNAPSHOT (congelado al
    emitir, nunca re-derivado — legal bajo 'Snapshot Immutability of Items', se AGREGA al
    snapshot y no existe endpoint de edicion): eso hace la anulacion trivialmente exacta.
    Para NCX se RECHAZA volver obligatorio id_comprobante_asociado (cambiaria un
    comportamiento spec-ado de comprobantes-venta por una razon tangencial y volveria
    indevolvible la mercaderia vendida antes de prender el modulo) y se RECHAZA un lote
    'devoluciones' dedicado (inventa un vencimiento desconocido justo cuando el cliente
    entrego un paquete con la fecha impresa). Decision: la linea NCX de un articulo con lote
    efectivo LLEVA idLote explicito; el POS lo SUGIERE desde el snapshot del comprobante
    asociado cuando existe, si no desde los lotes existentes del articulo (el paquete
    devuelto tiene la fecha impresa: es la unica fuente de verdad que realmente existe), y si
    el operador no puede identificarlo el lote sin-identificar es la VALVULA DE ESCAPE — el
    mostrador nunca se bloquea. Reversible: una validacion."
  - "9 — decomiso ES UN MOTIVO DE PRIMERA CLASE, NO UN SABOR DE ajuste, Y SE NIEGA A IR
    NEGATIVO. Endpoint dedicado POST /api/stock/decomiso (Admin, GestionDeCatalogo sobre
    OperacionDePos), idLote obligatorio para articulos con lote efectivo, observaciones
    no vacia, cantidad POSITIVA del cliente que el servidor niega (misma disciplina de 'nada
    de delta firmado por el cliente' que impone ContarAsync), y rechazo 409
    stock_insuficiente_para_decomiso si dejaria el lote negativo. Razon: LA MERMA POR
    VENCIMIENTO ES UN NUMERO DE RESULTADO QUE EL DUEÑO QUIERE VER, y enterrada dentro de
    ajuste es inreportable sin parsear observaciones libre — exactamente la enfermedad tipo=95
    que el principio 4 del doc 10 existe para evitar; la spec de conteo-de-inventario ya
    sento el precedente separando inventario de ajuste 'for traceability' con un argumento
    mas debil. decomiso NO se restringe a lotes vencidos (rotura y perdida son reales).
    ESTE ES EL UNICO ARTEFACTO GENUINAMENTE IRREVERSIBLE DE LA ETAPA: Postgres no puede
    DROPear un valor de enum — revertir deja decomiso y reclasificacion como miembros muertos
    de motivo_stock, residuo en un tipo, sin daño de datos."
  - "10 — LAS ALERTAS SON PULL: REPORTE + HERMANO /export + TILE DEL TABLERO. NO SE CONSTRUYE
    INFRAESTRUCTURA DE PUSH. GET /api/reportes/stock/vencimientos?idPuntoVenta&dias= (dias
    default = nuevo parametro dias_alerta_vencimiento, 30), clasificando vencido/por_vencer/
    vigente, con su hermano /export?formato=xlsx por co-locacion segun el estandar de la casa
    de stage-11 — ESA ES la planilla de vencimientos / control de gondola de doc-11:155, al
    costo de un mapping y una linea de ruta. 'HOY' SE RESUELVE EN LA zona_horaria DEL PUNTO
    DE VENTA, nunca en hora de servidor/UTC: es exactamente la clase de bug de produccion que
    la ronda judgment-day del slice 9 de stage-11 cazo y que despues necesito el commit de
    endurecimiento 08e7707. Push implicaria dependencia de mail/SMS, scheduler, estado de
    entrega, reintentos/bounces, preferencias por usuario y baja — una etapa entera de
    infraestructura decidida a ciegas para cero usuarios actuales. HANDOFF EXPLICITO A LA
    ETAPA 13: el canal de alertas compartido que hereda ES PULL; si quiere push, lo decide
    con un segundo caso de uso real en la mano."
  - "11 — EL CONTEO DE UN ARTICULO CON LOTE EFECTIVO CUENTA POR LOTE; LA REGLA 'NUNCA UN
    DELTA' NO CAMBIA. Dejarlo agregado NO es neutral: moveria stock.cantidad sin tocar ningun
    saldo de lote y romperia el invariante 2 en silencio — no hacer nada es la unica opcion
    realmente insegura. El request lleva el total contado POR LOTE, el servidor deriva el
    delta de cada lote bajo el row lock de ese lote (la forma exacta de ContarAsync un nivel
    abajo), el delta agregado es la suma de los deltas por lote, y un lote sin diferencia no
    escribe fila. Ademas asi se cuenta fisicamente un perecedero: por la fecha en la gondola.
    Se RECHAZA volcar la diferencia al lote sin-identificar (fabricaria saldo no identificado
    a partir de un error de conteo: convierte una medicion en contaminacion). DEGRADACION
    PRE-APROBADA si el slice 8 se pasa de presupuesto: rechazar el conteo de articulos con
    lote efectivo con un 409 limpio — una etapa que entrega un rechazo es estrictamente mejor
    que una que entrega una divergencia silenciosa."
  - "12 — UN LOTE VENCIDO BLOQUEA EL BACK OFFICE Y AVISA EN EL MOSTRADOR. Aplicacion literal
    del principio que la spec de transferencias-de-stock ya enuncia (las operaciones de
    mostrador nunca bloquean por stock; las de back-office que reducen stock si). Venta/NCX:
    PERMITIDO con flag de warning en la respuesta y aviso prominente en el POS, preseleccionando
    un lote no vencido cuando exista — un bloqueo duro en la caja significa cola, llamada al
    encargado y, realistamente, la venta igual con el lote equivocado registrado, que es peor
    que una verdad registrada. Transferencia: RECHAZADA (409 transferencia_lote_vencido).
    Recepcion con fecha_vencimiento pasada: RECHAZADA (409 lote_vencido_en_recepcion) — recibir
    mercaderia ya vencida es un problema con el proveedor a resolver en la puerta. Reversible:
    tres validaciones independientes."
notes:
  - "CUARTA ETAPA DEL PROGRAMA POST-PARIDAD (docs/11-programa-post-paridad.md, etapa 12 =
    doc-11:142-163). Depende de stage-11-exportacion-reportes (archivada 2026-08-12) para el
    hermano /export de la planilla de vencimientos, de stage-8 para los tres sitios de
    escritura que extiende, de stage-10 para el Tablero y zona_horaria, y de stage-5 para
    stock/movimientos_stock y el invariante de suma. DESBLOQUEA la etapa 13, que segun
    doc-11:180-183 hereda de esta el canal de alertas compartido — esta etapa lo fija como
    PULL (decision 10)."
  - "LA RESTRICCION QUE GOBIERNA TODA LA ETAPA NO ES LA TABLA DE LOTES, ES EL INTERRUPTOR DE
    APAGADO. doc-11:148 es literal: 'el POS no puede pagar el costo de una dimension extra
    que no usa'. Se cumple ramificando en articulos.controla_lote (columna que llega dentro
    de una query que la venta YA hace, para pricing) y batcheando la lectura de parametros
    (2 queries -> 1). El hot path queda MAS BARATO que antes de la etapa, y es verificable
    contando queries: hay un criterio de exito que lo asserta con un test de conteo de
    round-trips, no por inspeccion."
  - "CONTRATO DE CAPABILITIES para sdd-spec — NUEVA (1): 'lotes-y-vencimientos' (identidad de
    lote e inmutabilidad de su vencimiento, saldo stock_lotes y sus dos invariantes, control
    de lote efectivo, contrato del default FEFO, lote sin-identificar y reconciliacion
    reclasificacion, circuito decomiso, reporte de vencimientos y su export, y el requisito
    VINCULANTE 'modulo apagado = costo cero' con su criterio de conteo de queries).
    MODIFICADAS (6): 'stock' (id_lote en el ledger, dos motivos nuevos, invariante de suma
    reenunciado sobre ocho motivos, ajuste lot-aware), 'transferencias-de-stock' (el lote
    viaja, orden de lock extendido, rechazo de suficiencia por lote, rechazo de lote
    vencido), 'comprobantes-venta' (id_lote como campo de snapshot, reglas de lote en NCX,
    anulacion exacta), 'comprobantes-compra' (input de lote en borrador, get-or-create al
    confirmar, rechazo de anulacion por lote, rechazo de recepcion vencida),
    'conteo-de-inventario' (total contado POR LOTE, 'nunca un delta' intacto),
    'parametros-operativos' (lotes_habilitado y dias_alerta_vencimiento, sin migracion).
    NO MODIFICADA: 'reportes-de-gestion' — siguiendo el precedente de stage-11 (los exports
    de listados los poseia end-to-end la capability nueva en vez de untarse sobre cuatro
    specs), el reporte de vencimientos lo posee 'lotes-y-vencimientos' de punta a punta."
  - "RIESGO NUMERO UNO: DEADLOCK entre un checkout y una transferencia una vez que la unidad
    de lock gana un tercer componente — intermitente, solo en produccion, y los tres sitios
    de escritura NO comparten helper (duplicacion deliberada, doc-comment de ServicioDeCompras
    la declara 'Slice 2 non-negotiable'). Mitigacion: un solo orden enunciado una vez en la
    spec + un test de concurrencia POR SITIO, no una asercion compartida. Riesgo dos: que los
    tres escritores implementen la regla de lote distinto — por eso los limites de slice
    siguen a los escritores (4, 5, 7, 8) y la regla pura vive en un helper de Domain aunque
    los cuerpos raw-SQL sigan duplicados por diseño."
  - "OUT OF SCOPE EXPLICITO: cualquier infraestructura de push (mail, scheduler, tabla de
    notificaciones, job runner) — no existe nada de eso en src; numeros de serie/trazabilidad
    unitaria; lineas de venta multi-lote; costeo o margen por lote (el costo sigue siendo por
    articulo, modelo de stage 9 intacto); horizonte de alerta por articulo; lote en gastos,
    tesoreria o cuenta corriente; workflow de conteo total con congelamiento/varianza (la
    exclusion vigente de conteo-de-inventario NO se reabre); volver obligatorio
    id_comprobante_asociado en NCX; superficie de recall hacia el cliente. Y los pendientes
    reservados del dueño: formula de comisiones, margen para Supervisor, modelo de lectura de
    OperacionDePos, cierre de caja por rol, branding de exports — intactos."
  - "ENTREGA: 11 SLICES TENTATIVOS, STACKED-TO-MAIN, judgment-day por slice segun
    protocolo-pr-solo-dev. REVIEW WORKLOAD FORECAST PRELIMINAR: ~3900 lineas totales; PRs
    encadenados RECOMENDADOS = Si; riesgo de presupuesto de 400 lineas = ALTO (slices 1, 4,
    5, 8, 10 y 11 al tope, con puntos de corte pre-identificados); decision necesaria antes
    de apply = Si, YA RESUELTA (auto-chain + stacked-to-main). El forecast vinculante lo
    produce sdd-tasks. Como en todas las etapas previas, se espera que el desborde venga de
    PROFUNDIDAD DE TESTS, no de alcance."
  - "CARRYOVER RELEVANTE: ways_owner es superusuario en el testcontainer, lo que debilita todo
    test a nivel migracion en el repo — a diferencia de stage-11 (cero migracion), ESTA ETAPA
    SI LO TOCA: es la primera desde la 9 en enviar una migracion real con RLS sobre tablas
    nuevas, asi que la debilidad afecta cuan fuerte se pueden testear las policies nuevas.
    Registrado para sdd-design. Siguen abiertos y sin tocar: gap de concurrencia del
    replace-set de articulos_empresas y el micro-gate del CHECK de importe (ambos de stage
    8), y la ausencia de regla de lint para los limites de contencion (stage 10/11)."
  - "IDIOMA DE ARTEFACTOS: prosa en ingles con identificadores de dominio en castellano,
    igual que todo change archivado en openspec/ (etapas 1-11) y que openspec/specs/, para
    que los deltas de spec se fusionen sin costura de idioma."
  - "FLAGS PARA EL DUEÑO (no bloquean spec/design, todos con asuncion registrada en la seccion
    'Proposal question round' de proposal.md): (1) ¿PUEDE UN CAJERO VENDER DE UN LOTE VENCIDO?
    asumido SI CON AVISO PROMINENTE — es la llamada de mas peso de producto de la etapa;
    (2) FEFO sugerencia vs imposicion, asumido SUGERENCIA; (3) el lote sin-identificar
    primero o ultimo en el orden FEFO, asumido PRIMERO; (4) conteo por lote vs rechazo,
    asumido POR LOTE con el rechazo pre-aprobado como degradacion; (5) alertas pull sin canal
    push, asumido SI; (6) un lote por linea de venta forzando el split, asumido SI."
  - "15 — LA SELECCION FEFO PREFIERE LOTES NO VENCIDOS (resuelta en el judgment-day del slice
    7): el spec de comprobantes-venta exige 'FEFO MUST pre-select a non-expired lot whenever
    one exists with positive balance' y el juez B probo en vivo que ElegirFefo elegia el
    vencido (orden por fecha ascendente puro). Resolucion: la SELECCION se particiona — entre
    los lotes con saldo positivo, primero los NO vencidos (el sin-identificar, sin fecha,
    cuenta como no vencido y conserva su primer lugar por decision 4), despues los vencidos;
    dentro de cada particion rige el orden FEFO base (es_sin_identificar DESC, fecha ASC, id
    ASC). 'Nunca bloquea' intacto: si solo hay vencidos con saldo, se elige el vencido (con
    warning LoteVencido). OrdenarFefo (el orden de LISTADO del picker) no cambia; cambia SOLO
    ElegirFefo, que gana el parametro hoy. Consumidores actualizados: ServicioDeVentas (plan)
    y ServicioDeLotes.ListarAsync (Sugerido — la sugerencia del picker debe ser consistente
    con la seleccion del server, decision 12)."
