db_gate: APPROVED-WITH-AMENDMENTS
db_gate_approval: >-
  APROBADO 2026-08-12 por el orquestador bajo mandato autonomo delegado, evaluacion FORMAL
  del 'Modelo de datos propuesto' contra doc 10 y doc 09, verificada contra el codigo real
  (ItemComprobanteVentaConfiguration, ItemComprobanteVenta.IdArticulo nullable,
  ItemComprobanteCompra.IdArticulo NOT NULL, helper HabilitarRlsDeTenant existente en 5
  migraciones, tabla de categorias doc-09:82-87). VEREDICTO POR CRITERIO — Naming: OK
  (espanol snake_case plural, PK id_lote, ck_/fk_/ix_/ux_ nombrados explicitos, override del
  default PascalCase de EF). Scoping: OK CON ENMIENDA 1 — la categoria de lotes es
  TENANT-WIDE (id_tenant SIN id_empresa, sigue al articulo como precios), NO 'Catalogo'
  (que lleva id_empresa NULL); el modelo fisico ya era correcto, se corrigio la
  clasificacion nominal en proposal.md. stock_lotes operativa como stock: OK. CHECKs: OK
  (ck_lotes_vencimiento_segun_tipo XOR correcto; ck_lotes_codigo_no_vacio;
  ck_items_comprobante_compra_lote_input; ausencia DELIBERADA de CHECK en
  stock_lotes.cantidad = paridad con stock, negativo permitido en mostrador). Indices: OK
  (parciales con WHERE deleted_at IS NULL; ux_lotes_sin_identificar unico parcial;
  ix_lotes_vencimiento para el reporte; soportes de FK explicitos). RLS: OK (ambas tablas
  nuevas via HabilitarRlsDeTenant, FORCE, patron identico a las 5 migraciones previas;
  stock_lotes ademas con filtro de tenant hand-rolled en WaysDbContext, precedente Stock).
  ENMIENDA 2 (vinculante, aplicada a proposal.md secciones F y G): las FKs de id_lote en
  items_comprobante_venta e items_comprobante_compra pasan de (id_lote,id_tenant) a la
  compuesta de 3 columnas (id_lote,id_articulo,id_tenant) contra la alternate key existente
  ux_lotes_id_articulo_tenant — reutiliza la unica AK (evita que EF cree una segunda AK
  (id_lote,id_tenant) sobre lotes) y lleva la coherencia lote/articulo al nivel de DB tambien
  en los snapshots; MATCH SIMPLE cubre id_articulo NULL (lineas de concepto libre) porque una
  linea con lote siempre referencia articulo y la aplicacion valida ese par. ENMIENDA 3
  (nota vinculante para design/apply): el get-or-create contra ux_lotes_articulo_codigo y
  el par de indices unicos de lotes requieren su backstop de traduccion de error y test de
  carrera con SQLSTATE 23505 asertado (skill db-error-backstops), y el upsert de stock_lotes
  hereda la disciplina RETURNING. La nota de migracion PG17 (ALTER TYPE ADD VALUE no usable
  en la misma transaccion) queda como criterio de verify. Alcance congelado: cualquier objeto
  de esquema fuera de la seccion enmendada reabre el gate.
db_gate_scope: >-
  THE STAGE PROPOSES REAL SCHEMA CHANGE. The 'Modelo de datos propuesto' section of
  proposal.md is the gate contract and is self-sufficient at table level: 2 NEW tables
  (lotes [catalogo tenant-wide, como articulos, EntidadTenant, RLS lotes_tenant FORCE];
  stock_lotes [operativa, PK-only como stock, filtro de tenant hand-rolled, RLS
  stock_lotes_tenant FORCE]); 2 NEW motivo_stock enum values (decomiso, reclasificacion);
  6 additive columns (movimientos_stock.id_lote nullable + FK compuesta
  (id_lote,id_articulo,id_tenant) + ix_movimientos_stock_lote; articulos.controla_lote
  boolean NOT NULL DEFAULT false + ix_articulos_controla_lote parcial;
  items_comprobante_venta.id_lote nullable snapshot + FK + indice;
  items_comprobante_compra.codigo_lote/fecha_vencimiento/id_lote + FK + indice +
  ck_items_comprobante_compra_lote_input). ZERO cambio de forma en stock. ZERO backfill,
  ZERO data statement sobre filas existentes, ZERO vista/trigger/funcion. Un solo migration:
  LotesYVencimientosEtapa12. NOTA VINCULANTE DE MIGRACION (PG17): ALTER TYPE ... ADD VALUE
  esta permitido dentro de transaccion desde PG12 pero el valor nuevo NO puede usarse en la
  misma transaccion — la migracion agrega los dos valores y no debe referenciarlos en ningun
  Sql()/seed propio. LA APROBACION DEL GATE OCURRE ANTES DE spec/design; cualquier objeto de
  esquema que sdd-apply escriba y que no este en esa seccion es violacion de alcance y
  reabre el gate.
