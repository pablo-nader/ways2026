notes:
  - "SECOND CHANGE OF THE POST-PARITY PROGRAM (docs/11-programa-post-paridad.md, etapa 10 = doc-11:98-119). Depends on stage-9-costo-congelado for the MARGIN DIMENSION ONLY (doc-11:112-113) — slices 1-6 and 8 are not blocked if stage 9 is still in flight; only slice 7 and the margin half of slice 3 are. Stage 11 (exportación) depends on this one."
  - "BINDING INPUTS INHERITED FROM STAGE 9 (stage-9-costo-congelado/state.yaml, decisions 1/2/4/5) AND HONOURED IN THIS PROPOSAL: (a) margen = total - costo_unitario * cantidad, IVA-INCLUDED ON BOTH SIDES, no conversion; (b) the three-state cost real/estimated(costo_es_estimado)/unknown(NULL) — estimated lines EXCLUDED BY DEFAULT with an explicit incluirEstimados opt-in, unknown NEVER presented as zero; (c) cost/margin is NOT visible to Vendedor, and stage-9 decision 5 deferred the whole visibility question to stage 10's own role-gated endpoints, which decision 3 below now answers."
  - "AUTONOMOUS DECISION 1 (DIRECT SQL, NO MATERIALIZED VIEWS): three reasons, the first DECISIVE. (a) A MATERIALIZED VIEW IS AN RLS HOLE IN THIS ARCHITECTURE: every tenant table is FORCE ROW LEVEL SECURITY with USING (app_es_plataforma() OR id_tenant = app_tenant_actual()), but RLS cannot be enabled ON a matview and a matview does not apply its base tables' policies to the querying role (security_invoker is a VIEW feature, not a matview one) — an MV over comprobantes_venta would materialize every tenant's rows into an object with no tenant filter, a cross-tenant leak in a shared-database SaaS. (b) FRESHNESS: a 'ventas de hoy' card that lags the last ticket destroys the trust of the person who just rang it up, and a refresh schedule is a support burden this stage does not need. (c) VOLUME: the existing composite indexes exist for exactly this access pattern at a volume measured in thousands of rows per store-year. REVERSIBLE: if a report ever measures slow, a REGULAR view (security_invoker) or an indexed rollup is additive and evidence-driven."
  - "AUTONOMOUS DECISION 2 (GRANULARITY + TIMEZONE): the day cut belongs to the PUNTO DE VENTA, not to the viewer and not to the server. UTC cuts would move every sale after 21:00 ART into the next business day — the evening block, systematically. TimeZoneInfo.Local (the ServicioDeOfertas.cs:478-483 v1 shortcut) is WORSE in production because the container runs UTC, so it silently IS the UTC cut. The viewer's browser zone is also wrong: the store's business day is a property of the store. RESOLUTION: new ParametroConocido key 'zona_horaria' (string, default 'America/Argentina/Buenos_Aires'), resolved punto de venta -> empresa -> declared default, applied as date_trunc(<granularidad>, fecha AT TIME ZONE <zona>). Granularity exposed: dia / semana (ISO, Monday-start) / mes. GOTCHA FOR DESIGN: this is the FIRST string-typed parametro and ServicioDeParametros.ValidarTipo deserializes the stored value as JSON, so the value must be stored QUOTED; the Parametros ABM editor must handle that."
  - "AUTONOMOUS DECISION 3 (ROLE GATING): TWO new policies. LecturaDeReportes = Supervisor + Admin (volume/operational reports). LecturaDeRentabilidad = ADMIN ONLY (cost, margin, commission). Root is out of both, consistent with GestionDeCatalogo/OperacionDePos ('root administra tenants, no opera ninguno'). Vendedor is out of both, completing stage-9 decision 5. WHY ADMIN-ONLY FOR MARGIN RATHER THAN SUPERVISOR+ADMIN: purchase cost is the most socially sensitive number in a small business and the asymmetry is total — widening a policy later is ONE LINE, while un-showing a number people have already seen is not a technical problem at all. SupervisionDeCuentaCorriente (Politicas.cs:57) is the precedent for a narrow new policy over widening a broad one. THIS IS PROPOSAL QUESTION 1 for the owner."
  - "AUTONOMOUS DECISION 4 (CHART LIBRARY): RECHARTS. MIT, React 19-compatible, declarative React components matching the house component style, and it renders SVG so it works under jsdom/RTL with an explicit width/height — unlike canvas libraries, which would need a canvas mock added to the existing vitest setup. VERIFIED NOTHING CONTRADICTS IT: package.json has no chart, canvas, d3 or visualization dependency and no license constraint. Rejected: Chart.js/react-chartjs-2 (canvas -> test friction), ECharts (bundle far past a 4-chart dashboard), visx (a toolkit, not a chart — more code to write and review), Nivo (heavier, same job). CONTAINMENT: recharts is imported ONLY inside src/Ways.Web/src/componentes/graficos/; pages consume our own GraficoDeBarras/GraficoDeLineas props, so swapping the library touches one folder."
  - "AUTONOMOUS DECISION 5 (COMISIONES): ship the REPORT, PROVISIONALLY, IN THE LAST SLICE, DESIGNED TO BE DELETED. The doc is explicit that the formula is a business decision (doc-11:118-119) and the owner is unavailable. Deferring entirely leaves a hole in the mandated stage scope; inventing a persisted liquidación creates data the owner never agreed to. MIDDLE PATH: comision = neto_vendido_por_empleado * comision_porcentaje, rate from a new ParametroConocido ('comision_porcentaje', decimal, DEFAULT 0 = OFF UNTIL SOMEONE SETS IT), over TX totals net of NCX, excluding anulados, grouped by id_empleado. NOTHING IS PERSISTED, NO SCHEMA EXISTS, the endpoint and card are labelled PROVISIONAL in the spec and in the UI, and it is slice 8 of 8 — if the owner rejects the formula, the slice is dropped or reverted with no migration and no data to unwind. THIS IS PROPOSAL QUESTION 2 for the owner."
  - "AUTONOMOUS DECISION 6 (DASHBOARD SCOPE BY SLICE): API first (slices 1-4), then web (5-8), and G1 PARITY BEFORE ANYTHING NEW. Slice 5 is the first thing the owner can look at and is deliberately the legacy G1 scope (ventas y gastos de los últimos 7 días) plus ticket promedio, so parity is demonstrable before breadth is added. Rentabilidad is slice 7 and comisiones slice 8 — the two most reversible items are last ON PURPOSE."
  - "AUTONOMOUS DECISION 7 (API SHAPE): EXPLICIT PER-REPORT ENDPOINTS under /api/reportes/*, NO generic aggregation/query endpoint. A generic ?groupBy=&metric=&filter= surface cannot be role-gated per dimension (margin has a different policy than volume — decision 3), cannot be written as Given/When/Then scenarios, cannot be indexed against, and turns every future report into an untested combination. Typed request/response records per report, following the dto-contract-honesty skill (every accepted parameter has a use or does not exist)."
  - "AUTONOMOUS DECISION 8 (RECARGO POR MEDIO DE PAGO IS NOT ACTIVATED HERE): MedioPago.RecargoPorcentaje exists (MedioPago.cs:20) but NO WRITE PATH APPLIES IT — there is no stored recargo amount to aggregate, so doc-11's backlog line ('Etapa 10 lo expone en los agregados; su activación es un cambio menor previo') describes a PRIOR change, not this one. Activation is a change to the CHECKOUT WRITE PATH, the most guarded code in the project, and does not belong in a read-only stage. The medio de pago report reads pagos_comprobante.importe exactly as stored and will report recargo automatically the day the amounts include it."
  - "AUTONOMOUS DECISION 9 (AGGREGATION SEMANTICS, PINNED — VERIFIED IN CODE): (a) NET SALES = SUM(comprobantes_venta.total) over tipos_comprobante.clase = venta, estado <> 'anulado', deleted_at IS NULL — NO SIGN BRANCH NEEDED because NCX lines carry a negative cantidad (CalculadorDeTotales.cs:5-8,32-42) so the NCX header total is already negative and the sum is net of returns by construction. (b) TICKET PROMEDIO = TX total / TX count, NCX EXCLUDED FROM BOTH numerator and denominator — a credit note is not a ticket; net sales and ticket promedio are reported side by side, never derived from each other. (c) COMPRAS bucket by fecha_recepcion with estado = confirmada: server-authoritative, never NULL on a confirmed compra, the moment stock and cost actually moved, and the column ix_comprobantes_compra_punto_venta_fecha already leads with; fecha_comprobante (DateOnly, the supplier's invoice date) is the FISCAL view and is deferred to stage 11. (d) MARGEN = SUM(total - costo_unitario * cantidad), IVA-included both sides (stage-9 decision 1, BINDING); costo_es_estimado lines EXCLUDED BY DEFAULT behind an explicit incluirEstimados flag; costo_unitario IS NULL NEVER treated as zero; EVERY margin response carries COVERAGE (lines and revenue included / excluded-as-estimated / skipped-as-unknown). A margin figure without its coverage is a lie with a decimal point."
  - "BINDING INVARIANT FOR SPEC/DESIGN/APPLY — RAW SQL DISCIPLINE: raw SQL does NOT get EF's global query filters. Every report query MUST spell out deleted_at IS NULL and its estado filter EXPLICITLY. This is a VERIFY CRITERION, not a convention: each endpoint ships a soft-delete test, an anulado test and a CROSS-TENANT test. Tenant isolation itself still holds through RLS because the GUCs are set per connection (InterceptorDeContextoDeTenant.cs:20-21), but that must be PROVEN per endpoint, not assumed."
  - "CAPABILITIES CONTRACT for sdd-spec — NEW (2): 'reportes-de-gestion' (endpoint shapes, empresa/punto-de-venta scoping, business-day bucketing and timezone resolution, which comprobantes count and with which sign, ticket promedio definition, soft-delete/anulado exclusions, the LecturaDeReportes gate) and 'rentabilidad-y-comisiones' (the stage-9 three-state cost, default exclusion of estimated lines with explicit opt-in, mandatory coverage reporting, the LecturaDeRentabilidad gate, and the PROVISIONAL commission formula). MODIFIED (1): 'parametros-operativos' — two new known keys, zona_horaria (string, default 'America/Argentina/Buenos_Aires') and comision_porcentaje (decimal, default '0'), both under the existing punto de venta -> empresa -> declared-default precedence. NOTHING in comprobantes-venta, comprobantes-compra, gastos, stock or operacion-de-pos changes: this stage adds no write path."
  - "OUT OF SCOPE, EXPLICIT: any database change whatsoever (see gate); EXPORTING ANYTHING — Excel/CSV/PDF is stage 11 and exists precisely because this dashboard raises the question, so no endpoint returns a file; activating recargo por medio de pago (decision 8); persisted commission liquidación, per-empleado rates, commission by article or by margin; period-over-period comparisons, targets, forecasting, alerting, scheduled/emailed reports; per-user dashboard layout, saved filters, widget reordering; CROSS-EMPRESA consolidated reporting (every report is scoped to one empresa, like every other endpoint); turno/caja-level reporting (Ver Cajas G2 and Caja Z G3 are stage 11); and ANY change to a write path — ServicioDeVentas, compras, gastos, caja and cuenta corriente are untouched."
  - "DELIVERY: EIGHT SLICES, EIGHT PRs, STACKED-TO-MAIN, each with its own judgment-day round per protocolo-pr-solo-dev. Slice 1 feat/stage10-slice1-reportes-base (~380: read layer + range/bucket/timezone domain type + zona_horaria parametro + both policies + /reportes/ventas/resumen + the cross-tenant/soft-delete test pattern). Slice 2 feat/stage10-slice2-ventas-por-dimension (~300: por-punto-venta, por-vendedor, por-medio-pago). Slice 3 feat/stage10-slice3-articulos-y-margen (~380: articulos/top + rentabilidad with three-state cost, incluirEstimados, coverage, LecturaDeRentabilidad). Slice 4 feat/stage10-slice4-egresos (~300: compras/por-proveedor, gastos/resumen). Slice 5 feat/stage10-slice5-tablero-g1 (~400: recharts + componentes/graficos wrappers + Tablero with G1-parity cards and ticket promedio). Slice 6 feat/stage10-slice6-tablero-dimensiones (~350). Slice 7 feat/stage10-slice7-tablero-rentabilidad (~250, role-gated, cost-coverage banner). Slice 8 feat/stage10-slice8-comisiones (~250, PROVISIONAL, DROPPABLE IN FULL). REVIEW WORKLOAD FORECAST for sdd-tasks: total ~2600 lines, chained PRs REQUIRED, chain_strategy stacked-to-main; SLICE 5 IS THE ONE AT REAL RISK of overflowing 400 — if it does, split the chart wrappers from the page."
  - "RISKS carried into spec/design: (1) TOP RISK — raw SQL missing deleted_at IS NULL / the estado filter and SILENTLY INFLATING A TOTAL: a wrong number that looks right is this stage's worst failure mode, and unlike stage 9's zero-row backfill it fails LOUDLY nowhere; (2) margin computed over estimated/unknown costs and read as truth (default exclusion + mandatory coverage + UI banner, never a bare percentage); (3) raw SQL leaking across tenants — RLS holds, but prove it per endpoint; (4) timezone bucketing moving the evening block to the next day (a 21:00-ART domain test); (5) the chart library becoming load-bearing (containment folder); (6) the provisional commission formula being read as agreed policy (default 0, PROVISIONAL label, last slice); (7) scope creep into stage 11 ('just add a CSV button'); (8) web slices overflowing the 400-line budget."
  - "ARTIFACT LANGUAGE: English prose with Spanish domain identifiers, matching the verified convention of every archived change in openspec/ (stages 1-9) and of openspec/specs/, so downstream spec deltas merge into openspec/specs/ without a language seam."
  - "CARRYOVER WATCH (open, unrelated to this stage, inherited from the stage-8 archive and still open at stage 9): the ServicioDeArticulos articulos_empresas replace-set concurrency gap, and the pending micro-gate for the importe CHECK. Also inherited from stage 9's design: ways_owner is a testcontainer superuser, which weakens every migration-level test repo-wide — irrelevant to this stage (no migration) but still open."
