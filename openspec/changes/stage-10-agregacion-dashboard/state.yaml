    notes: "No separate exploration pass. The orchestrator supplied a pre-resolved brief; propose RE-VERIFIED every load-bearing claim against source before writing. VERIFIED DURING PROPOSE: (a) doc-11:98-119 is the etapa-10 mandate and its 'Decisiones abiertas' (doc-11:116-119) were the input questions. (b) ZERO server-side aggregation confirmed — all 17 files under src/Ways.Api/Endpoints/ are CRUD/list handlers. (c) ComprobanteVenta.Fecha is DateTimeOffset (ComprobanteVenta.cs:30) written from IRelojDelSistema.Ahora = DateTimeOffset.UtcNow (IRelojDelSistema.cs:11); the web renders with toLocaleString('es-AR') (Caja.tsx:47-48, Compras.tsx:33-34, CuentaCorriente.tsx:72-73) i.e. the BROWSER's zone; the only existing server-side timezone handling is ServicioDeOfertas.cs:478-483, which uses TimeZoneInfo.Local and documents itself as a v1 shortcut with 'no hay huso de [tenant]'. (d) THE NCX SIGN QUESTION IS SETTLED IN CODE: CalculadorDeTotales.cs:5-8 states 'Cantidad llega con signo (negativa en NCX)' and :32-44 sums without a branch, so an NCX header total is ALREADY NEGATIVE and SUM(total) is net of returns by construction — no sign logic is needed in any aggregate. (e) RLS IS CONNECTION-LEVEL, NOT EF-LEVEL: InterceptorDeContextoDeTenant.cs:20-21 issues set_config('app.acceso',...)/set_config('app.tenant_id',...) on every ConnectionOpened, so RAW SQL ON THE SAME CONNECTION IS STILL TENANT-SAFE — but EF's global query filters (soft delete) do NOT apply to raw SQL, which is the top risk of this stage. (f) ParametroConocido.cs:11-13 explicitly documents the key registry as open and migration-free; ServicioDeParametros.ValidarTipo (:110-123) deserializes the stored value with JsonSerializer against the declared CLR type — a string-typed key must therefore be stored as a QUOTED JSON string, and zona_horaria would be the first string key (all four existing keys are decimal/int). (g) INDEX COVERAGE READ DIRECTLY off ComprobanteVentaConfiguration.cs:83-105, ComprobanteCompraConfiguration.cs:91-98 and GastoConfiguration.cs:66-76. ComprobanteCompraConfiguration.cs:94-95 leads its composite with FechaRecepcion, corroborating decision 9's choice of bucketing date. (h) MedioPago.RecargoPorcentaje EXISTS (MedioPago.cs:20) but no write path applies it — there is no stored recargo amount to aggregate (decision 8). (i) Politicas.cs enumerates the seven existing policies; SupervisionDeCuentaCorriente (:57) is the precedent for adding a narrow policy rather than widening a broad one. (j) src/Ways.Web/package.json has NO chart, canvas, d3 or visualization dependency and no license constraint — React 19.2, Vite 8, TS 6, vitest 4 + jsdom."
