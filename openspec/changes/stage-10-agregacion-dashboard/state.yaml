gate: "DB CHANGE GATE — EXERCISED AND APPROVED BY THE ORCHESTRATOR UNDER THE OWNER-DELEGATED OVERNIGHT MANDATE (2026-08-11): the no-schema-change model was formally evaluated (index-coverage justification checked against the existing composite indexes) and approved as proposed. CONDITION (binding): if sdd-apply finds itself writing ANY migration or schema object, the gate REOPENS and apply stops. Recorded for the owner morning report. Original gate text follows. — NOT APPLICABLE: THIS STAGE PROPOSES NO DATABASE CHANGE. The 'Modelo de datos propuesto' section of proposal.md states it explicitly and verbatim: no new table, view, materialized view, enum, column, constraint, index, FK or RLS policy; no change to any existing schema object; no migration; no data statement. The two new ParametroConocido keys (zona_horaria, comision_porcentaje) are CODE, not schema — ParametroConocido.cs:11-13 documents the registry as extensible without a migration ('agregar una clave nueva es agregar una entrada acá, no una migración'), and both keys declare defaults so ZERO parametros rows are required for the stage to work. INDEX REVIEW WAS PERFORMED AND CONCLUDED 'NONE NEEDED': the three new access patterns are already covered by ix_comprobantes_venta_punto_venta_fecha (id_punto_venta, id_tenant, fecha), ix_comprobantes_compra_punto_venta_fecha (id_punto_venta, id_tenant, fecha_recepcion), ix_gastos_punto_venta_fecha (id_punto_venta, id_tenant, fecha), plus ix_items_comprobante_venta_comprobante and ix_items_comprobante_venta_articulo for the item-level join/group. RECORDED FUTURE CANDIDATE, DELIBERATELY NOT PROPOSED: ix_comprobantes_venta_tenant_fecha (id_tenant, fecha) for empresa-wide range scans — only against a real EXPLAIN (ANALYZE) on production-shaped volume, as its own gated index-only slice. GATE REOPENS AUTOMATICALLY IF sdd-apply FINDS ITSELF WRITING A MIGRATION: any migration in this change is a scope violation, not an implementation detail, and must stop and return to the owner."
