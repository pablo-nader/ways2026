    notes: "Exploration ran as a delegated read-only pass (writes no file; Engram unavailable this session, so its findings are summarized inline here and in proposal.md). Findings: (a) LEGACY (alsina/, reference only) has item-level offers as columns on articulos (OfertaDia/OfertaHora/OfertaCant with date/hour/quantity rules) plus group-level offers on grupos (por cantidad acumulada / directa %); its precedence is ACCIDENTAL -- last-write-wins between the date and quantity blocks in comprobarOferta, elseif exclusivity in comprobarOfertaGrupo, and item+group offers firing independently -- explicitly NOT to be copied. (b) Legacy ticket representation = phantom OF... lines; doc 10 instead lands descuento + id_oferta on items_comprobante_venta, which is a stage-5 write path (out of scope here). (c) docs/10-modelo-de-datos.md:248-273 defines the ofertas table (catalogo scope) with the two exclusivity CHECKs, the vigencia windows, cantidad_minima, prioridad, acumulable, activo. (d) docs/09-multi-tenancy.md:84 classifies ofertas as Catalogo category (id_tenant + id_empresa NULL), same as listas_precio/grupos/categorias. (e) doc-10:557-569 stage sequence: stage 4 = ofertas -> 'POS completo'; stage 5 = comprobantes/pagos/stock. (f) Existing touchpoints: ResolvedorDePrecios (pure, DB-free -- the pattern for a new ResolvedorDeOfertas); ServicioDePrecios.PrecioVigenteAsync/PreciosVigentesAsync (the latter carries a deliberate N+1 with an INFO doc-comment deferring the fix to the POS stage -- verified in src/Ways.Application/Precios/ServicioDePrecios.cs:232-239); the generic ServicioDeCatalogo base is probably NOT a fit (dual CHECK-exclusive column groups + a junction, same kind of divergence ServicioDePrecios already took); all FK targets (articulos/grupos/categorias/listas_precio) already exist with composite-FK alternate keys from stages 1-3."
