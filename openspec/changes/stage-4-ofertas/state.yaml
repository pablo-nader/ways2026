notes:
  - "Scope binding per user decisions (question round run by the orchestrator, 2026-08-03) -- DECISION 1 (precedence): full doc-10 semantics from day one. Among matching ofertas, the highest-prioridad NON-acumulable oferta wins as the base benefit, and ALL matching acumulable=true ofertas stack on top of that result. The proposal pins a deterministic tie-break (greater effective discount for the line, then lower id_oferta) so the engine is never ambiguous; stacking is ADDITIVE OVER THE ORIGINAL RESOLVED PRICE (user decision 2026-08-03, second question round, superseding the proposal draft sequential wording): each matching oferta computes its discount independently against the original unit price (porcentaje = original x pct; importe_fijo = fixed amount; precio_unitario = original - precio_unitario), the discounts are summed, and the combined total is clamped at 100% so the final price never goes below 0; descending prioridad then ascending id_oferta is reporting order only -- sdd-spec must enumerate the scenarios (incl. clamp cases and per-benefit-type arithmetic) but the additive-over-original rule and the base/acumulable rule are binding, not refinable."
  - "DECISION 2 (v1 scope): full doc-10 shape -- articulo/grupo/categoria exclusive scope (CHECK num_nonnulls = 1), fecha_desde/hasta + hora_desde/hasta + dias_semana smallint[] {1..7} vigencia windows, cantidad_minima (NULL = oferta directa), the 3 exclusive benefit types (precio_unitario | porcentaje | importe_fijo, CHECK num_nonnulls = 1), prioridad int DEFAULT 0, acumulable boolean DEFAULT false, activo, nombre citext (the ticket label). No partial/phased column set."
  - "DECISION 3 (resolution included, batch-first): stage 4 ships CRUD/ABM AND a query-only resolution capability designed to resolve MULTIPLE articulos per call. Rationale: kills the N+1 documented in ServicioDePrecios.PreciosVigentesAsync (src/Ways.Application/Precios/ServicioDePrecios.cs:232-239, 'INFO para la etapa POS') before stage 5's POS depends on it. Resolution writes NOTHING -- no comprobante, no item, no stock."
  - "DECISION 4 (multi-lista targeting -- USER DEVIATION FROM DOC 10): an oferta can target MULTIPLE specific listas via a junction table ofertas_listas, which REPLACES doc 10's single id_lista_precio NULL column. Zero junction rows = applies to ALL listas, including derivadas (the benefit computes over the lista's already-resolved price); rows present = only those listas. Because docs/10-modelo-de-datos.md is the definitive schema per CLAUDE.md, UPDATING THAT DOC IS IN SCOPE for this change -- the doc must not drift from the implemented model."
  - "DECISION 5 (minor defaults, assumed and user-confirmed): every oferta defaults to tenant-wide (id_empresa NULL, empresa picker optional in the UI); a DEDICATED Ofertas screen with articulo/grupo/categoria/lista pickers, not tabs embedded in the articulos/grupos/categorias ABMs; negative-quantity/returns semantics deferred to stage 5; default offer-label rendering deferred to stage 5 ticket rendering."
  - "Out of scope, explicit: items_comprobante_venta writes (descuento + id_oferta snapshot), POS cart/ticket UI including the legacy phantom OF... line representation, stock/movimientos_stock (all stage 5), legacy offer data migration."
  - "Capabilities contract for sdd-spec -- NEW: 'ofertas' (CRUD/ABM, exclusive scope model, vigencia windows, exclusive benefit model, cantidad_minima trigger, multi-lista targeting, prioridad/acumulable/activo) and 'resolucion-de-ofertas' (deterministic precedence + stacking, batch resolution, query-only). MODIFIED: 'precios' gains a batch current-price resolution path consumed by offer resolution (closes the deliberate N+1); history / close-and-open / date-query semantics UNCHANGED. Existing specs in openspec/specs/: usuarios-tenant-scoping, usuarios-y-login, auxiliary-catalogs, parametros-operativos, clientes, proveedores, tenant-organization, articulos, codigos-barra, precios, listas-precio-minimal."
  - "DB CHANGE GATE (CLAUDE.md) applies before any EF Core migration is generated during apply -- unconditional, same as stages 1-3. This stage has 2 write paths (ofertas, ofertas_listas); the gate summary must group them AND state the doc-10 deviation (ofertas_listas replacing id_lista_precio) explicitly for approval."
  - "db-error-backstops compliance planned per constraint from the start (23505/23503/23514 mappings + race tests in the same work unit as each constraint). NOTE: this stage introduces the project's first CHECK-constraint-driven error surface (two num_nonnulls exclusivity CHECKs) -- confirm with the skill whether 23514 needs a mapping branch or whether Domain-level guards make it unreachable; document the reachability honestly either way, per the stage-3 precedent."
  - "Architecture expectation (design decides, not binding here): dedicated ServicioDeOfertas rather than extending the generic ServicioDeCatalogo<T,TListado,TAlta> base -- the dual CHECK-exclusive column groups plus the ofertas_listas junction are the same kind of divergence ServicioDePrecios already took. Pure DB-free ResolvedorDeOfertas in Ways.Domain.Ofertas mirroring ResolvedorDePrecios, so all precedence/stacking/tie-break rules are unit-testable without a database."
  - "Delivery: chained PRs, stacked-to-main (session decision, per protocolo-pr-solo-dev and the stage-3 precedent). Proposal explicitly flags for sdd-tasks to slice BY WRITE PATH: (1) schema + domain + migration, (2) CRUD/ABM service + API, (3) resolution engine (pure resolver + batch service + endpoint, including the batch price path), (4) web Ofertas screen. Review Workload Forecast discipline applies (exact guard lines required: 'Decision needed before apply', 'Chained PRs recommended', '400-line budget risk')."
  - "Web slice obligations (changed since stage 3): Ways.Web NOW HAS vitest + RTL infra (landed in PR #28, vite.config.ts, cleanup explicit without globals). The stage-3 smoke-only waiver NO LONGER APPLIES -- the Ofertas screen slice must ship descriptor/component unit tests per the web-descriptor-tests skill. The react-async-state skill (9 hard rules, notably rule 9: block supersede-during-write, do not token-reconcile it) is MANDATORY for any React work in this stage and must be injected into the apply/judgment-day prompts."
  - "Dependencies: stages 1-3 (merged) -- EntidadTenant, RLS helpers, keyed platform context, ManejadorDeErrores contract, and all FK targets (articulos, grupos, categorias, listas_precio) already existing with composite-FK alternate keys. DB Change Gate approval blocking before the migration."
  - "Rollback: fully additive. New tables (ofertas, ofertas_listas), new endpoints, new /ofertas route, new Domain namespace -- all removable without touching stage 1-3 flows. The only change to already-shipped code is the ADDED batch price path in ServicioDePrecios; existing single-article methods keep their signatures and semantics, so reverting stage 4 cannot break stage 3. The doc-10 edit is text-only and reverts with the migration."
  - "Engram was UNAVAILABLE during propose (2026-08-03) -- no mem_save was performed for sdd/stage-4-ofertas/proposal. openspec files are the single source of truth for this change. If Engram comes back, re-persisting proposal.md under topic_key sdd/stage-4-ofertas/proposal is a cheap catch-up."
  - "Spec/design reconciliation (orchestrator + user, 2026-08-03, third question round): (a) categoria-scoped ofertas INCLUDE descendant categorias (ancestor-chain match, tree depth <= 3) -- spec's original exact-match wording corrected, scenario added; (b) importe_fijo is PER UNIT (line of quantity Q discounts Q x importe_fijo; resolved output stays a reproducible unit price) -- pinned in the spec's stacking requirement; (c) hora/dias_semana windows evaluate in SERVER LOCAL TIME for v1 (no tenant timezone modeled anywhere yet; ParametroConocido is the natural future home -- design open question resolved as documented default, not user-blocking). Spec-level pinned assumptions confirmed with design: vigencia boundaries inclusive on both ends (unlike precios' half-open history windows, which exist to prevent overlap between consecutive rows -- not applicable here), dias_semana ISO-8601 numbering (1=Monday..7=Sunday), cantidad_minima matches with >=."
  - "sdd-tasks (2026-08-03): 4 slices, 39 tasks, ~2,850-3,950 lines forecast, High budget risk, chained PRs stacked-to-main. Slice 1 (schema+domain+first CHECK backstop classifier) is the size:exception candidate. Slices 3 (resolution engine) and 4 (web screen) are parallelizable -- both depend only on Slice 2's CRUD API (the Ofertas form never calls /resolver). Naming-drift decision recorded in tasks.md: the spec's CHECK error codes (oferta_alcance_invalido / oferta_beneficio_invalido) win over design.md's Backstop Map draft names; sdd-apply must honor the spec codes."
