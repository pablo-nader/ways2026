    notes: "Slice 1 (schema + domain foundation) COMPLETE, merged to main via PR #30. Judgment-day: R1 confirmed 1 real WARNING (window-order validation missing from ReglaDeOfertas, falsifying the four-CHECKs-unreachable claim) -> fixed the strong way (ValidarVentana added, 9 unit tests, error code parity ventana_de_oferta_invalida) + safe nullable fallback in ClasificarCheckDeOfertas (orchestrator-triaged); R2 B CLEAN, A docs-only (doc-10 CHECK listing completed inline, trivial-docs exemption, stage-3 precedent). Suite: 121/190/232. Migration OfertasEtapa4 clean. Forward for Slice 2: ServicioDeOfertas wires all four ReglaDeOfertas invariants; ofertas_listas replace-set needs the pk_ofertas_listas race test; spec-pinned CHECK codes in use (oferta_alcance_invalido / oferta_beneficio_invalido). --- Slice 2 (CRUD/ABM) COMPLETE, merged via PR #32. Judgment-day 3 rounds: R1 CRITICAL (unlocked read-then-write ofertas_listas replace-set: silent-union lost update OR untranslated DbUpdateConcurrencyException 500) -> pg_advisory_xact_lock(idTenant,idOferta) per ServicioDePrecios precedent + DbUpdateConcurrencyException->409 edicion_concurrente generic arm + single-query lista validation; R2 CRITICAL (PUT<->DELETE ghost edit: EliminarAsync lockless) -> lock+tx in EliminarAsync, post-lock AnyAsync liveness re-check in ActualizarAsync (fresh query, NOT the stale tracked entity - EF identity map would not refresh), rendezvous ghost-edit test, strict 2x200 race assertions, persisted-state verification, raw-SQL pk_ofertas_listas 23505 test, handler-level edicion_concurrente test; R3 clean (A: 2 doc suggestions, applied to design.md; B caught the R2 fix agent had NOT COMMITTED its work - landed as 622177d before PR). Suite: 121/204/256 (3 InMemory tests migrated to integration per the transaction-blocked-provider caveat). INFO: end-to-end DbUpdateConcurrencyException reachability test waived (arm is structurally unreachable behind the locks, unit test proves translation). Sibling pre-existing gap in ServicioDeArticulos articulos_empresas replace-set recorded as spawned follow-up task. Slices 3-4 unblocked, parallelizable. --- Slices 3 and 4 (2026-08-03/04, built in PARALLEL on isolated worktrees): Slice 4 (Ofertas.tsx dedicated screen, ~1.65k lines) merged via PR #34 -- built react-async-state-compliant from day one and hit judgment-day nearly clean on R1 (B CLEAN; A: 1 real WARNING, the rule-9 supersede path untested -> test added, orchestrator-verified inline per the stage-3 test-only precedent; 57/57 vitest). Slice 3 (resolution engine) merged via PR #36 after 3 rounds: R1 both judges hand-verified the additive arithmetic clean (incl. the 1000/-20/-10->700 canon and clamp cases); confirmed null-Lineas NRE->500 + untested referencia_invalida/empty paths -> fixed; R2 judge A DISPROVED the required fix with an isolated repro (SetsRequiredMembers makes STJ skip required checks, documented BCL behavior -> {} silently resolved as no-offers) -> replaced with the explicit contract lineas absent/null -> 400 lineas_requeridas, [] -> 200 empty; R3 CLEAN x2. Also at R1: task 3.13 wording corrected (DI-fixture edit acknowledged), design.md Open Questions notes the /resolver Admin-gated policy MUST be revisited by stage 5 before wiring the POS. Query budget PROVEN: interceptor-counted 6 queries constant at N=2 vs N=20. Parity batch==single pinned incl. Activo divergence. Final suite: 162/207/268 + 57 vitest. Two process incidents recorded: a fix agent died mid-stream (API stall, relaunched clean) and the slice-2 R2 fix agent had left work uncommitted (caught by judge B, landed as 622177d) -- commit verification is now an orchestrator checklist item."
