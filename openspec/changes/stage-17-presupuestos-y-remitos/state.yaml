      NUEVA, no espera a nadie: presupuestos es el primer lock contendible
      y el perdedor de la carrera de conversion no escribe NADA) y otra
      en 1.6. DOS refutaciones al brief con codigo: (1) anular una venta
      convertida NO revierte convertido→enviado — revertir exigiria
      nullear id_presupuesto_origen (el partial unique rechaza la segunda
      venta si no) borrando lo que realmente paso; el RETURNING se
      ensancha con subquery escalar del codigo del tipo, no una columna;
      (2) el guard never-negative de compras es CODIGO MUERTO para el
      remito (la reversion SUMA — postura ya documentada verbatim en
      ServicioDeVentas:1130-1135). TRAMPA CAZADA: MaterializarItems lee
      IdAlicuotaIva/porcentaje de HOY (:1049,:103-105) — el snapshot
      congelado exige un SEGUNDO materializador privado con
      CalculadorDeTotales como unica autoridad aritmetica (target #30:
      totales recomputados == header del presupuesto o 409). Clausula
      nueva del lock order escrita: un INSERT de fila nueva NO es una
      posicion del orden (la consolidacion y la anulacion TXR no son
      ciclo — T10). DOS hoy deliberados: FEFO conserva el hoy UTC-naive
      del checkout (divergencia silenciosa si el 4to site eligiera OTRO
      lote — target #47); el vencimiento usa la zona del PV. Slices: 8
