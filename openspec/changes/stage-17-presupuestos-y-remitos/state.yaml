      rechazos extra del design son guards legitimos; (T6) el perdedor
      de la carrera de conversion QUEMA un numero de la serie de VENTA —
      aceptado con registro (huecos legitimos, precedente OC); (T7)
      ComprobanteEmitido GANA IdPresupuestoOrigen — corrige el "no
      response shape changes" por dto-contract-honesty (mismo arbitraje
      que la T7 de la 16); (T10) la clausula del lock order queda
