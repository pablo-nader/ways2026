      schema (precedente 16-d10) y el Estado header de doc-10 abierto en
      1/4 y CERRADO EN EL SLICE 8 (la regla nueva del programa).
      TENSIONES T1-T12 ARBITRADAS (Orchestrator Decision 9): TODAS
      ratificadas a favor del design — las clave: (T3) UNA lista de
      precios por presupuesto como invariante de servicio (si el spec
