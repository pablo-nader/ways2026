  design:
    status: done
    artifact: design.md
    depends_on: [propose]
    notes: >-
      18 decisiones con call sites, 60 mutation targets, 8 slices, cero
      DDL nuevo. Nucleo: el toque a ServicioDeVentas es EXACTO al criterio
      del gate — una clausula en :930, la rama del snapshot en DECIDE
      (:59/:91/:107), llamada guardeada en POSICION 1.5 (entre el turno
