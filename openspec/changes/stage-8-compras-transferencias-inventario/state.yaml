gate: "DB CHANGE GATE — EXERCISED BY THE ORCHESTRATOR IN AUTONOMOUS MODE (2026-08-05). The user (Pablo) explicitly delegated ALL decisions for this change to the orchestrator, INCLUDING the DB change gate ('si hay que hacer modificaciones en la estructura de la db aprobalas vos... maneja todo autonomo'). The gate STEP STILL HAPPENS -- the model summary is presented and the evaluation recorded in proposal.md under 'DB Change Gate -- orchestrator evaluation' -- it simply does not WAIT for the user. MODEL: (a) TWO NEW [operativa] TABLES per doc-10:370-398 -- comprobantes_compra (id_comprobante_compra, id_tenant, id_proveedor, id_tipo_comprobante [clase=compra], numero_externo citext NULL, fecha_comprobante date, fecha_recepcion timestamptz, id_punto_venta, id_empleado, subtotal, descuento_total, iva_total NULL, total, observaciones, estado estado_compra NOT NULL; NO baja logica -- same posture as comprobantes_venta, transitions never deletion) and items_comprobante_compra (id_item, id_comprobante_compra, orden, id_articulo, descripcion snapshot, cantidad numeric(12,3), bultos numeric(10,2) NULL, unidades_por_bulto numeric(10,2) NULL, costo_unitario numeric(14,4), descuento numeric(14,2) DEFAULT 0, id_alicuota_iva, porcentaje_iva numeric(5,2), total numeric(14,2), actualiza_costo boolean DEFAULT true, precio_sugerido numeric(14,2) NULL). DEDUPE: doc-10:384 specifies UNIQUE (id_proveedor, id_tipo_comprobante, numero_externo) -- TWO CONFORMITY ADJUSTMENTS APPROVED AND LOGGED: (i) it MUST include id_tenant (every operativa table is tenant-scoped; doc 10's DDL sketches omit id_tenant by convention), (ii) it ships as a PARTIAL unique index excluding estado='anulada' and NULL numero_externo, so a mistyped invoice that was annulled can be re-entered. NEW POSTGRES ENUM estado_compra (borrador|confirmada|anulada, doc-10:382) -- MUST be registered in BOTH DependencyInjection.cs:99-105 AND WaysDbContextFactory.cs:39-45. Composite FKs (id, id_tenant) per the established pattern; id_empleado stays a SIMPLE FK to usuarios (deliberate deviation documented at doc-10:466-470). (b) DEFERRED FKs LANDING: movimientos_stock.id_comprobante_compra and gastos.id_comprobante_compra -- both int NULL + composite FK + supporting index, additive, ON DELETE RESTRICT. BOTH were explicitly scheduled for THIS stage by doc-10:457-465 and doc-10:426-434. (c) TRANSFERENCIAS/INVENTARIO: NO SCHEMA CHANGE AT ALL -- motivo_stock already carries transferencia and inventario (doc-10:449-450) and id_punto_venta_destino already exists with its FK (MovimientoStockConfiguration.cs:51, :96-103). (d) GLOBAL CATALOG: three tipos_comprobante rows of clase=compra (C-FA/C-FB/C-FC). TiposComprobanteBase (InicializadorDeBaseDeDatos.cs:63-76) currently HARDCODES Clase=ClaseComprobante.Venta at :424, so the tuple gains a Clase field; dual path (seed-list + idempotent migration INSERT ... WHERE NOT EXISTS WITH THE AND EXISTS FRESH-DB GUARD -- the stage-7 lesson: without it a fresh deployment gets the compra rows BEFORE the seeder, whose !AnyAsync() check then skips and silently loses every other catalog row). (e) CONFORMITY: strict doc-10 SS5/SS6 shape; NO change to any existing column or index; NO change to estado_comprobante, categoria_gasto, motivo_stock or the arqueo derivation; RLS and operativa scoping identical to every other tenant table. Migration name: ComprasYTransferenciasEtapa8. EVALUATION: APPROVED by the orchestrator under the autonomous mandate, conditional on (i) the compra-tipo seed shipping dual-path with the AND EXISTS fresh-DB guard, proven on BOTH a fresh and a stage-7-migrated database; (ii) compra codes being GLOBALLY UNIQUE against every existing venta code, with a test proving venta resolution is unaffected (ux_tipos_comprobante_codigo is UNIQUE on codigo ALONE and ResolverTipoComprobanteAsync resolves by codigo alone); (iii) the dedupe unique being tenant-scoped and partial as described; (iv) every new constraint having a db-error-backstops mapping plus a race