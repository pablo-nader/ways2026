    notes: "No separate exploration pass. The orchestrator supplied a pre-resolved brief with code hooks and doc references; propose RE-VERIFIED every one of them against source before writing. VERIFIED DURING PROPOSE: (a) doc-10:639 stages 'Comprobantes de compra + transferencias de stock' as etapa 8, unlocking 'Superar al legacy' -- it is the LAST row of the stage table (doc-10:629-639), so archiving this change closes doc 10's sequence. (b) doc-10:365-409 (SS5) fully specifies comprobantes_compra + items_comprobante_compra: numero_externo citext is 'el numero DEL PROVEEDOR (0003-00012345); aca no hay correlativo propio' (:374-375), UNIQUE (id_proveedor, id_tipo_comprobante, numero_externo) 'la misma factura no entra dos veces' (:384), estado_compra enum borrador|confirmada|anulada (:382), costo_unitario numeric(14,4) '4 decimales: costos con mas precision' (:392), actualiza_costo boolean DEFAULT true 'al confirmar, pisa articulos.costo_nominal' (:396), precio_sugerido numeric(14,2) NULL 'propuesta de nuevo precio de venta (margen)' (:397). LIFECYCLE :401-404 verbatim: 'se carga en borrador (se puede ir armando con el remito en la mano), y al confirmar -- en una sola transaccion -- genera los movimientos_stock de entrada, actualiza costo_nominal donde actualiza_costo, y OFRECE actualizar precios de venta segun margen del grupo/proveedor. anulada revierte con contramovimientos.' The word 'ofrece' is load-bearing -> decision 3. GASTOS RELATION :406-409 verbatim: 'la compra registra la mercaderia; el gasto registra la plata... Una compra puede estar impaga (sin gasto asociado) -- eso ya da una cuenta corriente de proveedores embrionaria SIN TABLA EXTRA' -> decision 6. (c) doc-10:426-434 is the etapa-6 note deferring gastos.id_comprobante_compra to etapa 8 'que agrega la columna y su FK juntas, en la misma migracion que crea comprobantes_compra'; doc-10:457-465 is the etapa-5 twin note for movimientos_stock.id_comprobante_compra, and it also records that id_punto_vent