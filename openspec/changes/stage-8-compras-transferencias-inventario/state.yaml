notes:
  - "AUTONOMOUS MODE (binding for every downstream phase): the user delegated ALL decisions for this change to the orchestrator, INCLUDING the DB CHANGE GATE. Gate approvals are exercised by the orchestrator with STRICT doc-10 conformity; the gate step is still performed (model summary + recorded evaluation) but does not block waiting for the user. EVERY decision is logged -- in proposal.md's decision ledger and in these notes -- for the user's final summary. THREE items MUST appear in that summary: decision 1 (the inventario scope call), decision 6 (proveedor CC deliberately kept embrionaria against the stage-7 richer-ledger precedent), and the decision-5/10 tightening (back-office stock operations refuse to go negative while a sale still does not)."
  - "LAST STAGE OF DOC 10. Etapa 8 is the final row of the stage table (doc-10:639). Archiving this change CLOSES the legacy-parity program: there is no etapa 9 in the document. Any residual work (full-count inventory, a real proveedor CC, ordenes de compra, libro IVA compras) becomes a normal post-parity change, not a stage."
  - "DECISION 1 (SCOPE -- THE ONE AUTONOMOUS SCOPE CALL, FLAG IN THE FINAL SUMMARY): compras + transferencias + a MINIMAL inventario. The stage table names only 'Comprobantes de compra + transferencias de stock' (doc-10:639), but motivo_stock reserves inventario (doc-10:449-450, MotivoStock.cs:5-8) and this is the LAST stage. Rationale: leaving one enum value writer-less would spawn a phantom stage 9 for a single endpoint that reuses machinery this stage already builds. SHIPPED: a per-articulo conteo endpoint (motivo=inventario, DISTINCT from ajuste so a recount is not confused with a correction, reusing AjustarAsync's transaction shape). NOT SHIPPED: any full-count snapshot/freeze/variance workflow. TRIM PATH: if the user disagrees, dropping the conteo removes exactly one small slice and nothing else changes. (orchestrator-resolved, autonomous mode)"
  - "DECISION 2 (compra lifecycle, exactly doc-10:401-404): borrador -- incrementally editable with the remito in hand, NO ledger effect whatsoever; confirmar -- ONE transaction writing the entry movimientos_stock rows (motivo=compra, id_comprobante_compra set), overwriting articulos.costo_nominal where actualiza_costo (doc-10:396) and upserting the stock cache; anulada -- reversed by contramovimientos (doc-10:404, the stage-5 anulacion pattern). Confirmada and anulada comprobantes are IMMUTABLE. ARCHITECTURAL NOTE FOR THE SPEC: a mutable borrador is a DELIBERATE exception to the project's append-only posture, and it is safe PRECISELY BECAUSE a borrador has produced no movement -- the spec must state that as the reason, not merely allow it. (orchestrator-resolved, autonomous mode)"
  - "DECISION 3 (precio_sugerido is a SUGGESTION; price updates are a SEPARATE EXPLICIT ACTION): doc-10:403 says the confirm 'OFRECE actualizar precios de venta segun margen del grupo/proveedor' -- offers, not applies. precio_sugerido is computed per item through the EXISTING pure SugeridorDePrecio (SugeridorDePrecio.cs:39-55, whose own doc-comment already states 'La sugerencia NUNCA se aplica sola') and stored on the item as an audit of what was proposed at receiving time; applying it goes through the EXISTING ServicioDePrecios.AbrirNuevoPrecioAsync (ServicioDePrecios.cs:80) so price history is preserved. Rationale: a silent margin-driven repricing of the whole catalog on a receiving confirm is the single most dangerous thing this stage could do. NEVER inside the confirm transaction. (orchestrator-resolved, autonomous mode)"
  - "DECISION 4 (turno boundaries): GOODS-IN REQUIRES NO TURNO -- confirming a compra moves merchandise, not cash, so it follows AjustarAsync (which takes no turno) and not the sale path. PAYING A COMPRA IS A GASTO of categoria=proveedor with id_comprobante_compra set, under the EXISTING, UNTOUCHED open-turno gate (spec: gastos / Gasto Requires An Open Turno; GastosEndpoints.cs:12). THE ARQUEO DERIVATION STAYS BYTE-UNTOUCHED: openspec/specs/arqueo-de-cierre/spec.md:45-52 derives 'SUM(gastos.importe on that medio)' CATEGORIA-AGNOSTICALLY, so a compra payment already flows through with no new term -- this is a VERIFY CRITERION (prove CalculadorDeArqueo unchanged), NOT an assumption. (orchestrator-resolved, autonomous mode)"
  - "DECISION 5 (transferencia = ONE transaction, TWO mirrored movements) + VERIFIED CORRECTION TO THE BRIEF: origin row (id_punto_venta=origen, cantidad=-q), destination row (id_punto_venta=destino, cantidad=+q), both motivo=transferencia with id_punto_venta_destino populated (column and FK ALREADY EXIST -- MovimientoStockConfiguration.cs:51, :96-103), both caches upserted in the SAME transaction. NO in-transit state, NO transfer document. INVARIANT THE SPEC MUST PIN: each row's id_punto_venta is THE LOCATION IT AFFECTS, otherwise the sum-invariant (specs/stock/spec.md:86-96) breaks per punto de venta. Design decides how the two rows are LINKED; the conservative recommendation (no schema beyond what exists) is that both rows carry id_punto_venta_destino = destino. CORRECTION: the incoming brief called the insufficient-origin-stock refusal 'the same rule class as venta' -- it is the OPPOSITE. specs/stock/spec.md:34-35: 'Availability is NOT checked -- negative stock is allowed (legacy parity)'. Refusing a transfer is a DELIBERATE TIGHTENING, justified by the principle the spec must pin: COUNTER OPERATIONS NEVER BLOCK ON STOCK; BACK-OFFICE STOCK-REDUCING OPERATIONS DO (a cashier must never be stopped mid-sale; a depot move that would invent units costs nothing to refuse). Other edge rules: origen == destino rejected (400); a destino of another tenant is invisible (RLS/EF filter) and answers per ADR-8; a multi-item transfer writes 2N rows in one transaction. (orchestrator-resolved, autonomous mode)"
  - "DECISION 6 (PROVEEDOR CC STAYS EMBRIONARIA -- FLAG IN THE FINAL SUMMARY): doc-10:408-409 verbatim -- 'Una compra puede estar impaga (sin gasto asociado) -- eso ya da una cuenta corriente de proveedores embrionaria SIN TABLA EXTRA'. So: NO movement table, NO saldo cache, NO imputacion, NO aging. The saldo is a DERIVED READ: SUM(compras confirmadas.total) - SUM(gastos where categoria=proveedor and id_proveedor=X), with per-compra payment status computed from the LINKED gastos only. Borradores and anuladas excluded. The read is explicitly documented as an APPROXIMATION, NOT AN INVARIANT -- an unlinked proveedor gasto still reduces it, because it is still money paid to that supplier. DEPARTURE RECORDED: stage 7 set a richer-ledger precedent (movimientos_cuenta_corriente with saldo_resultante snapshots) that is DELIBERATELY NOT FOLLOWED here because doc 10 forbids the extra table. A full proveedor CC is a future change, not a gap. (orchestrator-resolved, autonomous mode)"
  - "DECISION 7 (compra-clase tipos_comprobante, PREFIXED CODES -- the key gate finding): CONSTRAINT VERIFIED IN CODE -- ux_tipos_comprobante_codigo is UNIQUE on codigo ALONE (TipoComprobanteConfiguration.cs:54-57) AND ServicioDeVentas.ResolverTipoComprobanteAsync resolves by codigo ALONE (:697, FirstOrDefaultAsync(t => t.Codigo == codigo)) BEFORE checking Clase != Venta (:702), so a compra row reusing 'FA' could be returned by that lookup and break the sale path. DECISION: seed C-FA, C-FB, C-FC (clase=compra, letra A/B/C, signo=+1, discrimina_iva true only for A, afecta_stock=true, es_fiscal=false). REJECTED ALTERNATIVE: widening the index to (clase, codigo) -- it would let compra rows reuse FA, but it changes a stage-1 GLOBAL index AND leaves every by-codigo lookup ambiguous forever. es_fiscal=false because the flag means 'reporta a AFIP/ARCA cuando exista FE' (doc-10:88) and we never EMIT a supplier's invoice; this says nothing about IVA credito, which is out of scope. Design may refine the exact strings -- THE GLOBALLY-UNIQUE-CODIGO CONSTRAINT IS BINDING. SEED MECHANICS: dual path (seed-list + idempotent migration INSERT ... WHERE NOT EXISTS with the AND EXISTS fresh-DB guard), and TiposComprobanteBase (InicializadorDeBaseDeDatos.cs:63-76) gains a Clase field because :424 currently hardcodes Clase=ClaseComprobante.Venta. (orchestrator-resolved, autonomous mode)"
  - "DECISION 8 (the two deferred FKs land TOGETHER, in this stage's migration): movimientos_stock.id_comprobante_compra (doc-10:451, deferral note doc-10:457-465, MovimientoStockConfiguration.cs:48-50) and gastos.id_comprobante_compra (doc-10:416, deferral note doc-10:426-434, Gasto.cs:11-15) -- COLUMN + COMPOSITE FK EACH, the established pattern, ON DELETE RESTRICT, each with its supporting index. Both doc-10 notes name etapa 8 EXPLICITLY: this is scheduled debt being paid, not new design. The three doc-comments that announce the deferral (MotivoStock.cs:5-8, MovimientoStock.cs:16-18 and :39-43, Gasto.cs:11-15) must be updated in the same slice so the code stops lying. (orchestrator-resolved, autonomous mode)"
  - "DECISION 9 (sum-invariant discipline): EVERY new stock writer is append-only ledger + same-transaction cache upsert, in the shape of ServicioDeStock.AjustarAsync (:32-70 with the raw INSERT at :74-95 and the atomic INSERT...ON CONFLICT DO UPDATE...RETURNING upsert at :97-119, whose own row lock provides serialization). NO ENDPOINT ACCEPTS A CLIENT-SUPPLIED DELTA OR A STOCK QUANTITY TO STORE: the compra supplies quantities, the transfer supplies a quantity, the CONTEO SUPPLIES THE COUNTED TOTAL AND THE SERVER DERIVES THE DELTA UNDER THE STOCK ROW LOCK (design MUST pin the read-under-lock; the delta cannot be computed by the upsert alone). Rationale: this is what keeps the legacy D3 bug (doc-01:241 -- restore ADDED stock) and the D7 class UNREPRESENTABLE rather than merely fixed. EDGE CASE: a zero-difference conteo writes NO ledger row at all (ck_movimientos_stock_cantidad_no_cero forbids it, and a no-op should not pollute the ledger) -- same honest-no-op posture as stage 7's reliquidacion. (orchestrator-resolved, autonomous mode)"
  - "DECISION 10 (anulacion of a CONFIRMED compra): (a) the reversal writes motivo=anulacion contramovimientos (doc-10:449 already reserves anulacion for exactly this) and upserts the caches in the same transaction. (b) IT IS REFUSED WITH A 409 naming the offending articulos when the reversal would leave any stock NEGATIVE -- the goods already left, so pulling them back would make the ledger claim units that do not exist. The remedy (a conteo or an ajuste) is available to the SAME ROLE that can annul (decision 11), so the refusal never traps the operator. DELIBERATE ASYMMETRY: a SALE may drive stock negative; annulling a COMPRA may not (same principle as decision 5). (c) costo_nominal is NOT REVERTED: cost history has moved on and other prices may already derive from it; a wrong cost is fixed by editing the articulo. All three sub-rules need their own scenario. (orchestrator-resolved, autonomous mode)"
  - "DECISION 11 (authorization mirrors the closest existing precedent -- the manual stock writer): PRECEDENT VERIFIED IN CODE -- POST /api/stock/ajustes stacks Politicas.GestionDeCatalogo over the group's Politicas.OperacionDePos (StockEndpoints.cs:24-30), and since GestionDeCatalogo is Admin-ONLY (Politicas.cs:15, :68-70) that AND composition makes the only existing manual stock-write path ADMIN-ONLY (specs/stock/spec.md:50-56). DECISION: compra borrador/confirmar/anular, transferencias, conteos and the price-application action use THAT SAME STACKING; the compra list, compra detail and proveedor saldo READS stay on OperacionDePos; paying a compra is an ordinary gasto and keeps the gastos endpoint's existing OperacionDePos gate. REJECTED: inventing a new tier, or reusing SupervisionDeCuentaCorriente (Politicas.cs:57) -- that policy is named for BALANCE supervision, and stage 8 has no reason to be LOOSER than the existing manual stock writer it is replacing. A Supervisor tier can be added later with no schema change. CONSISTENCY NOTE: the stage-7 product flag (an OperacionDePos screen reachable only from an Admin-only nav entry) does NOT recur -- every stage-8 write screen is Admin-only, matching its nav. (orchestrator-resolved, autonomous mode)"
  - "CAPABILITIES CONTRACT for sdd-spec -- NEW: 'comprobantes-compra' (schema at rest, numero_externo identity + dedupe, the borrador->confirmada->anulada lifecycle, the confirm transaction [stock entry + costo_nominal overwrite + cache], precio_sugerido as a suggestion never auto-applied, anulacion by contramovimientos with the insufficient-stock refusal, authorization), 'transferencias-de-stock' (the atomic two-mirrored-movement shape, the sufficiency rule at origin, origen != destino, cross-tenant refusal, multi-item transfers, no in-transit state), 'conteo-de-inventario' (the counted quantity as input NEVER a delta, the server-derived delta under the row lock, required observaciones, the zero-difference no-op, and its distinction from ajuste), 'saldo-de-proveedor' (the derived read, per-compra payment status, explicit NON-invariant status, empty state, scoping). MODIFIED: 'stock' (the Purpose sentence at spec:8-10 reserving compra/transferencia/inventario is REMOVED; movimientos_stock gains id_comprobante_compra; the sum-invariant at spec:86-96 extends to the three new motivos AND to the two-sided transfer, asserted PER punto de venta), 'gastos' (the optional id_comprobante_compra link and its pairing with categoria=proveedor; the open-turno gate and importe>0 unchanged), 'arqueo-de-cierre' (CLARIFICATION ONLY: a proveedor gasto linked to a compra is an ordinary SUM(gastos.importe on that medio) term, spec:45-52 -- no new term, no new formula), 'proveedores' (a proveedor referenced by a comprobante_compra cannot be removed, FK Restrict; plus the derived saldo read entry point), 'operacion-de-pos' (the compra/transferencia/inventario write paths stack GestionDeCatalogo over OperacionDePos; the compra list and proveedor saldo reads stay on OperacionDePos). Existing specs in openspec/specs/: usuarios-tenant-scoping, usuarios-y-login, auxiliary-catalogs, parametros-operativos, clientes, proveedores, tenant-organization, articulos, codigos-barra, precios, listas-precio-minimal, ofertas, resolucion-de-ofertas, comprobantes-venta, stock, consumo-cuenta-corriente, operacion-de-pos, turnos-de-caja, movimientos-de-caja, arqueo-de-cierre, gastos, tesoreria, pagos-a-cuenta, reliquidacion-a-precio-del-dia, ajustes-de-cuenta-corriente, estado-de-cuenta."
  - "PURE DOMAIN FIRST (binding for design/tasks): the compra arithmetic ships as a DB-free Domain class -- cantidad = unidades + bultos x unidades_por_bulto (doc-01:206), descuento, IVA per alicuota, header totals at numeric(14,4) cost precision -- with exhaustive unit tests, mirroring CalculadorDeArqueo / ValidadorDePagos / ReliquidadorDeConsumos / PoliticaDeRoles. The margin suggestion is NOT rebuilt: SugeridorDePrecio.cs:39-55 already exists and is already pure. ONE arithmetic implementation shared by any preview and the commit -- NEVER two formulas (the stage-6 resumen=cierre and stage-7 preview==execute precedents)."
  - "GUARDED-PATH DISCIPLINE (binding for apply/verify): ServicioDeStock, ServicioDeVentas and CalculadorDeArqueo are the project's most-tested code. Stage 8 ADDS writers NEXT TO them; it MUST NOT edit the sale transaction at all. Three proofs are required, not assumed: (1) the arqueo derivation is byte-unchanged and a compra payment still flows through SUM(gastos.importe on that medio) with no new term; (2) every venta tipos_comprobante code still resolves to its VENTA row after the compra seed, on BOTH a fresh and a stage-7-migrated database; (3) the sum-invariant holds PER (articulo, punto_venta) over a mixed sequence of venta, ajuste, anulacion, compra, transferencia and inventario."
  - "GREENFIELD RISK (carried into spec): unlike stages 5-7 there is NO legacy behaviour to match -- doc-01:203-208 says the legacy compra screen NEVER PERSISTED. Every rule in this stage is a DECISION, not a port, so the spec discipline carries all the weight: each of the 11 decisions must become scenarios in BOTH directions (the allowed case and the refused case), or the implementation will silently invent its own semantics."
  - "OUT OF SCOPE, EXPLICIT: full-count inventory workflow (snapshot/freeze/session/variance) -- only the per-articulo conteo ships (decision 1); a real proveedores current account with its own ledger (decision 6, doc-10:409); ordenes de compra / pedidos a proveedor; recepcion parcial (a confirm receives the whole comprobante or nothing); notas de credito de proveedor / devoluciones a proveedor (anulacion is the only reversal); IVA credito fiscal, libro IVA compras and FE/AFIP integration (compra tipos are es_fiscal=false); automatic sale-price updates on confirm (decision 3); per-proveedor cost history (costo_nominal is a single current value, overwritten); bulk/CSV import of compras; multi-PV compras (one comprobante lands in exactly one punto de venta, doc-10:378); in-transit / two-step transfers with acceptance at destination (decision 5); reworking gastos, turnos_caja or the arqueo derivation."
  - "RISKS carried into design: (1) a compra codigo colliding with a venta code -- ux_tipos_comprobante_codigo is UNIQUE on codigo ALONE and ResolverTipoComprobanteAsync looks up by codigo alone (prefixed codes + a venta-resolution test); (2) the compra-tipo seed breaking the emptiness-guarded seeder on a FRESH database -- the exact stage-7 bug (dual path WITH the AND EXISTS guard + a fresh-database boot test); (3) the two-sided transfer breaking the sum-invariant (each row's id_punto_venta is the location it affects; the invariant test asserted PER punto de venta); (4) a partially-applied confirm (one transaction + EstrategiaSinReintento + fault-point tests at each step); (5) the same supplier invoice entered twice (the UNIQUE as a real constraint + db-error-backstops + a race test); (6) a compra anulada after the goods were sold driving stock negative (refused, decision 10b); (7) costo_nominal not reverted on anulacion (documented as deliberate, with a scenario); (8) touching ServicioDeStock regressing the ajuste or sale paths (new methods, not edits; full suite green as a slice gate); (9) greenfield scope creep -- a full WMS hiding behind 'inventario' (decision 1 pins the minimal conteo, trimmable as one slice); (10) reviewer overload, the largest stage since 5 (chained PRs stacked-to-main)."
  - "DELIVERY: chained PRs stacked-to-main per protocolo-pr-solo-dev, judgment-day before EVERY PR. Slicing hint for sdd-tasks (BY WRITE PATH): (1) schema + seed gate -- migration ComprasYTransferenciasEtapa8 (two tables, estado_compra enum registered in BOTH sites, the two deferred FK columns, the partial dedupe index, RLS, backstops) + the compra-tipo dual-path seed + the doc-10 SS1/SS5/SS6 notes IN THE SAME SLICE so the doc never drifts (stage-7 gate condition, reused); (2) compra borrador -- pure CalculadorDeCompra first, then the borrador CRUD + item editing + precio_sugerido; (3) CONFIRMAR + ANULAR, the centerpiece and the guarded path -- the one transaction (stock entry, costo_nominal, cache), the contramovimientos, the negative-stock refusal: ITS OWN FULL JUDGMENT-DAY ROUND with the entire stage-5/6/7 suite green; (4) transferencias + conteo de inventario -- both new ServicioDeStock writers + the extended sum-invariant test; (5) gasto<->compra link + proveedor saldo + web compras, including THE PROOF THAT THE ARQUEO DERIVATION IS BYTE-UNCHANGED; (6) web transferencias + conteo + proveedor saldo view (splittable). Review Workload Forecast discipline applies (exact guard lines: 'Decision needed before apply', 'Chained PRs recommended', '400-line budget risk') -- expect HIGH budget risk, this is the largest stage since 5."
  - "PROPOSAL QUESTION ROUND (autonomous mode -- NOT asked, recorded for the user's review before sdd-tasks): (1) Should stage 8 include inventario at all, or leave it for a stage 9? -> assumed INCLUDED, minimally (decision 1). (2) Should confirming a compra update sale prices automatically? -> assumed NO (decision 3). (3) Should a proveedor account be a real ledger like the client one? -> assumed NO (decision 6). (4) May annulling a compra drive stock negative? -> assumed NO (decision 10b). (5) Who operates the depot -- Admin only, or Supervisor too? -> assumed ADMIN ONLY (decision 11). Questions 1 and 5 are cheap to change, 3 and 4 are spec-level, and 2 is the only one that would change the confirm transaction."
