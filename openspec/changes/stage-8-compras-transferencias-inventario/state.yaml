ecks outside, FabricaDeEstrategiaSinReintento (:47), one explicit transaction, raw ledger INSERT (:74-95), atomic INSERT...ON CONFLICT DO UPDATE...RETURNING cache upsert (:97-119) -- and it takes NO turno, confirming decision 4. StockEndpoints.cs:24-30 shows POST /api/stock/ajustes stacking GestionDeCatalogo over the group's OperacionDePos; Politicas.cs:15+:68-70 shows GestionDeCatalogo is Admin-ONLY, so that stacked AND is effectively Admin-only -> decision 11. (g) SPEC HOOKS: openspec/specs/stock/spec.md:8-10 states the reserved-values sentence to be REMOVED, :34-35 states 'Availability is NOT checked -- negative stock is allowed (legacy parity)' (the source of the decision-5 correction), :50-56 pins the ajuste path as GestionDeCatalogo/Admin-only, :86-96 is the load-bearing sum-invariant. openspec/specs/arqueo-de-cierre/spec.md:45-52 derives per-medio esperado with 'SUM(gastos.importe on that medio)' -- CATEGORIA-AGNOSTIC, so a proveedor gasto linked to a compra already flows through with NO new term (decision 4, to be PROVEN not assumed). (h) REUSE FOUND (not in the brief): SugeridorDePrecio.cs:39-55 already implements the doc-10:403 margin suggestion as a PURE function (costo_nominal else costo_lista*(1-descuento_proveedor/100); grupos.margen takes precedence over proveedores.margen; rounds AwayFromZero to 2), and its own doc-comment already states 'La sugerencia NUNCA se aplica sola'; ServicioDePrecios.AbrirNuevoPrecioAsync (:80) is the existing price-with-history writer. Decision 3 reuses both instead of building anything."
