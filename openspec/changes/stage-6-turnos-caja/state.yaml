gate: "DB CHANGE GATE APPROVED by the user (2026-08-04, 'dale') with the presented defaults: cierre stays under OperacionDePos (decision 2, legacy parity — no Supervisor tightening), motivo NOT NULL >= 5 uniformized across all three tipo_movimiento_caja (design decision 8), gastos without the compra FK (decision 1), FOR SHARE checkout lock + close-first cierre order (design decision 1), vuelto on the cash anchor as a total (design decision 2), hard stop on non-unique efectivo medio (design decision 3), diferencia GENERATED ALWAYS. Migration TurnosCajaYGastosEtapa6 is authorized."
artifact_store: openspec
phases:
  explore:
    status: done
    artifact: none
    notes: "Exploration ran as a delegated read-only pass (writes no file; findings summarized here and in proposal.md). Findings: (a) docs/10-modelo-de-datos.md:459-504 (§7) fully specifies the caja model -- turnos_caja [operativa] (id_punto_venta, id_empleado_apertura, id_empleado_cierre NULL, fecha_apertura, fecha_cierre NULL, fondo_inicial numeric(14,2) NOT NULL DEFAULT 0, estado_turno enum abierto|cerrado, observaciones; 'Un solo turno abierto por punto de venta: UNIQUE (id_punto_venta) WHERE estado = abierto'; 'El comprobante nace con el id_turno_caja abierto: se acabo el cerrada = 0 implicito'), movimientos_caja (id_turno_caja, tipo_movimiento_caja enum retiro|refuerzo|apertura_cajon, importe numeric(14,2) -- 0 en apertura_cajon, el F12 del legacy, motivo, id_empleado, creado_el), arqueos_turno (ONE ROW PER MEDIO DE PAGO: id_turno_caja, id_medio_pago, importe_esperado 'calculado: pagos + fondo - vueltos - gastos - retiros', importe_declarado 'lo que el cajero conto', diferencia 'esperado - declarado, el saldo del legacy, por medio'), movimientos_tesoreria (ex cajaz: id_punto_venta, fecha, tipo_movimiento_tesoreria enum retiro_caja|deposito|gasto|ajuste, id_turno_caja NULL, concepto, inicio/ingreso/egreso/final encadenado, id_empleado). doc-10:488-492 is categorical: 'Cerrar caja deja de ser un INSERT de 30 columnas' -- los totales se DERIVAN de los comprobantes y gastos que apuntan al turno, 'no se copian a mano por POST manipulable como hoy (D7)'; el cierre calcula esperados, registra arqueos_turno con lo declarado, marca estado=cerrado y encadena tesoreria, TODO EN UNA TRANSACCION. (b) gastos vive en doc-10:404-414 (§5, junto a compras) pero la tabla de etapas (doc-10:596) lo pone en etapa 6 -- ambiguedad resuelta por decision 1. Forma exacta: id_gasto, fecha, id_punto_venta, id_turno_caja NULL, id_empleado, categoria_gasto enum (proveedor|sueldos|viaticos|impuestos|servicios|otros), id_proveedor NULL, id_comprobante_compra NULL, id_area NULL, concepto, detalle, id_medio_pago NOT NULL, numero_factura NULL, importe. doc-10:416-417: 'Los retiros de efectivo DEJAN DE SER GASTOS (tipo=95 era otro numero magico): van a movimientos_caja (§7)'. (c) LEGACY (docs/01-features-existentes.md seccion D, lineas 224-273): D1 listado de tickets de la caja abierta (cerrada=0); D2 anular BLOQUEADO si cerrada=1; D3 restaurar (bug, ya muerto por diseno en etapa 5); D4 reasignar cliente (no se reproduce); D5 retiro de efectivo = INSERT gasto tipo=95 area=1; D6 Ver Parcial = ingresos por area + por medio de pago (efectivo neto de vuelto, tarjetas, cuenta corriente, saldo, cantidad de tickets, primer y ultimo ticket) y egresos por area y por tipo (proveedores, otros, sueldos, viaticos, impuestos, retiros); D7 cierre en 3 pasos con INSERT cajas (30 columnas) + INSERT cajaz (inicio=final del ultimo cierre, ingreso=retiros, egreso=gTotal, final=inicio+ingreso-egreso) + UPDATE ventas SET cerrada=1 + UPDATE gastos SET cerrada=1, con DOS advertencias explicitas: todos los importes viajan por POST en inputs readonly manipulables desde el navegador, y NO hay transaccion (si falla el update de gastos la caja queda cerrada a medias). doc-01:157 F12 = modal Abrir Caja que pide motivo de minimo 5 caracteres. (d) HOOKS DE ETAPA 5 verificados en codigo: src/Ways.Application/Ventas/ServicioDeVentas.cs:459 tiene 'IdTurnoCaja = null' hardcodeado en el paso 2 (muere en esta etapa); la resolucion de punto de venta ocurre temprano en EmitirAsync (~linea 63), que es donde entra el fail-fast del turno; src/Ways.Domain/Ventas/ComprobanteVenta.cs:7-8 y :34-36 documentan la promesa ('siempre NULL en esta etapa ... stage 6 lo cierra'); ComprobanteVentaConfiguration.cs:48 mapea la columna sin FK; la migracion 20260804143427_VentasStockYCuentaCorrienteEtapa5.cs:60 ya creo id_turno_caja como integer NULL -- asi que esta etapa solo agrega la FK y empieza a poblarla. AnularAsync recibe el guard de turno cerrado. src/Ways.Application/Abstracciones/EstrategiaSinReintento.cs existe (compartida por ServicioDeVentas y ServicioDeStock desde el slice 5 de etapa 5) y encaja para apertura/cierre/retiro/refuerzo/gasto: operaciones manuales, raras, sin clave de idempotencia natural. (e) AUTORIZACION: src/Ways.Api/Seguridad/Politicas.cs:38,71-77 -- OperacionDePos admite Vendedor + Supervisor + Admin (Supervisor se sumo durante el slice 1 de etapa 5 por paridad con el legacy). Como la policy YA incluye Vendedor, endurecer el cierre a Supervisor+Admin requeriria una policy nueva: por eso es un flag de gate (decision 2), no un default silencioso. (f) MedioPago.Comportamiento existe (src/Ways.Domain/Catalogos/ComportamientoMedioPago.cs, enum nativo de Postgres comportamiento_medio_pago) y es lo que permite excluir cuenta_corriente del arqueo (decision 6). (g) FRONTEND GREENFIELD: no existe ninguna pantalla de caja en src/Ways.Web; hay que construir apertura, movimientos, resumen parcial y cierre con inputs de conteo por medio, mas el seam de gate en Pos.tsx (409 turno_no_abierto -> ofrecer abrir turno). Skills react-async-state + web-descriptor-tests obligatorias. (h) Bugs del legacy que NO se reproducen: totales de cierre editables por el cliente (D7), cierre sin transaccion (D7), retiro como gasto tipo=95 (D5), restaurar ticket (D3, ya muerto), reasignar cliente (D4)."
  propose:
    status: done
    artifact: proposal.md
  spec:
    status: done
    artifact: specs/
    notes: "5 new capability specs (turnos-de-caja, movimientos-de-caja, arqueo-de-cierre, gastos, tesoreria) + 2 deltas (comprobantes-venta, operacion-de-pos); 26 requirements / 65 scenarios. Pinned error codes: turno_ya_abierto, turno_no_abierto, turno_cerrado, movimiento_de_caja_sin_motivo, motivo_de_apertura_cajon_invalido. Decisions 2 and 9 specced as proposed but remain flagged for the gate."
  design:
    status: done
    artifact: design.md
    notes: "Centerpiece pinned: importe_esperado(m) = pagos(m) - gastos(m) + [m = ancla] * (fondo + refuerzos - retiros - vueltosTotales), over medios with Comportamiento != CuentaCorriente; the cash anchor is the tenant's UNIQUE Comportamiento=Efectivo medio (0 or 2+ -> 409 caja_sin_medio_efectivo_unico, raised by resumen too); vueltos subtract from the anchor as a TOTAL regardless of the pago's medio (AdmiteVuelto is editable per row, doc 10's literal per-medio formula would double-miscount). DECLARED DEVIATION flagged for the gate: cierre order inverted to UPDATE-turno-FIRST (exclusive lock before derivation reads) + SELECT ... FOR SHARE on the turno as the first statement of EmitirAsync's write transaction and of the anulacion path -- closes the race where a sale resolving the turno as open commits after the arqueo was derived (uncounted cash). Cost: checkout diff grows to ~30 lines (still its own full judgment-day round); lock order is total (turno always first) so no deadlock. Also flagged: motivo NOT NULL >= 5 uniformized across all three tipo_movimiento_caja (stricter than decision 9 for retiro/refuerzo); tesoreria egreso = all gastos (legacy parity). Fails closed on multi-cash-medio tenants until es_caja_fisica ships (deliberate)."
  tasks:
    status: done
    artifact: tasks.md
    notes: "7 slices by write path, chained PRs stacked-to-main: (1) schema gate [size:exception, ~1,100-1,500 lines], (2) turno lifecycle, (3) gastos, (4) derivation+cierre [centerpiece, ~1,400-1,900 lines], (5) checkout wiring [surgical, own full judgment-day], (6) web apertura/movimientos/resumen, (7) web cierre + Pos.tsx seam. Review Workload Forecast: ~5,200-7,500 total lines, 400-line budget risk High, chained PRs Yes, decision needed before apply No (auto-chain cached). Orchestrator resolved the spec/design conflict on the repeated-cierre code: arqueo-de-cierre spec corrected to 409 turno_ya_cerrado (design's distinction wins: exists-but-closed != no-turno; the concurrent-cierre loser gets turno_ya_cerrado)."
  apply:
    status: in_progress
    notes: "Slice 1 (schema gate) MERGED in PR #52 (2026-08-04, main 17a33e4): migration TurnosCajaYGastosEtapa6 (5 tables + 4 enums + ux_turnos_caja_abierto + comprobantes_venta FK/index + RLS same-migration), entity skeletons, EF configs, 2 unicidad branches + ClasificarCheckDeCaja, 28 new tests (20 RLS + 8 backstop). Suites: 271/209/421. Judgment-day round 1 clean, both judges CLEAN. Slice 2 (turno lifecycle) MERGED in PR #53 (main 0d368db): ReglaDeTurnos + ReglaDeMovimientosDeCaja (pure), ServicioDeTurnos (AbrirAsync plain INSERT behind the partial unique, shared ResolverTurnoAbiertoAsync, RegistrarMovimientoAsync), CajaEndpoints (5 routes, OperacionDePos), gate-seam JSON-null fix (Ok(null)/Json(null) emit empty body — explicit Results.Content branch). Suites 291/209/440. Judgment-day: round 1 found the read-prefix auth-guard blind spot (fixed with mutation evidence), missing cross-tenant tests (added), and the PLAN gap — design requires FOR SHARE on all four turno-writing paths but tasks only scheduled venta/anulacion; movimientos+gastos guard added as tasks 4.17/4.18. Round 2 clean (test-only iteration, orchestrator-verified). Slice 3 (gastos) MERGED in PR #54 (main 46fac1b): ServicioDeGastos (shared resolver reuse, importe pre-check sharing the CHECK backstop code, server-side fecha/empleado/turno), GastosEndpoints, whitelist test kills tipo=95. Suites 292/209/450. Judgment-day round 1: no majors, 3 test-only minors fixed (enum whitelist, FK referencia_invalida backstops, negative 403); round 2 clean. Slice 4 (derivation + cierre, the centerpiece) MERGED in PR #55 (main 8bb2817): CalculadorDeArqueo + ResolvedorDeMedioDeCajaFisica (pure, formula matches design verbatim, NCX signed), 6-step close-first transaction (exclusive UPDATE first, tesoreria chained), FOR SHARE guards wired into movimientos+gastos (tasks 4.17/4.18), resumen=cierre identity byte-proven, atomicity via privilege-revocation fault injection. Suites 306/209/476. Judgment-day FULL rigor: round 1 — both judges independently re-derived the formula (match); 2 MAJORs fixed (conteo_duplicado 400 instead of 500 crash; anulados-excluded scenario had NO test + misleading comment — added with mutation evidence) + 3 minors (observaciones persisted with append, conteo_invalido for negatives, resumen cross-tenant 404); round 2 — judge A CLEAN, judge B 1 minor (negative-esperado pin lost) restored inline. Clean close. Slice 6 (web caja: apertura/movimientos/resumen) MERGED in PR #56 (main 812b92b): api/caja.ts pure mirrors of ReglaDeMovimientosDeCaja, Caja.tsx with full react-async-state compliance, 24 new vitest (189 total). Judgment-day: 1 MAJOR fixed with mutation evidence (generation-orphan — failed movimiento left cargandoResumen stuck; unconditional refetch after try/catch) + dead prop removed + selector-disabled tests; 409 apertura self-heal deferred to slice 7 (task 7.8). DOCUMENTED GAP for verify: the merged resumen contract (slice 4) returns only per-medio esperado + ancla — design/proposal promised D6-rich content (areas, tickets, primer/ultimo ticket, egresos por categoria); the screen renders the real contract honestly. Slice 5 (checkout wiring, surgical) MERGED in PR #57 (main a1845ee): 58/3 production diff in ServicioDeVentas — early turno resolution (404 before 409, pricing untouched, query count pinned at 3), frozen plan.IdTurnoCaja, FOR SHARE re-check of THE SPECIFIC turno as first write statement (TOCTOU closed; ambiguous-commit race → gapped numero + 409, recovery path correctly skips the guard), AnularAsync closed-turno guard in-transaction (NULL-turno stage-5 rows bit-identical anulable). 4 stage-5 fixture files turno-seeded only; budget 16→17 honestly accounted. Suites 306/209/481. DEDICATED judgment-day round: BOTH judges CLEAN in round 1. Remaining: slice 7 (web cierre + Pos.tsx gate seam + 409 self-heal task 7.8)."
