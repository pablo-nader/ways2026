notes:
  - "Scope binding: the question round for this change was RESOLVED IN AUTO MODE (2026-08-04) using legacy defaults plus the exploration's recommendations. The 11 decisions below are binding for spec/design/tasks unless the user corrects them at the DB CHANGE GATE. TWO of them (2 and 9) are deliberate tightenings/parity choices FLAGGED for explicit user decision at the gate."
  - "DECISION 1 (gastos staging): gastos SHIPS IN STAGE 6, WITHOUT the id_comprobante_compra column. Resolves doc 10's ambiguity (the table is documented in §5 alongside compras but the stage table at doc-10:596 assigns it to etapa 6). The compra FK follows the deferred-FK pattern already established for movimientos_stock.id_comprobante_compra (doc-10:440-448 note): stage 8 adds column AND FK together, in the same migration that creates comprobantes_compra. Rationale: an int NULL without an FK is a reference without a guarantee; and without gastos, legacy D6's 'egresos por tipo' cannot be reproduced. Exact shape per doc-10:404-414 minus that column: id_gasto, fecha, id_punto_venta, id_turno_caja, id_empleado, categoria_gasto (proveedor|sueldos|viaticos|impuestos|servicios|otros), id_proveedor NULL, id_area NULL, concepto, detalle, id_medio_pago NOT NULL, numero_factura NULL, importe."
  - "DECISION 2 (roles -- FLAGGED AT GATE): apertura AND cierre both sit under Politicas.OperacionDePos (Vendedor + Supervisor + Admin, as shipped in stage 5). Provenance: legacy PARITY -- the legacy has NO role gate on caja at all. Rationale: D7's real bug is client-submitted totals, which server-side derivation fixes regardless of who clicks the button. FLAG: tightening cierre to Supervisor + Admin is a one-line flip (a new policy constant); it is PRESENTED to the user at the gate, not assumed."
  - "DECISION 3 (fondo_inicial): NOT NULL DEFAULT 0, and the field IS exposed at apertura (parity-plus). The legacy has no explicit fondo; exposing it is a small safe improvement that makes the cash expectation honest instead of implicit."
  - "DECISION 4 (tesoreria): the cierre AUTO-WRITES EXACTLY ONE movimientos_tesoreria row in the SAME transaction (parity with the legacy cajaz chain: inicio = final del ultimo cierre, ingreso = retiros, egreso = gastos, final = inicio + ingreso - egreso). Manual deposito/ajuste/gasto tesoreria entries and any tesoreria UI/reporting are DEFERRED -- no slice this stage."
  - "DECISION 5 (anulacion gate -- NEW RULE, legacy D2 parity): ServicioDeVentas.AnularAsync REJECTS when the comprobante's turno is 'cerrado' (the legacy's cerrada=1 block, preserved). Comprobantes with id_turno_caja NULL (stage-5 era) REMAIN ANULABLE -- the guard only fires when a turno exists and is closed."
  - "DECISION 6 (arqueo rows): arqueos_turno gets a row ONLY for medios with nonzero activity in the turno (legacy D6 parity -- the summary lists what moved). Medios whose Comportamiento is cuenta_corriente are EXCLUDED FROM THE ARQUEO ENTIRELY: there is nothing physical to count and the legacy never counts it. CC income appears in the cierre summary, not as a countable arqueo row."
  - "DECISION 7 (apertura race): partial unique index ux_turnos_caja_abierto (id_punto_venta) WHERE estado = 'abierto' + a PLAIN INSERT; 23505 maps to a domain 409 turno_ya_abierto per db-error-backstops. No advisory lock, no read-then-insert window. Rendezvous race test required in the same work unit as the constraint."
  - "DECISION 8 (backfill): NONE for stage-5 comprobantes with id_turno_caja NULL (pre-production, confirmed by the user). They stay NULL forever and are excluded from every turno derivation."
  - "DECISION 9 (motivo -- FLAGGED AT GATE): motivo is REQUIRED for retiro and refuerzo -- a DELIBERATE TIGHTENING over the legacy, on the grounds that money moving physically deserves a recorded reason. For apertura_cajon the rule mirrors legacy F12 (doc-01:157: modal Abrir Caja pide motivo de minimo 5 caracteres) rather than inventing a new one."
  - "DECISION 10 (checkout wiring): EmitirAsync resolves the open turno for the punto de venta EARLY -- fail-fast 409 turno_no_abierto BEFORE any pricing/oferta-resolution work -- carries IdTurnoCaja in the FROZEN PlanDeVenta, and populates the column at insert time (killing the IdTurnoCaja = null hardcode at ServicioDeVentas.cs:459). gastos writes also require an open turno, for symmetry. This is the smallest possible diff on the project's most-guarded transaction and it gets its OWN full judgment-day round."
  - "DECISION 11 (Caja Virtual): arqueos_recargas / arqueos_recargas_canales are OUT of this stage -- doc 10 §7 keeps them as a separate concern (cajaV of doc 03)."
  - "CIERRE DERIVATION (binding at proposal level, design pins the exact per-medio formula): importe_esperado is computed SERVER-SIDE from ledger rows that point at the turno ONLY -- pagos_comprobante of comprobantes with estado='emitido', their vuelto, gastos, movimientos_caja and turnos_caja.fondo_inicial. The client sends ONLY the declared counts; there must be NO request shape in which a total or an expected amount can be supplied. This is the structural answer to legacy bug D7 (importes en inputs readonly manipulables). Design must resolve the CASH ASYMMETRY: fondo_inicial, refuerzos, retiros and vuelto are physical cash and only affect the efectivo medio, while card/CC medios only accumulate pagos. The SAME derivation feeds both the resumen parcial (legacy D6) and the cierre -- never two formulas."
  - "TRANSACTION SHAPE: the cierre is ONE transaction -- derive expected per medio, insert arqueos_turno with the declared counts, set estado=cerrado + fecha_cierre + id_empleado_cierre, chain one movimientos_tesoreria row -- or nothing. A failed cierre must leave the turno OPEN with no arqueo and no tesoreria row (fault-point integration test per step). Posture inherited from stage 5: decide-then-commit, NO advisory locks, EstrategiaSinReintento (src/Ways.Application/Abstracciones) for apertura/cierre/retiro/refuerzo/gasto -- manual, rare operations with no natural idempotency key."
  - "PURE DOMAIN FIRST: the per-medio expected calculation and the arqueo/diferencia arithmetic ship as DB-free Domain classes with exhaustive unit tests, mirroring ValidadorDePagos / ResolvedorDePrecios / PoliticaDeRoles."
  - "NO SERVER-SIDE POS SESSION (stage-5 decision 3 preserved): every request carries idPuntoVenta explicitly and the server resolves the open turno per request. The turno id is NEVER client-supplied."
  - "Capabilities contract for sdd-spec -- NEW: 'turnos-de-caja' (apertura/cierre lifecycle, one-open-per-PV invariant, fondo_inicial, estado transitions, closed-turno effects on sales and anulacion), 'movimientos-de-caja' (retiro/refuerzo/apertura_cajon, motivo rules, importe 0 for apertura_cajon, membership in an open turno), 'arqueo-de-cierre' (the server-side per-medio expected derivation, declared counts, diferencia, which medios get a row, cierre atomicity and irreversibility), 'gastos' (expense capture against an open turno, categorias, medio de pago, proveedor/area optional links, effect on the arqueo), 'tesoreria' (the chained inicio->final ledger and the automatic retiro_caja row written at cierre). MODIFIED: 'comprobantes-venta' (id_turno_caja stops being NULL -- resolved server-side from the open turno and REQUIRED for new sales; anulacion rejected when the turno is closed; historical NULL-turno comprobantes stay anulable), 'operacion-de-pos' (checkout gains a fail-fast open-turno precondition returning 409 turno_no_abierto; the caja surface -- apertura, cierre, movimientos, gastos, resumen -- lives under the same policy). Existing specs in openspec/specs/: usuarios-tenant-scoping, usuarios-y-login, auxiliary-catalogs, parametros-operativos, clientes, proveedores, tenant-organization, articulos, codigos-barra, precios, listas-precio-minimal, ofertas, resolucion-de-ofertas, comprobantes-venta, stock, consumo-cuenta-corriente, operacion-de-pos."
  - "Out of scope, explicit: manual tesoreria operations (deposito/gasto/ajuste entered by hand) and tesoreria UI/reporting -- only the automatic retiro_caja chain at cierre ships (decision 4); Caja Virtual arqueos_recargas / arqueos_recargas_canales (decision 11); gastos.id_comprobante_compra (stage 8, decision 1); cuenta corriente management, reliquidacion a precio del dia (F4) and pagos de cuenta (stage 7); comprobantes de compra, transferencias entre locales, inventario (stage 8); reapertura de turno and edicion de un arqueo (a close is irreversible BY DESIGN -- legacy D7's warning becomes a real invariant); backfill of stage-5 NULL-turno comprobantes (decision 8); cash-drawer hardware and physical printing of the Z report (the endpoint returns the data); reasignar cliente de un ticket (legacy D4, not reproduced)."
  - "DB CHANGE GATE (CLAUDE.md), BLOCKING before any EF Core migration is generated during apply: 5 new tables (turnos_caja, movimientos_caja, arqueos_turno, movimientos_tesoreria, gastos) + 4 new enums (estado_turno, tipo_movimiento_caja, tipo_movimiento_tesoreria, categoria_gasto) + the partial unique index ux_turnos_caja_abierto + the comprobantes_venta.id_turno_caja FK (the column already exists, nullable, from the stage-5 migration) + RLS policies for operativa scoping. The gate summary MUST group BY WRITE PATH, not by table, and MUST surface: (a) decision 2 (cierre role -- offer the Supervisor+Admin tightening), (b) decision 9 (motivo required for retiro/refuerzo), (c) decision 1 (gastos ships without the compra FK, deferred to stage 8). Migration name follows the project convention: TurnosCajaYGastosEtapa6."
  - "db-error-backstops compliance planned per constraint from the start (23505/23503/23514 mappings + race tests in the same work unit as each constraint). New surfaces this stage: the partial unique index on turnos_caja (23505 -> 409 turno_ya_abierto), the FKs into puntos_venta/usuarios/medios_pago/proveedores/areas/turnos_caja, the comprobantes_venta.id_turno_caja FK, and any CHECK on importe. Watch the stage-5 backstop trap: branch ordering matters when a new constraint name contains a substring already matched by an earlier branch."
  - "Web slice obligations: the caja screens are GREENFIELD (no caja UI exists in src/Ways.Web) -- apertura, movimientos (retiro/refuerzo/apertura de cajon), resumen parcial and cierre with per-medio count inputs, plus the Pos.tsx gate seam that turns a 409 turno_no_abierto into an offer to open the turno instead of a raw error. Must ship react-async-state compliant (9 hard rules, notably rule 9: block supersede-during-write) with descriptor/component tests per web-descriptor-tests. Both skills must be injected into the apply/judgment-day prompts. Expect this to be the LARGEST slice of the stage and to be splittable."
  - "Delivery: chained PRs, stacked-to-main per protocolo-pr-solo-dev and the stage-3/4/5 precedent, with judgment-day before EVERY PR. THE CHECKOUT-WIRING SLICE NEEDS FULL JUDGMENT RIGOR: it modifies ServicioDeVentas.EmitirAsync/AnularAsync, the most-guarded transaction in the project, so its diff gets a dedicated judgment-day round and the entire stage-5 integration suite must stay green except for the new turno precondition. Proposal flags for sdd-tasks to slice BY WRITE PATH: (1) schema gate -- 5 tables + 4 enums + partial unique index + FK + RLS + EF configs + backstops (size:exception candidate); (2) turno lifecycle -- apertura (with the 23505 race test) + cierre skeleton + movimientos_caja; (3) gastos write path (small, independent once the schema lands); (4) derivation + cierre -- pure CalculadorDeArqueo + resumen parcial + the one cierre transaction (the centerpiece); (5) checkout wiring -- deliberately SMALL AND SURGICAL, its own slice, its own full judgment-day round; (6) web caja screens + Pos.tsx gate seam. Review Workload Forecast discipline applies (exact guard lines required: 'Decision needed before apply', 'Chained PRs recommended', '400-line budget risk')."
  - "Dependencies: stage 5 (merged and archived) -- comprobantes_venta/items/pagos_comprobante, movimientos_stock, movimientos_cuenta_corriente, ServicioDeVentas (EmitirAsync/AnularAsync), EstrategiaSinReintento, Politicas.OperacionDePos (Vendedor+Supervisor+Admin), MedioPago with Comportamiento/AdmiteVuelto/RequiereReferencia, seeded areas and proveedores, ServicioDeParametros. DB Change Gate approval is BLOCKING before the migration."
  - "Rollback: fully additive. Five new tables, four new enums, two new Domain namespaces (Caja, Gastos), new endpoints and new web routes -- all droppable without touching stage 1-5 data. The only non-additive edges revert cleanly: comprobantes_venta.id_turno_caja ALREADY EXISTS and is nullable (shipped NULL in stage 5, migration 20260804143427), so stage 6 only adds the FK and starts populating it -- dropping the FK returns the column to its dormant state and stage-5 rows are untouched; EmitirAsync gains a precondition and one assignment (reverting restores stage-5 behaviour exactly, no data repair); AnularAsync gains a guard (reverting only removes a restriction). No backfill runs (decision 8), so there is no row migration to undo."
  - "Carryover watch: still OPEN and unrelated to this stage -- (a) the ServicioDeArticulos articulos_empresas replace-set concurrency gap (spawned during stage-4 slice 2), (b) RESOLVED 2026-08-04: ck_pagos_comprobante_importe_no_negativo shipped in PR #51 (gate-approved follow-up, clean judgment-day round)."
  - "Engram availability during propose (2026-08-04): if mem_save succeeded, the mirror lives at topic_key sdd/stage-6-turnos-caja/proposal; openspec files remain the single source of truth for this change either way (stage-4/5 precedent)."
