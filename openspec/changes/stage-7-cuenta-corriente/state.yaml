    status: done
    artifact: proposal.md
    notes: "Written 2026-08-05 in autonomous mode. 11 binding decisions, all orchestrator-resolved, each with provenance + rationale. ONE VERIFIED CORRECTION to the incoming brief is recorded in decision 3: the brief said reliquidacion must EXCLUDE oferta-discounted lines; doc-01:398 says verbatim 'Las lineas de oferta se revierten (el descuento se anula)' -- offer lines are NOT excluded, they are re-priced at the FULL current price with the discount ANNULLED, which makes their delta LARGER. The spec pins the doc-01 wording verbatim. Capabilities contract: 4 new (pagos-a-cuenta, reliquidacion-a-precio-del-dia, ajustes-de-cuenta-corriente, estado-de-cuenta) + 4 modified (consumo-cuenta-corriente, comprobantes-venta, arqueo-de-cierre, operacion-de-pos)."
