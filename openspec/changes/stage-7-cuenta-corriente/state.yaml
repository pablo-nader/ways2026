    notes: "No separate exploration pass. The orchestrator supplied a pre-resolved brief with verified code hooks and doc references; propose re-verified every one of them against source before writing. Verified during propose: (a) doc-10:607 stages 'Cuenta corriente + reliquidacion a precio del dia' as etapa 7, unlocking 'Paridad total con el legacy'. (b) doc-10:516-536 (SS8) fully specifies movimientos_cuenta_corriente -- the table ALREADY EXISTS since stage 5 (id_movimiento, id_cliente, fecha, id_punto_venta, id_empleado, tipo tipo_movimiento_cc enum consumo|pago|ajuste|actualizacion_precios, id_comprobante_venta NULL, id_pago_comprobante NULL, importe with sign, saldo_resultante, detalle) and doc-10:534-536 pins reliquidacion: 'recorre los consumos no actualizados, consulta precios vigentes y graba UN movimiento actualizacion_precios con el detalle -- igual efecto de negocio que hoy, pero auditable'. (c) doc-10:138-153 (SS2) clientes already carries saldo (cache) + limite_credito + credito_ilimitado + id_lista_precio -- ALL LIVE since stage 2/3; nothing to add. (d) doc-10:80-93 (SS1) tipos_comprobante is a GLOBAL table (platform-maintained, read-only for the tenant) whose codigo list does NOT include a recibo code; the seed list lives at InicializadorDeBaseDeDatos.cs:61-73 (FA/FB/FC/NCA/NCB/NCC/NDA/TX/NCX/PRE) and the seeding is guarded by an emptiness check at :417 -- THE KEY GATE FINDING. (e) doc-01:373-407 (F4) is the whole screen: header with saldo/acuerdo/disponibilidad (acuerdo - saldo), movements of the last month by default with desde/hasta filter and 'Ver Historico', running balance computed BACKWARDS from the current saldo, the 5 legacy tipos (1 venta, 2 devolucion, 3 PAGO A CUENTA, 4 ACTUALIZACION DE PRECIOS, 5 ajuste manual showing obs), and 3 actions: ingresar pago (modal efectivo+tarjetas, creates a venta tipo=3 with c_corriente negative), ajuste personalizado (tipo=5 with detail in obs), actualizar precios. WARNING doc-01:377: 'echo $listaCliente;