notes:
  - "AUTONOMOUS MODE (binding for every downstream phase): the user delegated ALL decisions for this change to the orchestrator, INCLUDING the DB CHANGE GATE. Gate approvals are exercised by the orchestrator with STRICT doc-10 conformity; the gate step is still performed (model summary + recorded evaluation) but does not block waiting for the user. EVERY decision is logged -- in proposal.md's decision ledger and in these notes -- for the user's final summary. Decision 5 (the authorization tightening) is the one deliberate departure from legacy parity and MUST appear in that summary."
  - "DECISION 1 (pago a cuenta = real comprobante, tipo RC): a pago a cuenta is a comprobante_venta of a NEW tipo RC -- clase venta, es_fiscal=false, afecta_stock=false, discrimina_iva=false, letra NULL, signo=+1 (money comes IN; the negative sign lives in the CC movement, not in the comprobante total). It flows through the EXISTING ServicioDeVentas comprobante + pagos_comprobante machinery with PHYSICAL (non-CC) pagos rows and writes ONE negative Pago movement in the SAME transaction. Provenance: legacy F4 already creates a venta of tipo=3 (doc-01:391-392); doc-10:349 moves tipo 3/4/5 out of ventas into movimientos_cuenta_corriente but keeps the money in pagos_comprobante. Rationale: it inherits stage 6's turno guard and arqueo derivation FOR FREE -- the physical cash lands in the cierre count through the existing pagos(m) join -- whereas a bare ledger INSERT would silently reproduce the legacy's cash-invisibility gap and violate the one-derivation principle. CONSEQUENCES TO SPEC: a pago a cuenta REQUIRES an open turno (409 turno_no_abierto, same fail-fast as a sale); its efectivo/tarjeta means are counted in the arqueo with NO new derivation term; NCX-style anulacion symmetry applies. (orchestrator-resolved, autonomous mode)"
  - "DECISION 2 (no imputacion): NO FIFO, no invoice-level allocation. A pago is ONE signed movement against the running saldo with saldo_resultante snapshotted per row. Provenance: legacy parity -- cuenta-corriente.php subtracts from the balance and never allocates; doc 10 SS8 has no allocation table. Rationale: allocation is a different product (partial payments, over-payment, re-allocation) and is overbuild against a parity mandate. (orchestrator-resolved, autonomous mode)"
  - "DECISION 3 (reliquidacion, THE CENTERPIECE): batched. Walks the client's not-yet-reliquidated Consumo movements, re-prices each underlying comprobante's items against the client's CURRENT id_lista_precio through the existing listas_precio/precios machinery (doc 10 already generalized the legacy's precio/precioEmp binary -- doc-10:216-229), ANNULS the oferta discount on offer lines, writes ONE ActualizacionPrecios movement with an auditable per-line detail, marks the consumos as reliquidated and updates saldo ATOMICALLY. VERIFIED CORRECTION TO THE BRIEF: doc-01:398 reads 'Las lineas de oferta se revierten (el descuento se anula)' -- offer lines are NOT EXCLUDED from the re-pricing; they are re-priced at the FULL current price with the discount annulled (a LARGER delta). The spec pins that wording verbatim with a scenario in each direction. OPEN FOR DESIGN: the 'already reliquidated' marker -- a column on movimientos_cuenta_corriente (e.g. id_movimiento_reliquidacion integer NULL self-FK, which also gives per-consumo traceability) vs. a derivable form. If a column is needed it goes through the gate: PRE-APPROVED by the orchestrator, conditional on being additive + nullable + indexed for the eligibility scan + RLS-covered + backstopped. (orchestrator-resolved, autonomous mode)"
  - "DECISION 4 (ajuste manual): the legacy's tipo=5 becomes a FIRST-CLASS action -- a signed Ajuste movement with a REQUIRED detalle -- not just anulacion plumbing. Provenance: doc-01:388,393 (the legacy shows obs on screen). Rationale: stage 5 already writes Ajuste-SHAPED rows as anulacion contramovimientos, so the spec MUST distinguish the two so the ledger stays readable. (orchestrator-resolved, autonomous mode)"
  - "DECISION 5 (AUTHORIZATION -- THE ONE DELIBERATE DEPARTURE FROM PARITY, FLAG IN THE FINAL SUMMARY): pago a cuenta and estado de cuenta reads sit under Politicas.OperacionDePos (Vendedor + Supervisor + Admin -- legacy parity, the cashier takes payments all day). RELIQUIDACION AND AJUSTE MANUAL SIT UNDER A NEW Supervisor + Admin POLICY. Provenance: the legacy has NO role gate at all. Rationale: both mutate balances IN BULK or AT DISCRETION and are irreversible in practice -- a different risk class from taking a payment. (orchestrator-resolved, autonomous mode)"
  - "DECISION 6 (no interest): NO interest, recargos or punitorios on CC balances. Provenance: the legacy has none. Rationale: reliquidacion IS this business's inflation mechanism (doc-01:401-402); adding interest on top would double-charge. (orchestrator-resolved, autonomous mode)"
  - "DECISION 7 (anulacion symmetry, with one exception): anulando an RC comprobante REVERSES its Pago movement (stage 6's turno-cerrado gate applies unchanged, as shipped). RELIQUIDACION MOVEMENTS ARE NOT ANULABLE -- irreversible by design, like the cierre; the correction path is a compensating Ajuste. Provenance: doc-10:353-356 (anular never edits, it counter-moves) + stage 6's irreversible-close precedent. CODE HOOK: ServicioDeVentas.cs:413-414 filters Tipo == Consumo in the contramovimiento loop and must learn about Pago; InsertarMovimientoCcAsync (:830-855) must accept a NULL id_pago_comprobante for the Pago movement. (orchestrator-resolved, autonomous mode)"
  - "DECISION 8 (web): estado de cuenta screen -- header saldo/acuerdo/disponibilidad (acuerdo - saldo, 'ilimitado' when credito_ilimitado), movement list with RUNNING BALANCE and desde/hasta + historico filters, per legacy F4 -- plus the three actions gated per decision 5. The legacy's echo $listaCliente; debug leak (doc-01:377) is NOT reproduced. react-async-state compliant with web-descriptor-tests coverage. (orchestrator-resolved, autonomous mode)"
  - "DECISION 9 (overpayment): an overpayment is ACCEPTED and produces a SALDO A FAVOR (negative saldo). It is not rejected and it does not force a vuelto. Vuelto on an RC, if the cashier gives change, follows the existing parameterized rules (vuelto_maximo) through the same ValidadorDePagos. Provenance: the legacy simply subtracts from the balance; nothing rejects an overpayment. (orchestrator-resolved, autonomous mode)"
  - "DECISION 10 (payment validation): the CREDIT-LIMIT rules do NOT apply to a payment -- ValidadorDePagos rule 6 (:134-139) guards consumo, not repayment; rule 5 (:126-132, CF cannot use cuenta corriente) becomes, for RC, 'the Consumidor Final row has no account to pay'. RC FORBIDS cuenta_corriente medios ENTIRELY -- a debt cannot pay a debt. (orchestrator-resolved, autonomous mode)"
  - "DECISION 11 (numeracion): RC gets its OWN numeracion series through the existing (IdPuntoVenta, TipoComprobante-codigo) counter (NumeracionComprobante.cs:21-31) -- no new mechanism, no shared series with TX. (orchestrator-resolved, autonomous mode)"
  - "DB CHANGE GATE MODEL (presented and recorded, grouped BY WRITE PATH): (a) PAGO A CUENTA -- no new table; ONE new row in the GLOBAL tipos_comprobante (RC, clase venta, letra NULL, signo +1, discrimina_iva false, es_fiscal false, afecta_stock false). CRITICAL: InicializadorDeBaseDeDatos.cs:417 seeds tipos_comprobante ONLY WHEN THE TABLE IS EMPTY, so a stage-6 database would NEVER receive RC from a seed-list edit -- the row MUST ship as an idempotent INSERT ... WHERE NOT EXISTS inside the migration, with the seed list updated too for fresh databases, and a test proving RC resolves on a migrated DB. (b) RELIQUIDACION -- the reliquidated marker (design's choice; pre-approved if additive+nullable+indexed+RLS-covered+backstopped). (c) AJUSTE / ESTADO DE CUENTA -- NO schema change: movimientos_cuenta_corriente already has tipo, importe, saldo_resultante and detalle (doc-10:519-528). (d) CONFORMITY -- strict doc-10 SS8 shape, NO new enum values (pago and actualizacion_precios already exist in tipo_movimiento_cc), operativa scoping and RLS unchanged. Migration name: CuentaCorrienteEtapa7. EVALUATION: APPROVED by the orchestrator under the autonomous mandate, conditional on (a) and (b) above."
  - "CAPABILITIES CONTRACT for sdd-spec -- NEW: 'pagos-a-cuenta' (the RC comprobante shape: itemless, non-stock, non-fiscal; forbidden medios; the open-turno requirement; overpayment/saldo a favor; the single negative Pago movement; anulacion symmetry), 'reliquidacion-a-precio-del-dia' (eligible consumos, the re-pricing rule -- current id_lista_precio with oferta discounts ANNULLED -- the single ActualizacionPrecios movement, the reliquidated marker, atomicity, irreversibility, the no-op case), 'ajustes-de-cuenta-corriente' (the signed manual Ajuste with required detalle, authorization, and its distinction from the anulacion contramovimiento), 'estado-de-cuenta' (the read model: header saldo/acuerdo/disponibilidad, running balance, date filtering, tenant + cliente scoping, empty state). MODIFIED: 'consumo-cuenta-corriente' (the requirement 'No Reliquidacion, No CC Management, No Pagos De Cuenta' at spec line 85 is REMOVED; Pago and ActualizacionPrecios gain write paths; the anulacion contramovimiento rule extends to Pago rows; the saldo-cache invariant now covers four movement types), 'comprobantes-venta' (RC joins the POS-emittable tipos with its own numeracion series; an RC comprobante carries ZERO items), 'arqueo-de-cierre' (clarifies that RC pagos are ordinary pagos(m) in the per-medio derivation -- no new formula, no new term), 'operacion-de-pos' (pago a cuenta + estado de cuenta reads under OperacionDePos; reliquidacion + ajuste manual under the new Supervisor + Admin policy). Existing specs in openspec/specs/: usuarios-tenant-scoping, usuarios-y-login, auxiliary-catalogs, parametros-operativos, clientes, proveedores, tenant-organization, articulos, codigos-barra, precios, listas-precio-minimal, ofertas, resolucion-de-ofertas, comprobantes-venta, stock, consumo-cuenta-corriente, operacion-de-pos, turnos-de-caja, movimientos-de-caja, arqueo-de-cierre, gastos, tesoreria."
  - "PURE DOMAIN FIRST (binding for design/tasks): the re-pricing arithmetic ships as a DB-free Domain class -- input (items sold at their historical prices, current prices for the client's lista, oferta flags), output (per-line delta + aggregate) -- with exhaustive unit tests, mirroring CalculadorDeArqueo / ValidadorDePagos / ResolvedorDePrecios / PoliticaDeRoles. ONE re-pricing implementation shared by any preview and the commit -- NEVER two formulas (the stage-6 resumen=cierre identity precedent)."
  - "TRANSACTION AND LOCK ORDER (design MUST pin): reliquidacion and a concurrent sale for the SAME cliente both mutate clientes.saldo. The lock order must stay TOTAL and deadlock-free, analogous to stage 6's turno-first FOR SHARE discipline: turno first, then the cliente row. The reliquidated marker MUST be set in the SAME transaction as the ActualizacionPrecios movement and the saldo update. Posture inherited from stages 5-6: decide-then-commit, EstrategiaSinReintento for manual rare operations, raw UPDATE clientes SET saldo = saldo + $1 ... RETURNING saldo (never a tracked cliente.Saldo +=, which would double-apply on a retry)."
  - "OUT OF SCOPE, EXPLICIT: imputacion FIFO / invoice-level allocation (decision 2); PER-CLIENT PRICING AT CHECKOUT -- doc-01:473-476 rule 4 is categorical that the lista distinction exists ONLY inside reliquidacion and the POS always charges the counter price, so ResolvedorDePrecios at checkout is NOT touched; interest/recargos/punitorios (decision 6); cuenta corriente de PROVEEDORES (stage 8); reversing a reliquidacion (decision 7 -- compensating Ajuste is the path); editing clientes.saldo by hand (the legacy's editable saldo, doc-01:365, stays refused); recargo por medio de pago (still dormant); the D6 resumen-parcial enrichment (stage-6 verify WARNING -- running as a SEPARATE follow-up PR, not part of this change); comprobantes de compra, transferencias, inventario (stage 8); fiscal receipts / FE (RC is explicitly non-fiscal, like TX/NCX)."
  - "RISKS carried into design: (1) reliquidacion x venta race on the same cliente -- pinned lock order + rendezvous race test; (2) wrong re-pricing arithmetic charging an inflated debt (irreversible trust incident) -- pure Domain + one shared formula + per-line audit detail; (3) misreading the oferta semantics (excluding lines instead of annulling the discount) -- doc-01:398 pinned verbatim, a scenario per direction; (4) RC with ZERO items breaking stage-5 invariants (item-count checks, totals, the stock loop) -- own integration tests, stock loop is a no-op by construction; (5) the RC seed missing on already-migrated databases (the emptiness-guarded seed) -- idempotent insert + a test on a migrated DB; (6) a second reliquidacion double-charging the same consumos -- the marker is the invariant, a no-op run writes NO movement; (7) overpayment semantics confusing the cashier -- decision 9 surfaced as an explicit 'saldo a favor' state; (8) reviewer overload -- chained PRs stacked-to-main."
  - "DELIVERY: chained PRs stacked-to-main per protocolo-pr-solo-dev, judgment-day before EVERY PR. Slicing hint for sdd-tasks (BY WRITE PATH): (1) schema + seed gate -- RC idempotent insert + reliquidated marker + EF config + RLS + backstops + migration CuentaCorrienteEtapa7; (2) pago a cuenta write path -- the RC branch in ServicioDeVentas (itemless comprobante, forbidden medios, the negative Pago movement) + the AnularAsync extension, which touches the project's MOST-GUARDED transaction and therefore gets ITS OWN FULL JUDGMENT-DAY ROUND with the entire stage-5/6 integration suite staying green; (3) reliquidacion engine (THE CENTERPIECE) -- pure Domain re-pricer FIRST, then the one transaction; (4) ajuste manual + estado de cuenta API + the new Supervisor+Admin policy; (5) web estado de cuenta screen + the three action modals (splittable). Review Workload Forecast discipline applies (exact guard lines: 'Decision needed before apply', 'Chained PRs recommended', '400-line budget risk')."
  - "CARRYOVER WATCH (open, unrelated to this stage): the ServicioDeArticulos articulos_empresas replace-set concurrency gap, spawned during stage-4 slice 2."
  - "Engram availability during propose (2026-08-05): if mem_save succeeded, the mirror lives at topic_key sdd/stage-7-cuenta-corriente/proposal; the openspec files remain the SINGLE SOURCE OF TRUTH for this change either way (stage-4/5/6 precedent)."
