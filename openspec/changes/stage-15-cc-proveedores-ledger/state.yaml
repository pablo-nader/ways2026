db_gate_approval: >-
  APROBADO 2026-08-17 por el orquestador bajo mandato autonomo delegado:
  gate EJERCIDO FORMALMENTE sobre la seccion 'Modelo de datos propuesto'
  del proposal (lineas 485-746), que es EL CONTRATO — cualquier DDL de
  sdd-apply fuera de esa seccion es violacion de alcance y reabre el gate.
  ALCANCE APROBADO: UNA migracion (CuentaCorrienteDeProveedoresEtapa15),
  la PRIMERA NO-ADITIVA del programa: UN enum nuevo
  tipo_movimiento_cc_proveedor (4 valores apertura|compra|pago|ajuste,
  cada uno con escritor, orden de declaracion = orden C# via MapEnum),
  UNA tabla nueva movimientos_cuenta_corriente_proveedor (12 columnas,
  pk integer GENERATED BY DEFAULT, 6 FKs, 1 CHECK ck_..._apertura que
  ata la nulabilidad de id_punto_venta/id_empleado EXACTAMENTE al tipo
  apertura, 6 indices nombrados, RLS estandar HabilitarRlsDeTenant sin
  desvio, SIN AK — decision fundada: la AK del ledger de clientes existe
  solo para el self-FK de reliquidacion, fuera de alcance), DOS ALTER
  (proveedores + saldo numeric(14,2) NOT NULL DEFAULT 0 metadata-only;
  gastos + ak_gastos_id_gasto_id_tenant, +1 indice implicito — total 7
  indices nuevos), DOS data statements idempotentes (backfill de asiento
  de apertura con guard NOT EXISTS, precedente seeds de la 12, y UPDATE
  del cache derivado DE ESA MISMA FILA), CERO ALTER TYPE (nada
  irreversible), ManejadorDeErrores NO se toca.
  VERIFICACION INDEPENDIENTE DEL ORQUESTADOR previa a la aprobacion:
  (1) AK de proveedores (Id,IdTenant) existe — ProveedorConfiguration.cs:151;
  (2) AK de comprobantes_compra existe — ComprobanteCompraConfiguration.cs:49;
  (3) GastoConfiguration.cs NO declara HasAlternateKey — el ALTER de §D
  es real, no asumido; estructuralmente inviolable (id_gasto ya unico por
  pk_gastos) ⇒ sin familia 23505 nueva, exencion correcta por la skill;
  (4) Gasto.IdProveedor existe (int?, Gasto.cs:32) y el predicado del
  backfill calca ServicioDeSaldoDeProveedor.cs:31,40 (Confirmada +
  Categoria==Proveedor + IdProveedor==id), con deleted_at IS NULL
  explicito porque el SQL crudo no hereda el filtro BajaLogica;
  (5) el mapeo generico fk_/23503 → referencia_invalida esta en
  ManejadorDeErrores.cs:224 (Seguridad/, no Middleware/ — corregida la
  ruta del proposal §E al aprobar).
  NOTA ACEPTADA: el backfill estampa fecha con now() de PG — en contexto
  de migracion no hay IRelojDelSistema; bases frescas de test no escriben
  filas (padron vacio), asi que RelojFijo no se ve afectado. Orden interno
  de la migracion es contrato: TYPE → TABLE → FKs/indices → backfill →
  ALTER proveedores+UPDATE → RLS AL FINAL (la correccion no depende del
  carryover de ways_owner superusuario).
  CRITERIO DE VERIFY VINCULANTE: exactamente UNA migracion nueva llamada
  CuentaCorrienteDeProveedoresEtapa15; has-pending-model-changes limpio
  post-apply; prueba de FIDELIDAD del backfill contra la formula retirada
  del spec saldo-de-proveedor (mismo dataset ⇒ mismo saldo, con
  soft-deletes y gastos sin id_proveedor como casos discriminantes);
  conteo final de indices = 7 o el gate se reabre con enmienda.
