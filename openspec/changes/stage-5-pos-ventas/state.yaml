change: stage-5-pos-ventas
phase: propose
status: in_progress
artifact_store: openspec
phases:
  explore:
    status: done
    artifact: none
    notes: "Exploration ran as a delegated read-only pass (writes no file; findings summarized here and in proposal.md). Findings: (a) docs/10-modelo-de-datos.md:297-356 (§4) fully specifies comprobantes_venta (operativa scope: id_tenant + id_punto_venta per doc 09; UNIQUE (id_punto_venta, id_tipo_comprobante, numero); estado_comprobante enum emitido|anulado; id_turno_caja NULL-able; id_comprobante_asociado NULL for NC/ND), items_comprobante_venta (SNAPSHOT principle -- descripcion, codigo_barra, id_area, precio_unitario, id_lista_precio, id_oferta, descuento, id_alicuota_iva + porcentaje_iva copies so a reprint never re-joins the live catalog; id_articulo NULL only for free-concept lines; orden), pagos_comprobante (id_medio_pago, importe, referencia NULL, vuelto DEFAULT 0). doc-10:419-442 (§6) specifies stock (PK id_articulo,id_punto_venta; cantidad as CACHE of the ledger; minimo/reposicion NULL) and movimientos_stock (signed cantidad; motivo_stock enum venta|compra|anulacion|ajuste|transferencia|inventario -- stage 5 implements venta/anulacion/ajuste only; id_punto_venta_destino reserved for stage-8 transfers). doc-10:491-511 (§8) specifies movimientos_cuenta_corriente (tipo_movimiento_cc enum consumo|pago|ajuste|actualizacion_precios; saldo_resultante; 'el pago con medio cuenta_corriente genera el movimiento consumo EN LA MISMA TRANSACCION'). numeraciones_comprobante is doc-09's per-(punto_venta, tipo_comprobante) atomic counter and is NOT yet in code -- clone AsignadorDeNumeroCliente's raw-ADO UPDATE...RETURNING pattern. (b) doc-10:571-586 stage table: stage 5 = 'Comprobantes de venta + pagos + stock + movimientos' -> 'Vender (paridad nucleo)'; stage 6 = turnos/arqueos/tesoreria/gastos; stage 7 = cuenta corriente + reliquidacion; stage 8 = compras + transferencias. (c) LEGACY checkout (docs/01-features-existentes.md B6, lines 113-144): rejection order 1 no payment / 2 tolerancia (hardcoded $10) / 3 vuelto maximo (hardcoded $20) / 4 no vuelto if tarjetas / 5 no vuelto if cuenta corriente / 6 credit limit; then per-line UPDATE articulos SET existencia = existencia - n WHERE barra = ... WITHOUT TRANSACTION and without availability check (explicit doc-01 warning), INSERT ventas tipo=1|2, UPDATE usuarios SET saldo = saldo + c_corriente, number NNNN-NNNNNNNN. Rules 4/5 generalize to MedioPago.AdmiteVuelto. doc-01:484 confirms the hardcoded tolerancia $10 / vuelto $20 defaults, ALREADY SEEDED as ParametroConocido.ToleranciaPago / VueltoMaximo (src/Ways.Domain/Catalogos/ParametroConocido.cs:17-21, defaults '10'/'20') -- resolved via ServicioDeParametros (punto_venta > empresa > default), NEVER hardcode. (d) AUTHORIZATION FINDING (broader than the stage-4 carryover): every read the POS needs is admin-only today -- ClientesEndpoints.cs:12, ArticulosEndpoints, CatalogosEndpoints.cs:23, ParametrosEndpoints.cs:12 and the WHOLE /api/ofertas group (OfertasEndpoints.cs:12) sit on Politicas.GestionDeCatalogo, which is Admin-ONLY (src/Ways.Api/Seguridad/Politicas.cs:39-41). RolConocido.Vendedor exists and is referenced by no policy. So stage 5 must open a POS read surface, not just /resolver. (e) CLIENTE MODEL CORRECTION vs the legacy: src/Ways.Domain/Clientes/Cliente.cs:56-62 has LimiteCredito (decimal) + CreditoIlimitado (bool) + Saldo (decimal), NOT the legacy 'acuerdo' with its -1 sentinel; Saldo's doc-comment explicitly says no CC engine exists yet (etapa 7) and it never moves in the current stages -- stage 5 changes that and the comment must be updated. openspec/specs/clientes/spec.md:17-18 pins the same statement at spec level, so 'clientes' is a MODIFIED capability. (f) MedioPago already carries Comportamiento + AdmiteVuelto + RequiereReferencia + RecargoPorcentaje (nullable); PlantillaDeAprovisionamiento.cs:23-38 seeds medios WITHOUT recargo, and doc-01 B6 has NO recargo step -> recargo left dormant (decision 11). (g) Concurrency precedent: advisory locks proven in ServicioDePrecios / ServicioDeOfertas (pg_advisory_xact_lock), this time needed INSIDE the larger sale transaction -- highest blast radius yet. (h) Legacy bugs NOT to reproduce (doc-01 warnings): unlocked stock UPDATE by barra, restaurar-ticket stock inflation, session ticket slots, hardcoded tolerances, caja totals trusted from the client (stage 6)."
  propose:
    status: done
    artifact: proposal.md
  spec:
    status: done
    artifact: specs/
    domains:
      - comprobantes-venta (new, 9 req / 24 scenarios; numeracion + pagos folded in)
      - stock (new, 6 req / 12 scenarios)
      - consumo-cuenta-corriente (new, 6 req / 8 scenarios)
      - operacion-de-pos (new, 4 req / 10 scenarios)
      - codigos-barra, clientes, articulos, parametros-operativos, resolucion-de-ofertas (deltas)
  design:
    status: done
    artifact: design.md
    notes: "12 decisions. KEY DEVIATION for the gate: NO advisory locks in checkout (decide-then-commit, atomic UPDATE...RETURNING, pinned statement order numeracion -> stock asc id_articulo -> cliente). Auth mechanism: group gate becomes OperacionDePos, catalog writes stack GestionDeCatalogo (AND composition) -- two shipped Vendedor-403 tests must invert. Backstop trap caught: ux_comprobantes_venta_numero contains _numero, new branch must precede the cliente family branch. 3 enums (estado_comprobante, motivo_stock, tipo_movimiento_cc). movimientos_stock.id_comprobante_compra FK deferred to stage 8 (table missing). Two migrations under one gate approval (400-line budget)."
  tasks:
    status: done
    artifact: tasks.md
    notes: "7 slices, ~4,900-6,800 lines forecast, chained stacked-to-main. S1 (auth) || S2 (numeracion+escaneo, first migration); S3 (6-table schema gate, size:exception candidate) -> S4 (checkout, the big one) sequential bottlenecks; S5 (anulacion+ajuste) || S7 (web payment); S6 (web cart+scan) after S1+S2. Two migrations under ONE gate approval presented together. Distinct backstop codes pinned to avoid vuelto_invalido collision. No anulacion UI this stage (API-only)."
  apply:
    status: done
    notes: "Slice 1 (OperacionDePos + POS read surface) COMPLETE, merged via PR #38. JD: R1 CRITICAL (catalogos-fiscales ungated, triple doc/code disagreement) + Supervisor added by orchestrator decision (legacy parity tipoUser 2,3,4) + Root-403/401 tests; R2 CRITICAL (shipped React front still routed Root into the now-403 fiscales page -> permanent error; front gates narrowed to Admin) — both judges converged, front fix orchestrator-verified inline. Fail-closed guards: non-GET stacking allowlist + GET OperacionDePos coverage over the 7 re-gated prefixes. Suite: 162/207/281 + 57 vitest. Slice 2 (numeraciones_comprobante + AsignadorDeNumeroComprobante + ParserDeEscaneo + ServicioDeEscaneo) COMPLETE, merged via PR #40. JD: R1 clean of code CRITICALs; A real WARNING = merge order (S1 must land first) resolved structurally, interim Admin-gated escaneo test inverted at rebase; suggestions closed (comment placement, dead c.Activo dropped, cross-tenant scan test). HONEST GAP-SEMANTICS NOTE FOR SLICE 4: a clean pre-commit rollback of the allocator REUSES the number (proven by failing-then-fixed test); the spec's rolled-back-sale-leaves-a-gap scenario only holds via execution-strategy retry mechanics at the SALE transaction layer — slice 4's atomicity tests must target that mechanism, not a plain rollback. Suite: 188/207/296. Slice 3 (schema gate: comprobantes_venta/items/pagos + stock/movimientos_stock + movimientos_cuenta_corriente, 3 enums, 4 pure Domain rule classes) and Slice 4 (checkout write path: ServicioDeVentas.EmitirAsync, decide-then-commit, POST /api/ventas + GET reprint/listado) COMPLETE, merged (PR #44) alongside Slice 6 (web cart+scan, PR #46). Slice 5 (anulación + ajuste manual de stock) COMPLETE on branch feat/stage5-slice5-anulacion (not yet merged/PR'd by this apply pass): ServicioDeVentas.AnularAsync (one transaction, atomic UPDATE...WHERE estado='emitido' RETURNING for the race-safe double-anulación guard, inverse movimientos_stock/movimientos_cuenta_corriente rebuilt from the ORIGINAL ledger rows of the comprobante — never recomputed from items — so EsProducto=false lines auto-exclude with no extra check) + POST /api/ventas/{id}/anulacion (OperacionDePos, allowlisted in SuperficieDeAutorizacionTests, RawText corrected to the {id:int} constraint form); new dedicated ServicioDeStock.AjustarAsync (motivo=ajuste, one transaction, non-empty observaciones + non-zero cantidad required) + POST /api/stock/ajustes (OperacionDePos ∧ GestionDeCatalogo) + GET /api/stock (OperacionDePos, badge balance, lazy-zero). No new migration/constraint this slice — CHECK/FK backstops from Slice 3 already cover the ajuste write path. Suite: 271/207/385 (+15 integration: 9 anulación incl. one atomicity-fault-point test + one 3-round concurrency race, 6 ajuste incl. the spec's mixed venta/ajuste/anulación invariant sequence). Slice 7 (web: payment panel + checkout wiring + ticket) implemented on branch feat/stage5-slice7-pos-pago, front-end only, NOT yet PR'd/merged/judgment-day'd: added src/Ways.Web/src/api/pagos.ts (pure vuelto/rejection-order math mirroring ValidadorDePagos, 43 vitest tests), completed Pos.tsx (payment panel with per-medio rows, CC hidden for Consumidor Final, referencia when required, vuelto sugerido/editable only on AdmiteVuelto medios, POST /api/ventas wired via clienteDeVentas.emitir, full react-async-state rule-9 discipline — first-line cobrandoRef re-entrancy guard + full-window disabled while the POST is outstanding — and a ticket view with 'nueva venta' reset), extended tipos.ts with ComprobanteEmitido/ItemEmitido/PagoEmitido confirmed against the real Contratos.cs. Pos.test.tsx grew to 30 component tests (CC gating, vuelto-disabled-without-AdmiteVuelto, double-click-one-POST, inert-during-cobro, legible server rejection). Full front suite 156/156 vitest green, tsc -b/oxlint/vite build clean. Deviation from design's rule 6 wording: POST /api/ventas' 201 body already IS the full ComprobanteEmitido, so there is no separate post-write ticket fetch to guard — the ticket renders straight from the checkout response. Slice 5 (anulación + ajuste manual de stock) runs in parallel on a separate branch; no backend files (Ways.Api/Application/Domain/Infrastructure, tests/Ways.*) were touched by Slice 7. Remaining before this change can verify/archive: Slice 5 + Slice 7 both need judgment-day and PR/merge. --- FINAL: Slice 5 merged via PR #48 (JD 2 rounds: R1 CRITICAL ajuste double-apply under ambiguous-commit retry -> shared EstrategiaSinReintento no-retry posture for ajuste+anulacion, EF reference pre-checks closing raw-ADO 500s, NCX-anulacion + CC fault-point + decimals tests; R2 dedup to Abstracciones + anti-regression test). Slice 7 judged over FOUR rounds (R1 2 CRITICALs: Cobrar clickable in the resolver window, duplicate-medio Map collapse misattributing vuelto; R2 availability-contract reconciliation per design decision 3 — failed preview allows checkout, server authoritative, Reintentar action, dedicated generacionCobroRef; R3 failed-preview math against synthetic total 0 suppressed + precios purge on catch; R4 A CLEAN with proofs, B test-only gap closed with mutation evidence). Final front suite: 165/165 vitest."
  verify:
    status: not_started
  archive:
    status: not_started
dependencies:
  spec: [propose]
  design: [propose]
  tasks: [spec, design]
  apply: [tasks]
  verify: [apply]
  archive: [verify]
notes:
  - "Scope binding: the question round for this change was RESOLVED IN AUTO MODE (2026-08-04). Legacy defaults were adopted and are documented as assumptions the user reviews at the DB CHANGE GATE. The 10 decisions below (plus decision 11, added during propose) are binding for spec/design/tasks unless the user corrects them at the gate."
  - "DECISION 1 (turno de caja): sales ship WITHOUT a turno. comprobantes_venta.id_turno_caja is written NULL; turnos_caja is stage 6, which will add the open-turno requirement. This is a DEVIATION from the legacy (which hard-requires an open caja), forced by staging and documented as such. The column is nullable in doc 10, so stage 6 only tightens a rule -- no schema change needed later."
  - "DECISION 2 (authorization): new policy Politicas.OperacionDePos admitting Vendedor + Admin. POST /api/ofertas/resolver is relaxed from GestionDeCatalogo to it, closing the stage-4 verify carryover. Exploration widened this: the ENTIRE POS read surface is admin-only today (clientes, articulos, codigos-barra, listas-precio, parametros, catalogos fiscales/medios de pago), so all POS-required READ paths move to the new policy while every ABM/write path stays on GestionDeCatalogo."
  - "DECISION 3 (punto de venta actual): NO server-side session state. The POS client selects the punto de venta and passes idPuntoVenta explicitly on every request, matching ServicioDeParametros' existing parameter pattern and ADR-10's explicit-parameter posture. The legacy's session-bound local is deliberately not rebuilt."
  - "DECISION 4 (employee <-> punto de venta assignment): DEFERRED. Any tenant user holding the POS policy may operate any punto de venta of the tenant; the asignaciones_empleado table is NOT built in stage 5. Documented assumption -- revisit when a multi-local tenant needs restriction."
  - "DECISION 5 (cuenta corriente as payment): YES, first-class at checkout (legacy parity). This pulls a NARROW slice of stage 7 forward: movimientos_cuenta_corriente is created now with WRITE-ONLY paths -- 'consumo' inside the sale transaction, 'contramovimiento' on anulacion -- plus the credit-limit check. TERMINOLOGY CORRECTION to the launch brief: the model uses Cliente.LimiteCredito + Cliente.CreditoIlimitado (bool), NOT the legacy 'acuerdo' with a -1 sentinel; Consumidor Final is excluded from CC. Cliente.Saldo (already in the schema, dormant since stage 2) becomes the maintained cache the check reads, updated in the SAME transaction, with saldo_resultante snapshotted per movimiento -- the same cache-of-the-ledger shape doc 10 gives stock.cantidad. Design confirms cache-vs-aggregation. NO reliquidacion, NO CC management UI, NO pagos de cuenta (stage 7)."
  - "DECISION 6 (anulacion): in scope -- estado=anulado + inverse movimientos_stock + CC contramovimiento, all in ONE transaction. NO restaurar endpoint, EVER: doc 10 §4 kills the legacy 'restaurar suma stock' bug by design (stock only moves through movimientos, and movimientos are never edited)."
  - "DECISION 7 (stock policy): negative stock is ALLOWED (legacy parity -- no availability guard at checkout), plus a minimal ADMIN-ONLY manual 'ajuste' path (motivo=ajuste) so stock can be loaded before compras (stage 8) exist. Rationale: blocking sales on a balance nobody has loaded would make the POS unusable on day one. Revisitable later as a parameter, not a schema change."
  - "DECISION 8 (tipos emitidos): the POS reaches only TX (venta) and NCX (devolucion). The comprobante-letter resolution rule (condicion fiscal cross) ships as a PURE, fully-tested Domain class but stays DORMANT until fiscal invoicing; tipos_comprobante.es_fiscal stays false. AFIP/CAE is out of scope."
  - "DECISION 9 (devoluciones): formalized as NCX comprobantes through the SAME checkout flow with negative lines, per doc 10 §4 (tipos_comprobante with signo replaces the legacy tipo 1/2 flag). Not a special-cased boolean."
  - "DECISION 10 (id_comprobante_asociado): OPTIONAL for NCX (legacy parity allows standalone returns) but MUST be populated when the return references an original comprobante."
  - "DECISION 11 (recargo por medio de pago -- ADDED during propose, needs user confirmation at the gate): medios_pago.recargo_porcentaje exists (doc-10:118 'p.ej. credito +10%') but is NOT applied in stage 5. Evidence: doc-01 B6 has no recargo step and PlantillaDeAprovisionamiento seeds medios with the column NULL. Rationale: applying it would make the comprobante total depend on the payment mix -- totals changing after the lines are closed is a real modelling decision, not a parity detail. Column stays dormant."
  - "Out of scope, explicit: turnos de caja / arqueos / movimientos de caja / tesoreria / gastos (stage 6, incl. the legacy declared-vs-calculated vuelto difference stored in ventas.saldo); cuenta corriente management, reliquidacion a precio del dia (F4), pagos de cuenta and CC UI/reporting (stage 7, except the narrow write path of decision 5); comprobantes de compra, transferencias entre locales, inventario (stage 8); AFIP/CAE/fiscal invoicing (deferred, es_fiscal dormant); comanda printing, tickets en espera (slots) and restaurar (deliberately not reproduced); asignaciones_empleado (decision 4); recargo por medio de pago (decision 11); legacy historical sales migration (doc 10 places the ETL in this stage -- the ENGINE ships here, the ETL does not)."
  - "Capabilities contract for sdd-spec -- NEW: 'comprobantes-venta' (TX/NCX emission, snapshot items, totals, estado lifecycle, anulacion with contramovimientos, devoluciones), 'numeracion-de-comprobantes' (atomic per-(punto_venta, tipo_comprobante) correlativo, PPPP-NNNNNNNN, gap/duplicate behaviour under concurrency), 'pagos-de-comprobante' (multi-medio capture + full rejection-order ruleset: tolerancia, vuelto maximo, AdmiteVuelto, RequiereReferencia, CC limit, Consumidor Final exclusion), 'stock' (per-punto-de-venta balance as ledger cache, signed movimientos with motivo, negative stock allowed, manual ajuste), 'consumo-cuenta-corriente' (narrow CC write path + credit-limit evaluation + saldo_resultante), 'operacion-de-pos' (POS authorization tier, explicit idPuntoVenta per request, scan resolution rules, cart pricing integration, checkout orchestration contract). MODIFIED: 'clientes' (saldo no longer frozen -- spec.md:17-18 must change; limite_credito/credito_ilimitado enforced at checkout; cliente READ paths open to the POS policy, ABM unchanged), 'resolucion-de-ofertas' (/resolver authorization relaxed to OperacionDePos; resolution semantics UNCHANGED), 'codigos-barra' (scan-resolution rule becomes specified behaviour: input < 7 digits -> codigo_interno, >= 7 -> codigos_barra, activos only, '<cantidad>*<codigo>' syntax, re-scan sums quantity; POS read access), 'articulos' (POS read access, no ABM change), 'parametros-operativos' (tolerancia_pago / vuelto_maximo become CONSUMED and server-authoritative at checkout; read access for UI preview). Existing specs in openspec/specs/: usuarios-tenant-scoping, usuarios-y-login, auxiliary-catalogs, parametros-operativos, clientes, proveedores, tenant-organization, articulos, codigos-barra, precios, listas-precio-minimal, ofertas, resolucion-de-ofertas."
  - "PRICING PATH (binding, doc-01 rule I.4): exactly ONE path -- cliente.IdListaPrecio -> ServicioDeOfertas.ResolverAsync (batch, POST /api/ofertas/resolver). NO per-client dual-price legacy hack. Applied ofertas land as items_comprobante_venta.id_oferta + descuento; NO phantom 'OF...' lines (doc-10 §4 change table). ServicioDeOfertas / ServicioDePrecios are CONSUMED UNCHANGED by this stage."
  - "TRANSACTION SHAPE (binding at proposal level, design pins the statements): checkout is ONE transaction writing comprobante + items + pagos + movimientos_stock + stock cache + numero + (if CC used) movimiento_cuenta_corriente, or nothing. Stock decrement takes an advisory lock (pg_advisory_xact_lock, the pattern proven in ServicioDePrecios/ServicioDeOfertas) INSIDE that transaction. A FIXED, documented lock order (numeracion -> stock por articulo ascendente -> cliente) is required to avoid deadlocks; design pins it and tests enforce it. Numeracion clones AsignadorDeNumeroCliente's raw-ADO UPDATE...RETURNING atomic counter; no client-supplied numbers, ever. Gaps in numbering are ACCEPTED (TX/NCX are non-fiscal), duplicates are rejected by the UNIQUE index + backstop."
  - "PURE DOMAIN FIRST: payment validation (rejection order, tolerancia, vuelto, CC limit), line/total arithmetic, the scan-resolution parser and the comprobante-letter rule all live as DB-free Domain classes with exhaustive unit tests, mirroring ResolvedorDePrecios / ResolvedorDeOfertas / PoliticaDeRoles."
  - "DB CHANGE GATE (CLAUDE.md) -- THE LARGEST OF THE PROJECT, blocking before any EF Core migration is generated during apply: ~7 new tables (comprobantes_venta, items_comprobante_venta, pagos_comprobante, stock, movimientos_stock, numeraciones_comprobante, movimientos_cuenta_corriente) + 2 enums (estado_comprobante, motivo_stock) + RLS policies for the project's first OPERATIVA-scoped entities (id_tenant + id_punto_venta, doc 09). The gate summary MUST group BY WRITE PATH, not by table, and MUST call out (a) the cross-stage cuenta-corriente pull, (b) the id_turno_caja NULL deviation from the legacy, (c) decision 11 (recargo dormant) for user confirmation."
  - "db-error-backstops compliance planned per constraint from the start (23505/23503/23514 mappings + race tests in the same work unit as each constraint). New surfaces this stage: UNIQUE (id_punto_venta, id_tipo_comprobante, numero) on comprobantes_venta, the stock composite PK, the numeraciones PK, and the FKs into clientes/articulos/puntos_venta/tipos_comprobante/medios_pago."
  - "Web slice obligations: the POS screen must ship react-async-state compliant (9 hard rules, notably rule 9: block supersede-during-write) with descriptor/component tests per web-descriptor-tests -- Ways.Web has vitest + RTL infra since PR #28. Both skills must be injected into the apply/judgment-day prompts."
  - "Delivery: chained PRs, stacked-to-main per protocolo-pr-solo-dev and the stage-3/4 precedent, with judgment-day before EVERY PR. Proposal flags for sdd-tasks to slice BY WRITE PATH and to expect the LARGEST SLICE COUNT of the project so far: (1) foundational -- OperacionDePos policy + POS read-surface re-gating + numeraciones_comprobante (schema + atomic allocator + race tests); (2) schema gate -- remaining 6 tables + 2 enums + RLS + EF configs + backstops (the size:exception candidate); (3) checkout -- pure Domain rules + ServicioDeVentas transaction + endpoint, with devoluciones FOLDED IN as NCX rather than a separate slice; (4) anulacion + manual stock ajuste (inverse-movement paths); (5) POS screen in Ways.Web (likely splittable into cart and payment/ticket). Review Workload Forecast discipline applies (exact guard lines required: 'Decision needed before apply', 'Chained PRs recommended', '400-line budget risk')."
  - "Dependencies: stages 1-4 (merged and archived) -- organizacion + puntos de venta, clientes (incl. Consumidor Final protegido, LimiteCredito/CreditoIlimitado), articulos + codigos de barra, listas y precios con historia, ServicioDeOfertas.ResolverAsync (batch, query budget proven constant), ServicioDeParametros with tolerancia_pago/vuelto_maximo seeded, TipoComprobante TX/NCX and MedioPago (AdmiteVuelto/RequiereReferencia) seeded, condiciones_fiscales seeded, RolConocido.Vendedor (unreferenced until now). DB Change Gate approval is BLOCKING before the migration."
  - "Rollback: fully additive. Seven new tables, two new enums, new Domain namespaces (Ventas, Stock, CuentaCorriente), new endpoints and a new POS route -- all droppable without touching stage 1-4 flows. Changes to already-shipped code are narrow and additive in effect: Politicas.cs ADDS a policy (existing policies keep their claim sets); POS read paths are RELAXED (no admin loses access, so reverting only re-tightens); Cliente.Saldo moves only when a sale uses cuenta corriente, and with the stage reverted no code path writes it. ServicioDeOfertas/ServicioDePrecios are consumed unchanged. One additive migration; reverting it (plus any doc-10 edit) restores stage 4 exactly."
  - "Carryover consumed from stage 4: the /resolver policy (Admin-gated, flagged in the stage-4 verify report as non-blocking carryover for stage 5) is resolved by decision 2. Still OPEN and unrelated to this stage: the ServicioDeArticulos articulos_empresas replace-set concurrency gap recorded as a spawned follow-up during stage-4 slice 2."
  - "Engram availability during propose (2026-08-04): if mem_save succeeded, the mirror lives at topic_key sdd/stage-5-pos-ventas/proposal; openspec files remain the single source of truth for this change either way (stage-4 precedent)."
