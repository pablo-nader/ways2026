[package]
name = "ways-desktop"
version = "0.1.0"
description = "Ways POS - aplicacion de escritorio para cajas"
authors = ["Ways"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ways_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dynamic-acl"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_Security",
] }

[features]
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
