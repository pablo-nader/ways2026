# Solo la base, para desarrollar con `dotnet watch` y `npm run dev` en el host.
#   docker compose -f compose.dev.yml up -d
#   dotnet run --project src/Ways.Api
#   npm --prefix src/Ways.Web run dev
services:
  postgres:
    image: postgres:17-alpine
    container_name: ways-pg-dev
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ways
      POSTGRES_USER: ways
      POSTGRES_PASSWORD: ways
    volumes:
      - ways-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ways -d ways']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ways-pgdata-dev:
