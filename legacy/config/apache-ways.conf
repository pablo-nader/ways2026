# Configuración de Apache para el sistema legacy.

ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# El hosting viejo servía la carpeta entera. Acá se cierra todo lo que no sea la aplicación.
<FilesMatch "\.(sql|md|ini|log|sh|bak|old|dump)$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# EasyPanel termina TLS en su proxy: sin esto, todos los accesos quedan registrados con la
# IP del proxy en lugar de la del cajero.
RemoteIPHeader X-Forwarded-For
