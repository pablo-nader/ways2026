; Configuración de PHP para el sistema legacy en Docker.
; Reproduce lo que asumía el hosting viejo; no agrega nada nuevo.

; El legacy sólo llama a date_default_timezone_set() en index.php. Los tickets, los cierres
; de caja y las ofertas por hora se emiten desde otros archivos: sin esto, el contenedor
; corre en UTC y las ventas quedan tres horas adelantadas.
date.timezone = America/Argentina/Buenos_Aires

; El código usa @ y accede a índices inexistentes por todos lados. Los errores no se muestran
; al cajero (romperían la impresión del ticket) y los avisos no ensucian el log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED & ~E_STRICT

expose_php = Off
memory_limit = 256M
max_execution_time = 120
post_max_size = 16M
upload_max_filesize = 16M

; Un turno completo sin que se caiga la sesión en el medio de una venta.
session.save_path = /var/lib/php/sessions
session.gc_maxlifetime = 43200
session.cookie_httponly = 1
session.use_strict_mode = 1
