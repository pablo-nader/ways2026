name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Un pull request que solo toca documentación o instrucciones de agentes no corre las
  # suites. En `push` a main corren siempre: esa corrida valida la punta que se despliega,
  # y su diff no cubre los commits de una corrida pendiente que GitHub haya descartado.
  # Los jobs pesados se saltean únicamente si este job dijo `codigo=false` de forma
  # explícita: si falla o no llega a decidir, corren igual (un job salteado cuenta como
  # aprobado para el ruleset de main, así que ante la duda no se saltea nada).
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
      desktop: ${{ steps.filtro.outputs.desktop }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El markdown bajo src/ y tests/ es código: hay tests que lo recorren.
      - name: Clasificar los archivos cambiados
        id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
          SOLO_DOCUMENTACION: '^(docs|odd|openspec|\.claude)/|^CLAUDE\.md$'
        run: |
          base="$BASE_PR"
          [ "$EVENTO" = "push" ] && base="$BASE_PUSH"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No se pudo resolver la base del diff: se corre todo."
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sin detección de renombres: mover un archivo de código a docs/ tiene que
          # listar también la ruta que desaparece.
          git diff --name-only --no-renames "$base" HEAD > cambiados.txt
          if [ "$EVENTO" != "pull_request" ] || [ ! -s cambiados.txt ] ||
            grep -qvE "$SOLO_DOCUMENTACION" cambiados.txt; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Solo cambió documentación: se saltean las suites."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^src/Ways\.Desktop/' cambiados.txt; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  backend-unit:
    needs: cambios
    if: ${{ !cancelled() && needs.cambios.outputs.codigo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Compilar los proyectos de test
        run: |
          dotnet build tests/Ways.Domain.Tests -c Release
          dotnet build tests/Ways.Application.Tests -c Release

      - name: Tests de Domain
        run: dotnet test tests/Ways.Domain.Tests -c Release --no-build

      - name: Tests de Application
        run: dotnet test tests/Ways.Application.Tests -c Release --no-build

  # Una sola suite de integración por daemon de Docker: dos en paralelo compiten
  # por el mismo contenedor y generan falsos rojos. Testcontainers levanta su
  # propio PostgreSQL (postgres:17-alpine) y el fixture crea el rol ways_app.
  # Por eso la suite se reparte en fragmentos que son jobs distintos (runners
  # distintos, cada uno con su daemon): nunca debe haber dos `dotnet test` en un
  # mismo job.
  backend-integration-fragmento:
    needs: cambios
    if: ${{ !cancelled() && needs.cambios.outputs.codigo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fragmento: [1, 2, 3]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Compilar la solución
        run: dotnet build Ways.slnx -c Release

      - name: Tests del script de fragmentación
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Calcular el filtro del fragmento
        env:
          FRAGMENTO: ${{ matrix.fragmento }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          mkdir -p resultados
          dotnet vstest tests/Ways.IntegrationTests/bin/Release/net10.0/Ways.IntegrationTests.dll \
            --ListFullyQualifiedTests --ListTestsTargetPath:resultados/lista.txt
          python3 .github/scripts/fragmentar_integracion.py plan \
            --lista resultados/lista.txt \
            --fragmento "$FRAGMENTO" \
            --total "$TOTAL" \
            --salida resultados/filtro.txt

      # --blame-hang corta un test que lleve más de 10 minutos colgado, en vez de
      # consumir todo el tope del job.
      - name: Tests de integración del fragmento
        env:
          FRAGMENTO: ${{ matrix.fragmento }}
        run: |
          dotnet test tests/Ways.IntegrationTests -c Release --no-build \
            --filter "$(cat resultados/filtro.txt)" \
            --logger "trx;LogFileName=fragmento-$FRAGMENTO.trx" \
            --results-directory resultados \
            --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Subir los resultados del fragmento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-fragmento-${{ matrix.fragmento }}
          path: resultados
          overwrite: true
          retention-days: 7

  # Es el check que exige el ruleset de main: debe conservar este nombre y correr aunque
  # los fragmentos fallen (`always()`), porque un job salteado cuenta como aprobado. Solo
  # se saltea cuando `cambios` dijo que no hay código que probar.
  backend-integration:
    needs: [cambios, backend-integration-fragmento]
    if: always() && needs.cambios.outputs.codigo != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir que todos los fragmentos hayan terminado bien
        env:
          RESULTADO: ${{ needs.backend-integration-fragmento.result }}
        run: |
          if [ "$RESULTADO" != "success" ]; then
            echo "Los fragmentos de integración terminaron con: $RESULTADO"
            exit 1
          fi

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar los resultados de los fragmentos
        uses: actions/download-artifact@v4
        with:
          pattern: integracion-fragmento-*
          path: fragmentos

      - name: Verificar que los fragmentos cubran la suite completa
        run: python3 .github/scripts/fragmentar_integracion.py verificar fragmentos/*

  web:
    needs: cambios
    if: ${{ !cancelled() && needs.cambios.outputs.codigo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hay tests que asumen el huso del negocio (offset distinto de cero, horas locales);
    # el runner corre en UTC.
    env:
      TZ: America/Argentina/Buenos_Aires
    defaults:
      run:
        working-directory: src/Ways.Web
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Ways.Web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx oxlint --quiet

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

  desktop:
    needs: cambios
    if: needs.cambios.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear el build de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/Ways.Desktop/src-tauri

      - name: Tests de Rust
        run: cargo test --locked
        working-directory: src/Ways.Desktop/src-tauri
