name: deploy-produccion

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      disparar_deploy:
        description: Avisar a EasyPanel después de publicar la imagen
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/pablo-nader/ways2026

jobs:
  deploy:
    if: >-
      github.repository == 'pablo-nader/ways2026' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA_VALIDADO: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # La etiqueta latest tiene que ser siempre la punta de main: si main avanzó desde el
      # commit que validó este ci, se omite y publica el ci del commit nuevo.
      - name: Verificar que el commit validado sigue siendo la punta de main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          punta=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$punta" != "$SHA_VALIDADO" ]; then
            echo "main avanzó a $punta; este ci validó $SHA_VALIDADO. Se omite el deploy."
            echo "OMITIR=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.OMITIR != '1'
        with:
          ref: ${{ env.SHA_VALIDADO }}

      - uses: docker/setup-buildx-action@v3
        if: env.OMITIR != '1'

      - uses: docker/login-action@v3
        if: env.OMITIR != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # El servidor de producción no compila: EasyPanel descarga esta imagen ya armada.
      - name: Armar y publicar la imagen
        if: env.OMITIR != '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ env.SHA_VALIDADO }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA_VALIDADO }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar el deploy en EasyPanel
        if: env.OMITIR != '1' && inputs.disparar_deploy != false
        env:
          URL_DE_DEPLOY: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$URL_DE_DEPLOY" ]; then
            echo "::error::Falta el secret EASYPANEL_DEPLOY_URL (EasyPanel > servicio aipos > Deployments > Deployment Trigger URL)."
            exit 1
          fi
          curl -fsS --max-time 30 -X POST "$URL_DE_DEPLOY" -o /dev/null
