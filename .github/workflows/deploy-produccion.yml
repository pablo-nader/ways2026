name: deploy-produccion

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'pablo-nader/ways2026' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # EasyPanel construye la punta actual de main, no un commit puntual: si main avanzó
      # desde el commit que validó este ci, se omite y despliega el ci del commit nuevo.
      - name: Verificar que el commit validado sigue siendo la punta de main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_VALIDADO: ${{ github.event.workflow_run.head_sha }}
        run: |
          punta=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$punta" != "$SHA_VALIDADO" ]; then
            echo "main avanzó a $punta; este ci validó $SHA_VALIDADO. Se omite el deploy."
            echo "OMITIR=1" >> "$GITHUB_ENV"
          fi

      - name: Disparar el deploy en EasyPanel
        if: env.OMITIR != '1'
        env:
          URL_DE_DEPLOY: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$URL_DE_DEPLOY" ]; then
            echo "::error::Falta el secret EASYPANEL_DEPLOY_URL (EasyPanel > servicio aipos > Deployments > Deployment Trigger URL)."
            exit 1
          fi
          curl -fsS --max-time 30 -X POST "$URL_DE_DEPLOY" -o /dev/null
